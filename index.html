// ---------------- Ranking ----------------
async function loadRanking(){
  try{
    const [hist, vendas] = await Promise.all([
      sb('ranking_historico?select=vendedor,ano,mes,valor,ativo', undefined, 1),
      rpc('vendas_resumo', {}, 1)
    ]);
    state.ranking = {
      hist: (hist||[]).map(r=>({...r, valor:Number(r.valor)})),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar ranking', e);
    state.ranking = {erro:true};
  }
  render();
}

function montarRanking(ano){
  const R = state.ranking, hoje = new Date();
  const mesAtual = ano===hoje.getFullYear() ? hoje.getMonth()+1 : 12;
  const hist = R.hist.filter(r=>r.ano===ano);
  const mesesHist = [...new Set(hist.filter(r=>r.mes).map(r=>r.mes))].sort((a,b)=>a-b);
  const primeiro = mesesHist.length ? mesesHist[0] : 1;
  const ultimoHist = mesesHist.length ? mesesHist[mesesHist.length-1] : 0;
  const meses = []; for(let m=primeiro; m<=mesAtual; m++) meses.push(m);
  const vendasAno = R.vendas.filter(v=>v.data.slice(0,4)===String(ano));
  const nomes = new Set([...hist.filter(r=>r.ativo).map(r=>r.vendedor), ...VENDORES]);
  const ativos = [...nomes].map(nome=>{
    const valores = meses.map(m=>{
      if(m <= ultimoHist){ const h = hist.find(r=>r.vendedor===nome && r.mes===m); return h ? h.valor : null; }
      const vs = vendasAno.filter(v=>v.vendedor===nome && Number(v.data.slice(5,7))===m);
      if(vs.length) return vs.reduce((s,v)=>s+v.valor,0);
      return VENDORES.includes(nome) ? 0 : null;
    });
    const total = valores.reduce((s,x)=>s+(x||0),0);
    // media: meses em que estava no time (o mes atual so conta se ja vendeu)
    const mesesConta = valores.filter((x,i)=>x!==null && (meses[i]<mesAtual || x>0)).length;
    return {nome, valores, total, media: mesesConta ? total/mesesConta : 0, ativoHoje: VENDORES.includes(nome)};
  }).filter(x=>x.total>0 || x.ativoHoje).sort((a,b)=>b.total-a.total);
  const sairam = hist.filter(r=>!r.ativo).sort((a,b)=>b.valor-a.valor);
  const totalSairam = sairam.reduce((s,r)=>s+r.valor,0);
  const totalAno = ativos.reduce((s,x)=>s+x.total,0) + totalSairam;
  const iAtual = meses.indexOf(mesAtual);
  const totalMesAtual = iAtual>=0 ? ativos.reduce((s,x)=>s+(x.valores[iAtual]||0),0) : 0;
  const venderamMes = iAtual>=0 ? ativos.filter(x=>x.ativoHoje && (x.valores[iAtual]||0)>0).length : 0;
  return {meses, ativos, sairam, totalSairam, totalAno, mesAtual, totalMesAtual, venderamMes, iAtual};
}

  antes do site) + vendas registradas no site dentro do periodo, so dos canais da

*/
ICONES.campanhas = '<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/>';

async function loadCampanhas(){
  try{
    const [lista, ajustes, vendas] = await Promise.all([
      sb('campanhas?select=*&order=inicio.desc', undefined, 1),
      sb('campanha_ajustes?select=campanha_id,vendedor,valor', undefined, 1),
      rpc('vendas_resumo', {}, 1)
    ]);
    state.camp = {
      lista: (lista||[]).map(c=>({...c, meta:Number(c.meta), marco_valor: c.marco_valor!=null ? Number(c.marco_valor) : null})),
      ajustes: (ajustes||[]).map(a=>({...a, valor:Number(a.valor)})),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar campanhas', e);
    state.camp = {erro:true};
  }
  render();
}

function progressoCampanha(c, vendedor){
  const C = state.camp;
  const base = (C.ajustes.find(a=>a.campanha_id===c.id && a.vendedor===vendedor)||{}).valor || 0;
  const vale = v => v.vendedor===vendedor && v.data>=c.inicio && v.data<=c.fim && (!c.canais.length || c.canais.includes(v.canal));
  const vendas = C.vendas.filter(vale);
  const site = vendas.reduce((s,v)=>s+v.valor,0);
  const total = base + site;
  const ateMarco = c.marco_ate ? base + vendas.filter(v=>v.data<=c.marco_ate).reduce((s,v)=>s+v.valor,0) : 0;
  return {base, site, nVendas: vendas.length, total, pct: total/c.meta, bateu: total>=c.meta,
          marcoOk: !!(c.marco_valor && ateMarco>=c.marco_valor), ateMarco};
}

function statusCampanha(c, pr){
  const hoje = todayKey();
  if(pr.bateu) return {cls:'ok', txt:'🏆 Meta batida! O prêmio é seu.'};
  if(pr.marcoOk) return {cls:'ok', txt:`Antecipação garantida: o prêmio já é seu. Faltam ${BRL.format(c.meta-pr.total)} para confirmar até ${dataCurta(c.fim)}.`};
  if(hoje > c.fim) return {cls:'', txt:`Campanha encerrada com ${BRL.format(pr.total)}.`};
  if(c.marco_valor && c.marco_ate && hoje <= c.marco_ate)
    return {cls:'', txt:`Faltam ${BRL.format(c.marco_valor-pr.ateMarco)} para a antecipação até ${dataCurta(c.marco_ate)} · ${BRL.format(c.meta-pr.total)} para a meta.`};
  const dias = diasUteisEntre(hoje, c.fim);
  return {cls:'', txt:`Faltam ${BRL.format(c.meta-pr.total)} até ${dataCurta(c.fim)}${dias ? ` · cerca de ${brlCurto((c.meta-pr.total)/dias)} por dia útil` : ''}.`};
}

function barraCampanha(c, pr, alto){
  const marco = c.marco_valor ? Math.min(100, c.marco_valor/c.meta*100) : null;
  return `<div class="camp-barra" style="height:${alto||12}px;">
    <i style="width:${Math.min(100, pr.pct*100)}%;"></i>
    ${marco!==null ? `<span class="camp-marco" style="left:${marco}%;" title="Antecipação: ${BRL.format(c.marco_valor)} até ${dataCurta(c.marco_ate)}"></span>` : ''}
  </div>`;
}

function periodoCampanha(c){
  const hoje = todayKey();
  if(hoje < c.inicio) return `<span class="pill">começa em ${dataCurta(c.inicio)}</span>`;
  if(hoje > c.fim) return `<span class="pill">encerrada em ${dataCurta(c.fim)}</span>`;
  const dias = Math.round((dDe(c.fim) - dDe(hoje)) / 864e5);
  return `<span class="pill live">valendo · ${dias===0 ? 'último dia' : `faltam ${dias} ${dias===1?'dia':'dias'}`}</span>`;
}

async function salvarBaseCampanha(id, vendedor, texto){
  const valor = parseBRL(texto);
  if(Number.isNaN(valor) || (valor!==null && valor<0)){ alert('Digita um valor válido, por exemplo 1.050.000'); render(); return; }
  try{
    await sb('campanha_ajustes?on_conflict=campanha_id,vendedor', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{campanha_id:id, vendedor, valor: valor||0}});
  }catch(e){
    console.error('Falha ao salvar base da campanha', e);
    alert('Não foi possível salvar. Tenta de novo.');
  }
  await loadCampanhas();
}

async function alternarCampanha(id){
  const c = state.camp.lista.find(x=>x.id===id);
  if(!confirm(c.ativa ? `Ocultar "${c.titulo}" da Central do Vendedor?` : `Mostrar "${c.titulo}" para os vendedores?`)) return;
  try{ await sb('campanhas?id=eq.'+id, {method:'PATCH', prefer:'return=minimal', body:{ativa:!c.ativa}}); }
  catch(e){ console.error(e); alert('Não foi possível alterar a campanha.'); return; }
  await loadCampanhas();
}

function lerCampanhaForm(){
  const f = state.campForm, val = id => document.getElementById(id).value;
  f.titulo = val('cfTitulo').trim(); f.premio = val('cfPremio').trim();
  f.inicio = val('cfInicio'); f.fim = val('cfFim');
  f.meta = parseBRL(val('cfMeta')); f.marco_valor = parseBRL(val('cfMarco')); f.marco_ate = val('cfMarcoAte');
  f.marco_texto = val('cfTexto').trim();
  f.canais = [...document.querySelectorAll('.cf-canal:checked')].map(x=>x.value);
}
function bindCampanhaDrawer(){
  const bg = document.getElementById('campBg');
  const fechar = ()=>{ state.campForm = null; render(); };
  bg.onclick = e=>{ if(e.target===bg) fechar(); };
  document.getElementById('cfCancelar').onclick = fechar;
  document.getElementById('cfArte').onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    lerCampanhaForm();
    if(file.size > 2*1024*1024){ alert('A arte precisa ter até 2 MB. Exporte em JPG ou WEBP e tenta de novo.'); return; }
    state.campForm.enviando = true; render();
    try{
      const ext = (file.type.split('/')[1]||'jpg').replace('jpeg','jpg');
      const caminho = `campanhas/${slugNome(state.campForm.titulo||'campanha')}-${Date.now()}.${ext}`;
      const res = await fetch(SUPABASE_URL + '/storage/v1/object/fotos/' + caminho, {method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type': file.type}, body:file});
      if(!res.ok) throw new Error('HTTP '+res.status);
      state.campForm.imagem_url = SUPABASE_URL + '/storage/v1/object/public/fotos/' + caminho;
    }catch(err){
      console.error('Falha ao enviar arte', err);
      alert('Não foi possível enviar a arte. Tenta de novo.');
    }
    if(state.campForm){ state.campForm.enviando = false; render(); }
  };
  document.getElementById('cfSalvar').onclick = salvarCampanha;
}
async function salvarCampanha(){
  lerCampanhaForm();
  const f = state.campForm;
  if(!f.titulo){ alert('Dá um nome para a campanha.'); return; }
  if(!f.inicio || !f.fim || f.fim < f.inicio){ alert('Confere as datas: o fim precisa ser depois do início.'); return; }
  if(!f.meta || Number.isNaN(f.meta) || f.meta<=0){ alert('Digita a meta em reais, por exemplo 5.000.000'); return; }
  if(Number.isNaN(f.marco_valor)){ alert('O valor da antecipação não está certo.'); return; }
  if(f.marco_valor && !f.marco_ate){ alert('Escolhe até que data vale a antecipação.'); return; }
  const corpo = {titulo:f.titulo, premio:f.premio||null, inicio:f.inicio, fim:f.fim, meta:f.meta, canais:f.canais,
    marco_valor:f.marco_valor||null, marco_ate:f.marco_valor ? f.marco_ate : null, marco_texto:f.marco_texto||null,
    imagem_url:f.imagem_url||null, ativa:f.ativa!==false};
  try{
    if(f.id) await sb('campanhas?id=eq.'+f.id, {method:'PATCH', prefer:'return=minimal', body:corpo});
    else await sb('campanhas', {method:'POST', prefer:'return=minimal', body:corpo});
  }catch(e){
    console.error('Falha ao salvar campanha', e);
    alert('Não foi possível salvar a campanha. Tenta de novo.');
    return;
  }
  state.campForm = null;
  await loadCampanhas();
  showCronoToast('Campanhas', 'Campanha salva');
}
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && state.campForm){ state.campForm = null; render(); } });

/*
  Minha meta: o vendedor escolhe quanto quer vender no mes e ve o funil necessario,
  pela regra da FBS (ticket medio e funil de 1 venda, editaveis no admin) e pelo
  historico dele (as taxas reais das semanas fechadas). A atividade e proporcional
  a meta (cotas de R$ 100 mil); vendas aparecem no ticket medio. Semana = mes / 4,
  dia util = semana / 5 (a mesma divisao das metas fixas: 600 -> 150 -> 30).
  So o vendedor e o gestor veem.
*/
ICONES.minhameta = ICONES.metas;
CENTRAL_PAGINAS.splice(CENTRAL_PAGINAS.findIndex(p=>p.id==='desempenho')+1, 0, {id:'minhameta', nome:'Minha meta'});
const REGRA_META_PADRAO = {ticket:500000, ligacoes:600, agendamentos:20, comparecimentos:7};
const mesAtualKey = () => todayKey().slice(0,7);
const nomeMes = k => `${MESES[Number(k.slice(5,7))-1]} de ${k.slice(0,4)}`;

async function loadMetasPessoais(){
  const doVendedor = state.view==='app' ? '&vendedor='+eq(state.vendor) : '';
  try{
    const [cfg, metas] = await Promise.all([
      sb('config?select=valor&chave=eq.regra_meta', undefined, 1),
      sb('metas_pessoais?select=vendedor,mes,valor,plano,atualizado_em&order=mes.desc'+doVendedor, undefined, 1)
    ]);
    const r = cfg && cfg[0] && cfg[0].valor;
    state.mp = {
      regra: r && r.ticket ? {...REGRA_META_PADRAO, ...r} : {...REGRA_META_PADRAO},
      metas: (metas||[]).map(m=>({...m, valor:Number(m.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar metas pessoais', e);
    state.mp = {erro:true};
  }
  render();
}

// Taxas reais do vendedor nas semanas fechadas (so semanas com ligacoes registradas no site)
function taxasHistorico(v, regra){
  const D = state.desemp, hoje = todayKey();
  let L=0, A=0, C=0, V=0, Rv=0, Vv=0, n=0, desde=null;
  D.semanas.filter(s=>s.vendedor===v && s.fim < hoje).forEach(s=>{
    const lig = D.dias.filter(x=>x.vendedor===v && x.dia>=s.ini && x.dia<=s.fim).reduce((a,x)=>a+x.total,0);
    if(!lig) return;
    L += lig; A += s.agendamentos||0; C += s.comparecimentos||0; V += s.vendas||0; n++;
    if(s.vendas && Number(s.receita)){ Rv += Number(s.receita); Vv += s.vendas; }
    if(!desde || s.ini < desde) desde = s.ini;
  });
  const fbs = {la: regra.ligacoes/regra.agendamentos, ac: regra.agendamentos/regra.comparecimentos, cv: regra.comparecimentos};
  const la = A>0 ? L/A : null, ac = C>0 ? A/C : null, cv = V>0 ? C/V : null;
  const ticket = Vv>=2 ? Rv/Vv : null;
  const cvU = cv ?? fbs.cv, acU = ac ?? fbs.ac, laU = la ?? fbs.la;
  return {n, desde, L, A, C, V, la, ac, cv, ticket,
    porVenda: {comparecimentos: cvU, agendamentos: cvU*acU, ligacoes: cvU*acU*laU},
    ticketUsado: ticket ?? regra.ticket,
    completo: la!==null && ac!==null && cv!==null};
}
function planoMeta(valor, porVenda, ticket){
  const vendas = valor / ticket;
  const mes = {
    ligacoes: Math.ceil(vendas*porVenda.ligacoes - 1e-9),
    agendamentos: Math.ceil(vendas*porVenda.agendamentos - 1e-9),
    comparecimentos: Math.ceil(vendas*porVenda.comparecimentos - 1e-9)
  };
  const semana = {}, dia = {};
  Object.keys(mes).forEach(k=>{ semana[k] = Math.ceil(mes[k]/4 - 1e-9); dia[k] = Math.ceil(semana[k]/5 - 1e-9); });
  return {vendas, vendasMin: Math.ceil(vendas - 1e-9), mes, semana, dia, ticket};
}
const planoPadrao = (valor, regra) => planoMeta(valor, {ligacoes:regra.ligacoes, agendamentos:regra.agendamentos, comparecimentos:regra.comparecimentos}, regra.ticket);
const vendasTexto = p => { const v = Math.round(p.vendas*10)/10; return Number.isInteger(v) ? `${v} ${v===1?'venda':'vendas'}` : `${v.toLocaleString('pt-BR')} vendas (pelo menos ${p.vendasMin})`; };

function tabelaPlano(p){
  const linha = (rotulo, k) => `<tr><td>${rotulo}</td><td class="r"><b>${p.mes[k].toLocaleString('pt-BR')}</b></td><td class="r">${p.semana[k].toLocaleString('pt-BR')}</td><td class="r">${p.dia[k].toLocaleString('pt-BR')}</td></tr>`;
  return `<table class="tbl">
    <thead><tr><th></th><th class="r">No mês</th><th class="r">Por semana</th><th class="r">Por dia útil</th></tr></thead>
    <tbody>
      ${linha('Ligações','ligacoes')}${linha('Agendamentos','agendamentos')}${linha('Comparecimentos','comparecimentos')}
      <tr><td>Vendas</td><td class="r" colspan="3"><b style="color:var(--a-gold);">${vendasTexto(p)}</b> <span class="mute">· ticket ${brlCurto(p.ticket)}</span></td></tr>
    </tbody></table>`;
}

function htmlPlanos(valor, v){
  const M = state.mp;
  if(!valor || valor<=0) return `<div class="card"><div class="card-b" style="padding:26px;text-align:center;color:var(--a-dim);">Digite quanto você quer vender no mês para ver o caminho.</div></div>`;
  const pP = planoPadrao(valor, M.regra);
  const h = taxasHistorico(v, M.regra);
  const pH = planoMeta(valor, h.porVenda, h.ticketUsado);
  const fmt = x => x==null ? '—' : (Math.round(x*10)/10).toLocaleString('pt-BR');
  return `
    <div class="mm-planos">
      <div class="card">
        <div class="card-h"><h3>Padrão FBS</h3><span class="hint">1 venda = ${M.regra.ligacoes} ligações · ${M.regra.agendamentos} agendamentos · ${M.regra.comparecimentos} comparecimentos</span></div>
        <div class="scroll-x">${tabelaPlano(pP)}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Pelo seu histórico</h3><span class="hint">${h.n ? `${h.n} semanas fechadas desde ${dataCurta(h.desde)}` : 'sem semanas fechadas ainda'}</span></div>
        <div class="scroll-x">${tabelaPlano(pH)}</div>
        <div class="card-b" style="padding-top:12px;font-size:12px;color:var(--a-dim);line-height:1.6;">
          Você faz <b style="color:var(--text);">1 agendamento a cada ${fmt(h.la)} ligações</b> · ${h.ac ? `<b style="color:var(--text);">${Math.round(100/h.ac)}%</b> dos agendados comparecem` : 'comparecimento: —'} · ${h.cv ? `<b style="color:var(--text);">1 venda a cada ${fmt(h.cv)} comparecimentos</b>` : 'ainda sem venda nas semanas fechadas'}${h.ticket ? ` · seu ticket médio: <b style="color:var(--text);">${brlCurto(h.ticket)}</b>` : ''}.
          ${!h.completo ? '<br><span style="color:#E59866;">Onde ainda falta histórico, usamos o padrão FBS.</span>' : ''}
        </div>
      </div>
    </div>`;
}

function htmlProgressoMeta(meta, v){
  const M = state.mp, hoje = todayKey(), iniMes = hoje.slice(0,8)+'01', fimM = fimMes(hoje), iniSem = inicioSemana(hoje);
  const plano = planoPadrao(meta.valor, M.regra);
  const r = desempenhoPeriodo(v, iniMes, hoje);
  const sem = desempenhoPeriodo(v, iniSem, hoje);
  const restantes = diasUteisEntre(hoje, fimM);
  const faltaLig = Math.max(0, plano.mes.ligacoes - r.ligacoes);
  const item = (rotulo, feito, alvo) => `
    <div style="margin-top:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;"><span>${rotulo}</span><span><b>${feito.toLocaleString('pt-BR')}</b> <span class="mute">/ ${alvo.toLocaleString('pt-BR')}</span></span></div>
      <div class="barra" style="min-width:0;height:8px;"><i style="width:${Math.min(100,pct(feito,alvo))}%;background:${feito>=alvo?'#5FD39A':'var(--a-gold)'};"></i></div>
    </div>`;
  return `
    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Seu caminho em ${MESES[Number(hoje.slice(5,7))-1].toLowerCase()}</h3><span class="hint">meta salva: <b style="color:var(--a-gold);">${BRL.format(meta.valor)}</b></span></div>
      <div class="card-b">
        <div class="mm-progresso">
          <div>
            <div class="mute" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;">Produção no mês</div>
            <div class="serif" style="font-size:30px;color:var(--a-gold);">${BRL.format(r.receita)}</div>
            <div class="barra" style="min-width:0;height:12px;margin:8px 0 6px;"><i style="width:${Math.min(100,pct(r.receita,meta.valor))}%;background:var(--a-gold);"></i></div>
            <div style="font-size:12px;color:var(--a-dim);">${pct(r.receita,meta.valor)}% da sua meta · ${r.vendas} ${r.vendas===1?'venda':'vendas'} de ${plano.vendasMin}</div>
            <div class="camp-status ${faltaLig ? '' : 'ok'}" style="font-size:13px;">${faltaLig
              ? `Faltam ${faltaLig.toLocaleString('pt-BR')} ligações: <b>${restantes ? Math.ceil(faltaLig/restantes) : faltaLig} por dia útil</b> nos ${restantes} ${restantes===1?'dia útil restante':'dias úteis restantes'}.`
              : 'Você já fez as ligações do mês para a sua meta. Agora é converter!'}</div>
          </div>
          <div>
            ${item('Ligações no mês', r.ligacoes, plano.mes.ligacoes)}
            ${item('Agendamentos', r.agendamentos, plano.mes.agendamentos)}
            ${item('Comparecimentos', r.comparecimentos, plano.mes.comparecimentos)}
            ${item('Ligações nesta semana', sem.ligacoes, plano.semana.ligacoes)}
          </div>
        </div>
      </div>
    </div>`;
}

function paginaMinhaMeta(){
  const mes = mesAtualKey();
  const top = {titulo:'Minha meta', sub:`${nomeMes(mes)} · só você e o gestor veem`};
  if(!state.mp || !state.desemp) return {top, html:`<div class="card"><div class="card-b" style="padding:30px;text-align:center;color:var(--a-dim);">Carregando...</div></div>`};
  if(state.mp.erro || state.desemp.erro) return {top, html:`<div class="alerta"><div class="t">Não consegui carregar agora. Tenta de novo em instantes.</div></div>`};
  const v = state.vendor;
  const salva = state.mp.metas.find(m=>m.vendedor===v && m.mes===mes);
  if(state.mmValor == null) state.mmValor = salva ? salva.valor : 1000000;
  const valor = state.mmValor;
  const chips = [500000, 1000000, 1500000, 2000000, 3000000];
  const html = `
    ${salva ? htmlProgressoMeta(salva, v) : ''}
    <div class="card mm-calc" style="margin-bottom:18px;">
      <div class="card-b" style="padding-top:20px;">
        <label for="mmValor" class="mute" style="display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Quanto você quer vender em ${MESES[Number(mes.slice(5,7))-1].toLowerCase()}?</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <input id="mmValor" class="valor-grande" inputmode="decimal" value="${valor ? valor.toLocaleString('pt-BR') : ''}" placeholder="1.000.000" style="width:240px;padding:12px 14px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${chips.map(c=>`<button class="btn small ${c===valor?'gold':''}" data-mm-chip="${c}">${brlCurto(c)}</button>`).join('')}</div>
          <button class="btn gold" id="mmSalvar" style="margin-left:auto;">${salva ? (salva.valor===valor ? '✓ Meta salva' : 'Atualizar minha meta') : 'Salvar como minha meta'}</button>
        </div>
        <div id="mmResumo" style="font-size:13px;color:var(--a-dim);margin-top:10px;">${valor ? `${BRL.format(valor)} = ${vendasTexto(planoPadrao(valor, state.mp.regra))} no ticket médio de ${brlCurto(state.mp.regra.ticket)}.` : ''}</div>
      </div>
    </div>
    <div id="mmResultado">${htmlPlanos(valor, v)}</div>`;
  const bind = app=>{
    const inp = document.getElementById('mmValor');
    const atualizar = ()=>{
      const n = parseBRL(inp.value);
      state.mmValor = Number.isNaN(n) ? null : n;
      document.getElementById('mmResultado').innerHTML = htmlPlanos(state.mmValor, v);
      document.getElementById('mmResumo').textContent = state.mmValor ? `${BRL.format(state.mmValor)} = ${vendasTexto(planoPadrao(state.mmValor, state.mp.regra)).replace(/<[^>]+>/g,'')} no ticket médio de ${brlCurto(state.mp.regra.ticket)}.` : '';
      app.querySelectorAll('[data-mm-chip]').forEach(b=>b.classList.toggle('gold', Number(b.getAttribute('data-mm-chip'))===state.mmValor));
      const bt = document.getElementById('mmSalvar');
      bt.textContent = salva ? (salva.valor===state.mmValor ? '✓ Meta salva' : 'Atualizar minha meta') : 'Salvar como minha meta';
    };
    inp.oninput = atualizar;
    app.querySelectorAll('[data-mm-chip]').forEach(b=>{ b.onclick = ()=>{ inp.value = Number(b.getAttribute('data-mm-chip')).toLocaleString('pt-BR'); atualizar(); }; });
    document.getElementById('mmSalvar').onclick = ()=>salvarMetaPessoal(v, mes, state.mmValor);
  };
  return {top, html, bind};
}

async function salvarMetaPessoal(v, mes, valor){
  if(!valor || valor<=0 || Number.isNaN(valor)){ alert('Digita a meta em reais, por exemplo 1.000.000'); return; }
  const M = state.mp, h = taxasHistorico(v, M.regra);
  // guarda o retrato do momento: regra, taxas do vendedor e os dois planos
  const plano = {regra: M.regra, historico: {semanas:h.n, desde:h.desde, ligacoes_por_agendamento:h.la, agendamentos_por_comparecimento:h.ac, comparecimentos_por_venda:h.cv, ticket:h.ticket},
    padrao: planoPadrao(valor, M.regra), pelo_historico: planoMeta(valor, h.porVenda, h.ticketUsado)};
  try{
    await sb('metas_pessoais?on_conflict=vendedor,mes', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{vendedor:v, mes, valor, plano, atualizado_em:new Date().toISOString()}});
  }catch(e){
    console.error('Falha ao salvar meta pessoal', e);
    alert('Não foi possível salvar a meta. Tenta de novo.');
    return;
  }
  await loadMetasPessoais();
  showCronoToast('Minha meta', `${BRL.format(valor)} em ${MESES[Number(mes.slice(5,7))-1].toLowerCase()}`);
}

// ---------------- Admin: regra + metas individuais (abaixo das metas fixas) ----------------
function htmlMetasIndividuais(){
  const M = state.mp, D = state.desemp;
  if(!M || !D) return `<div class="card" style="margin-top:18px;"><div class="card-b" style="padding:24px;text-align:center;color:var(--a-dim);">Carregando metas individuais...</div></div>`;
  if(M.erro || D.erro) return `<div class="alerta" style="margin-top:18px;"><div class="t">Não consegui carregar as metas individuais.</div></div>`;
  const mes = mesAtualKey(), hoje = todayKey(), iniMes = hoje.slice(0,8)+'01', fimM = fimMes(hoje);
  const passados = diasUteisEntre(iniMes, hoje), totalDias = diasUteisEntre(iniMes, fimM);
  const linhas = VENDORES.map(v=>{
    const meta = M.metas.find(m=>m.vendedor===v && m.mes===mes);
    const r = desempenhoPeriodo(v, iniMes, hoje);
    const plano = meta ? planoPadrao(meta.valor, M.regra) : null;
    const esperadoLig = plano ? plano.mes.ligacoes * passados / Math.max(1,totalDias) : 0;
    return {v, meta, r, plano, ritmo: plano && esperadoLig ? r.ligacoes/esperadoLig : null};
  });
  const comMeta = linhas.filter(x=>x.meta);
  const somaMetas = comMeta.reduce((s,x)=>s+x.meta.valor,0);
  const realizado = linhas.reduce((s,x)=>s+x.r.receita,0);
  const realizadoComMeta = comMeta.reduce((s,x)=>s+x.r.receita,0);
  const historico = M.metas.filter(m=>m.mes < mes);
  const ritmoPill = x => x.ritmo==null ? '<span class="mute">—</span>' : (x.ritmo>=1 ? `<span class="pill ok">no ritmo · ${Math.round(x.ritmo*100)}%</span>` : (x.ritmo>=.7 ? `<span class="pill">${Math.round(x.ritmo*100)}% do ritmo</span>` : `<span class="pill warn">${Math.round(x.ritmo*100)}% do ritmo</span>`));
  return `
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a-gold);font-weight:700;margin:34px 0 4px;">Metas individuais</div>
    <h2 class="serif" style="font-size:26px;margin:0 0 4px;">${nomeMes(mes)}</h2>
    <div style="color:var(--a-dim);font-size:14px;margin-bottom:18px;">Cada vendedor escolhe a própria meta em "Minha meta" (só ele e você veem). Você também pode definir ou corrigir aqui.</div>
    <div class="kpis">
      <div class="kpi destaque"><div class="l">Se todos baterem</div><div class="v">${brlCurto(somaMetas)}</div><div class="d">soma das metas individuais</div></div>
      <div class="kpi"><div class="l">Produzido no mês</div><div class="v">${brlCurto(realizado)}</div><div class="d">${BRL.format(realizado)}</div></div>
      <div class="kpi"><div class="l">Atingido</div><div class="v">${somaMetas ? pct(realizadoComMeta, somaMetas)+'%' : '—'}</div><div class="d">de quem tem meta</div></div>
      <div class="kpi"><div class="l">Com meta definida</div><div class="v">${comMeta.length}<span style="font-size:17px;color:var(--a-dim);"> / ${VENDORES.length}</span></div><div class="d">${passados} de ${totalDias} dias úteis passados</div></div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Por vendedor</h3><span class="hint">feito / necessário no mês pela regra da FBS</span></div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Vendedor</th><th class="r">Meta do mês</th><th class="r">Vendas</th><th class="r">Ligações</th><th class="r">Agend.</th><th class="r">Comp.</th><th class="r">Produção</th><th>Atingido</th><th>Ritmo de ligações</th></tr></thead>
          <tbody>
            ${linhas.map(x=>`<tr>

function bindMetasIndividuais(app){
  app.querySelectorAll('.mm-admin').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = inp.getAttribute('data-vendedor'), valor = parseBRL(inp.value), mes = mesAtualKey();
      if(Number.isNaN(valor)){ alert('Digita um valor válido, por exemplo 1.000.000'); render(); return; }
      if(valor===null){
        if(!confirm(`Tirar a meta de ${v} em ${nomeMes(mes).toLowerCase()}?`)){ render(); return; }
        try{ await sb('metas_pessoais?vendedor='+eq(v)+'&mes=eq.'+mes, {method:'DELETE'}); }catch(e){ alert('Não foi possível tirar a meta.'); }
        await loadMetasPessoais();
        return;
      }
      await salvarMetaPessoal(v, mes, valor);
    };
  });
  const bt = document.getElementById('rgSalvar');
  if(bt) bt.onclick = async ()=>{
    const regra = {ticket: parseBRL(document.getElementById('rgTicket').value), ligacoes: Number(document.getElementById('rgLig').value),
      agendamentos: Number(document.getElementById('rgAg').value), comparecimentos: Number(document.getElementById('rgComp').value)};
    if(!regra.ticket || Number.isNaN(regra.ticket) || [regra.ligacoes, regra.agendamentos, regra.comparecimentos].some(x=>!x || x<1)){
      alert('Confere os valores: ticket em reais e números maiores que zero.'); return;
    }
    if(!confirm(`Salvar a regra?\n\nTicket médio ${BRL.format(regra.ticket)}\n1 venda = ${regra.ligacoes} ligações, ${regra.agendamentos} agendamentos, ${regra.comparecimentos} comparecimentos`)) return;
    try{
      await sb('config?on_conflict=chave', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{chave:'regra_meta', valor:regra, atualizado_em:new Date().toISOString()}});
    }catch(e){ console.error(e); alert('Não foi possível salvar a regra.'); return; }
    await loadMetasPessoais();
    showCronoToast('Metas', 'Regra da calculadora salva');
  };
}

// acompanha em tempo real: tela do cliente a cada 3s, painel a cada 6s, vendedor a cada 30s
let atTicks = 0, atLojaIds = null;
function atBip(){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.35);
  }catch(e){}
}
setInterval(async ()=>{
  atTicks++;
  if(document.hidden || !sessao || !state.at.lista) return;
  const espera = state.view==='app' && Object.keys(state.at.espera).length;
  const gestor = state.view==='admin';
  if(!espera && !(gestor && atTicks%2===0) && !(state.view==='app' && atTicks%10===0)) return;
  const mudou = await loadAtendimentos(true);
  if(gestor){
    const ids = atLoja().map(a=>a.id);
    if(atLojaIds){
      const novo = atLoja().find(a=>!atLojaIds.includes(a.id));
      if(novo){ atBip(); showCronoToast('Aprovação na loja', `${esc(novo.clientes.nome)} · ${esc(novo.vendedor)}`); }
    }
    atLojaIds = ids;
    const badge = document.querySelector('[data-pagina="atendimentos"] .badge');
    if(badge) badge.textContent = atPendGestor();
  }
  if(state.view==='app'){ atSincEspera(); atPintarPops(); }
  if(!mudou) return;
  const digitando = document.activeElement && (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable);
  if(gestor && state.adminTab==='atendimentos' && !state.at.drawerId && !digitando) render();
  else if(state.view==='app' && state.centralTab==='atendimentos' && !digitando) render();
}, 3000);

function atErroTexto(e){
  const m = String(e && e.message || '');

}

async function atEnviarLoja(id){

function atSincEspera(){
  const E = state.at.espera, L = state.at.lista;
  if(!L) return;
  L.forEach(a=>{ if(a.situacao==='aprovacao_loja' && !(a.id in E)) E[a.id] = Date.now(); });
  Object.keys(E).forEach(id=>{ const a = L.find(x=>x.id===Number(id)); if(!a || !['aprovacao_loja','aprovado','reprovado'].includes(a.situacao)) delete E[id]; });

  if(a.situacao==='aprovado')
    return `<div class="at-pop"><div class="at-pop-l"><span class="at-spin"></span><div style="min-width:0;"><b>Proposta enviada ao financeiro</b><small>${nome} · em andamento</small></div></div><div class="at-pop-a"><button class="btn small" data-pop="fechar" data-id="${id}">Fechar aviso</button><button class="btn small gold" data-pop="venda" data-id="${id}">Concluir e cadastrar venda</button></div></div>`;
  return `<div class="at-pop"><div class="at-pop-t">Precisamos confirmar mais alguns dados com você</div><small>${nome}</small>${!cheia && a.aprovacao_motivo ? `<div class="at-pop-priv">Só você vê: ${esc(a.aprovacao_motivo)}</div>` : ''}<div class="at-pop-a"><button class="btn small" data-pop="fechar" data-id="${id}">Entendi</button></div></div>`;

let atPopsUltimo = '';
function atPintarPops(){
  let box = document.getElementById('atPops');
  if(!box){
    box = document.createElement('div');
    box.id = 'atPops';
    box.className = 'at-tema';
    box.setAttribute('aria-live', 'polite');
    box.onclick = e=>{ const b = e.target.closest('[data-pop]'); if(b) atPopAcao(b.getAttribute('data-pop'), Number(b.getAttribute('data-id'))); };
    document.body.appendChild(box);
  }
  const L = state.at.lista || [];
  const html = state.view!=='app' ? '' : Object.keys(state.at.espera).map(id=>L.find(x=>x.id===Number(id))).filter(Boolean).map(atPopHtml).join('');
  if(html === atPopsUltimo) return; // mesmo conteudo: nao reinicia a animacao
  atPopsUltimo = html;
  box.innerHTML = html;
}
async function atPopAcao(acao, id){
  const A = state.at;
  if(acao==='fechar'){ delete A.espera[id]; render(); return; }
  if(acao==='gerar'){
    try{ await rpc('marcar_proposta', {p_id:id}); await loadAtendimentos(true); render(); }
    catch(e){ console.error(e); alert(atErroTexto(e)); }
    return;
  }
  // agendar e cadastrar venda sao coisas do vendedor: saem da tela do cliente
  atSairCheia();
  if(A.fichaId && A.fichaId!==id) await atSalvar(true);
  A.fichaId = id; A.passo = acao==='venda' ? 'fechou' : 'agendar'; state.centralTab = 'atendimentos';
  render();
  window.scrollTo(0,0);
}

    <div class="rel-wrap">

        <button class="rel-item ${t.id===aberta.id?'on':''}" data-tabela="${t.id}"><span class="ic">PDF</span><span style="min-width:0;">${esc(t.titulo)}<small>enviada em ${new Date(t.criado_em).toLocaleDateString('pt-BR')}</small></span></button>`).join('')}`).join('')}</div>
      <div class="card viewer">
        <div class="card-h"><h3>${esc(aberta.administradora)} · ${esc(aberta.titulo)}</h3><span style="display:flex;gap:8px;">${rep ? `<button class="btn small ghost so-rep" data-tabela-del="${aberta.id}">Remover</button>` : ''}<a class="btn small" href="${url(aberta)}" target="_blank" rel="noopener">${icone('baixar')}Abrir em nova aba</a></span></div>
        <iframe src="${url(aberta)}#view=FitH" title="Tabela ${esc(aberta.titulo)}"></iframe>
      </div>
    </div>`}`;
}
function bindTabelas(app){
  app.querySelectorAll('[data-tabela]').forEach(b=>{ b.onclick = ()=>{
    const t = state.at.tabelas.find(x=>x.id===Number(b.getAttribute('data-tabela')));
    state.at.tabelaId = t.id;
    if(window.matchMedia('(max-width:1180px)').matches) window.open((state.at.tabUrls||{})[t.caminho], '_blank', 'noopener');
    render();
  }; });
  const env = document.getElementById('tbEnviar');
  if(env) env.onclick = async ()=>{
    const adm = document.getElementById('tbAdm').value, titulo = document.getElementById('tbTitulo').value.trim(), f = document.getElementById('tbArq').files[0];
    if(!titulo || !f){ alert('Preenche o nome e escolhe o PDF.'); return; }
    env.disabled = true; env.textContent = 'Enviando…';
    try{
      const caminho = `${slugNome(adm)}/${Date.now()}-${slugNome(titulo)}.pdf`;
      const res = await fetch(SUPABASE_URL+'/storage/v1/object/tabelas/'+caminho, {method:'POST', headers:{...(await cabecalhoAuth()),'Content-Type':'application/pdf'}, body:f});
      if(!res.ok) throw new Error('HTTP '+res.status);
      await sb('tabelas', {method:'POST', prefer:'return=minimal', body:{administradora:adm, titulo, caminho}});
      await loadTabelas();
      showCronoToast('Tabelas', 'Tabela enviada');
    }catch(e){ console.error(e); alert('Não foi possível enviar a tabela. Tenta de novo.'); env.disabled = false; env.textContent = 'Enviar'; }
  };
  app.querySelectorAll('[data-tabela-del]').forEach(b=>{ b.onclick = async ()=>{
    const t = state.at.tabelas.find(x=>x.id===Number(b.getAttribute('data-tabela-del')));
    if(!confirm(`Remover a tabela "${t.titulo}"?`)) return;
    try{
      await fetch(SUPABASE_URL+'/storage/v1/object/tabelas/'+t.caminho, {method:'DELETE', headers: await cabecalhoAuth()});
      await sb('tabelas?id=eq.'+t.id, {method:'DELETE'});
      state.at.tabelaId = null;
      await loadTabelas();
    }catch(e){ console.error(e); alert('Não foi possível remover.'); }
  }; });
}

  }).join('');

async function atDecidir(id, aprovado){
  let motivo = null;

}
async function atConfirmarVenda(id, ok){
  const a = state.at.lista.find(x=>x.id===id);

async function salvarProducaoMes(mes, equipe, texto){
  const ano = state.prodAno;
  const valor = parseBRL(texto);
  if(Number.isNaN(valor) || (valor !== null && valor < 0)){ alert('Digita um valor válido, por exemplo 1.517.156,10'); render(); return; }
  try{
    if(valor === null){
      await sb(`producao_mensal?ano=eq.${ano}&mes=eq.${mes}&equipe=${eq(equipe)}`, {method:'DELETE'});
    }else{
      await sb('producao_mensal?on_conflict=ano,mes,equipe', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ano, mes, equipe, valor}
      });
    }
  }catch(e){
    console.error('Falha ao salvar produção do mês', e);
    alert('Não foi possível salvar esse valor. Verifica sua conexão e tenta de novo.');
  }
  await loadProducao();
}

async function registrarVenda(){
  const vendedor = document.getElementById('vendaVendedor').value;
  const valor = parseBRL(document.getElementById('vendaValor').value);
  const data = document.getElementById('vendaData').value;
  const cliente = document.getElementById('vendaCliente').value.trim();
  const canal = document.getElementById('vendaCanal').value;
  const equipe = document.getElementById('vendaEquipe').value;
  if(!vendedor){ alert('Escolhe o vendedor.'); return; }
  if(!valor || valor <= 0){ alert('Digita o valor da venda, por exemplo 400.000'); return; }
  if(!data){ alert('Escolhe a data da venda.'); return; }
  if(!equipe){ alert('Cadastre uma equipe ativa antes de registrar vendas.'); return; }
  if(!confirm(`Registrar venda?\n\n${vendedor} · ${BRL.format(valor)}\n${new Date(data+'T12:00:00').toLocaleDateString('pt-BR')}${cliente?' · '+cliente:''}\nEquipe ${equipe}`)) return;
  const btn = document.getElementById('vendaSalvarBtn');
  btn.disabled = true; btn.textContent = 'Registrando...';
  try{
    // sem reenvio automatico: repetir poderia duplicar a venda
    await sb('vendas', {method:'POST', prefer:'return=minimal', body:{vendedor, valor, data, cliente: cliente||null, canal: canal||null, equipe}});
  }catch(e){
    console.error('Falha ao registrar venda', e);
    alert('Não foi possível registrar a venda. Verifica sua conexão e tenta de novo.');
    btn.disabled = false; btn.textContent = 'Registrar venda';
    return;
  }
  state.prodAno = Number(data.slice(0,4));
  state.vendaDrawer = false;
  await loadProducao();
  launchConfetti(false);
  showCronoToast('Venda registrada', `${esc(vendedor)} · ${BRL.format(valor)}`);
}

// novo coordenador a partir de um mes do ano atual (janeiro vira a chave do ano)
async function trocarCoordenador(nome, coord, mes){
  coord = (coord||'').trim();
  if(!coord){ alert('Digita o nome do novo coordenador.'); return; }
  const ano = new Date().getFullYear();
  const chave = mes===1 ? String(ano) : `${ano}-${String(mes).padStart(2,'0')}`;
  if(!confirm(`${coord} passa a coordenar a ${nome} a partir de ${MESES[mes-1].toLowerCase()} de ${ano}?`)) return;
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  await salvarCoordenadores(nome, {...(eqp.coordenadores||{}), [chave]: coord});
}
async function removerPeriodoCoord(nome, chave){
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  const x = coordPeriodos(eqp).find(p=>p.k===chave);
  if(!x || !confirm(`Tirar ${x.nome} (${periodoRotulo(x)}) da coordenação da ${nome}?`)) return;
  const coordenadores = {...(eqp.coordenadores||{})};
  delete coordenadores[chave];
  await salvarCoordenadores(nome, coordenadores);
}

async function alternarEquipe(nome){

    return;
  }
  await loadProducao();
}

async function entrar(){
  const L = state.login, porEmail = L.papel==='representante';
  let email, senha;
  if(porEmail){
    email = document.getElementById('lgEmail').value.trim().toLowerCase();
    senha = document.getElementById('lgSenha').value;
    if(!email || !senha){ L.erro = 'Preenche o e-mail e a senha.'; render(); return; }
  }else{
    const pessoa = (L.nomes||[]).find(n=>n.nome===L.nome && n.papel===L.papel);
    const pin = document.getElementById('lgPin').value.trim();
    if(!pessoa){ L.erro = 'Escolhe o seu nome.'; render(); return; }
    if(!pin){ L.erro = 'Digita o seu PIN.'; render(); return; }
    email = pessoa.login; senha = 'fbs-' + pin;
  }
  L.enviando = true; L.erro = ''; render();
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey: SUPABASE_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email, password: senha})
    });
    if(!res.ok){
      L.erro = res.status===429 ? 'Muitas tentativas. Aguarda alguns minutos e tenta de novo.'
        : (porEmail ? 'E-mail ou senha incorretos.' : 'PIN incorreto.');
      L.enviando = false; render(); return;
    }
    aceitarToken(await res.json());
  }catch(e){
    console.error('Falha no login', e);
    L.erro = 'Sem conexão com o servidor. Tenta de novo.';
    L.enviando = false; render(); return;
  }
  L.enviando = false;
  if(!await entrarNoSistema()){ if(!L.erro) L.erro = 'Não consegui abrir o seu acesso. Tenta de novo.'; guardarSessao(null); irParaLogin(); }
}

            `:''}</span>
            <span class="meta-row-value"><b>${d.progresso}</b> de ${d.meta} ${r.unidade}</span>
          </div>
          <div class="meta-bar"><div class="meta-bar-fill ${metaBarClass(ratio)}" style="width:${pct*100}%;"></div></div>
          ${r.editable ? `<div class="meta-tooltip" id="vendasTooltip" style="display:none;">Registre aqui se você fechou uma venda essa semana.</div>` : ''}
          ${(r.editable && state.vendasEditOpen) ? `
            <div class="meta-edit-row">
              <input id="vendasProgressoInput" type="number" min="0" inputmode="numeric" value="${d.progresso}">
              <button id="vendasSaveBtn" type="button">Salvar</button>
            </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderCallModal(){
  if(!state.callModal) return '';
  const pergunta = state.callModal==='agendou' ? 'Agendou?' : 'Chamou no WhatsApp?';
  return `
    <div class="modal-backdrop" id="callModalBackdrop">
      <div class="modal-card">
        <h3>${pergunta}</h3>
        <div class="modal-actions">
          <button class="modal-btn-nao" id="callModalNao">Não</button>
          <button class="modal-btn-sim" id="callModalSim">Sim</button>
        </div>
      </div>
    </div>
  `;
}

function render(pulse){
  const app = document.getElementById('app');
  // admin e central do vendedor usam o layout de tela cheia
  document.body.classList.toggle('modo-admin', ['admin','app','login','novoPin'].includes(state.view));

  if(state.view === 'loading'){
    app.innerHTML = `<p class="eyebrow"><img src="logo-icon.png" alt="">FBS Prime</p><h1>Carregando...</h1>`;
    return;
  }

  if(state.view === 'login'){
    renderLogin(app);
    return;
  }
  if(state.view === 'novoPin'){
    renderNovoPin(app);
    return;
  }

  if(state.view === 'admin'){
    renderAdmin(app);
    return;
  }

  const atendidas = state.calls.filter(c=>c.type==='atendeu').length;
  const caixa = state.calls.filter(c=>c.type==='caixa_postal').length;
  const total = state.calls.length;
  const disabled = !!state.closed;

  if(state.centralTab !== 'hoje'){
    const pagina = {relatorios: paginaRelatoriosVendedor, desempenho: paginaDesempenho, ranking: ()=>paginaRanking(false), campanhas: paginaCampanhasVendedor, minhameta: paginaMinhaMeta, atendimentos: paginaAtendimentosVendedor}[state.centralTab];
    if(pagina){ renderCentral(app, pagina()); return; }
  }

  const corpoHoje = `
    <h2 class="sr-only">Registro de ligações do dia para ${esc(state.vendor)}</h2>
    <div class="hoje">
    <div class="hoje-info">
    ${atLinhaHoje()}
    ${renderCronoCard(false)}

    ${renderMetasPanel()}
    </div>
    <div class="hoje-reg">

    ${state.pendentes.length ? state.pendentes.map(p=>`
      <div class="fechado-banner" style="border-color:var(--caixa);text-align:left;">
        <div class="t" style="color:var(--caixa);">Relatório de ${new Date(p.data+'T12:00:00').toLocaleDateString('pt-BR')} pendente</div>
        <div class="s">${p.atendeu} atendidas · ${p.caixa} caixa postal · ${p.total} no total — esqueceu de fechar esse dia</div>
        <button class="undo-btn" data-fechar-pendente="${p.data}" style="margin-top:8px;color:var(--caixa);">fechar agora</button>
      </div>
    `).join('') : ''}

    <div class="tally">
      <div class="tally-card">
        <div class="tally-label">Atendidas</div>
        <div class="tally-num tally-atendeu ${pulse==='atendeu'?'pulse':''}">${atendidas}</div>
      </div>
      <div class="tally-card">
        <div class="tally-label">Caixa postal</div>
        <div class="tally-num tally-caixa ${pulse==='caixa'?'pulse':''}">${caixa}</div>
      </div>
    </div>
    <div class="tally-total">Total de ligações hoje: <b>${total}</b></div>
    ${state.calls.filter(c=>c.pending).length ? `<div class="tally-total" style="color:var(--caixa);margin-top:-14px;">⏳ ${state.calls.filter(c=>c.pending).length} ligação(ões) sincronizando com o servidor — já estão guardadas, o envio é automático</div>` : ''}
    ${state.loadError ? `<div class="fechado-banner" style="border-color:var(--caixa);"><div class="t" style="color:var(--caixa);">Não consegui atualizar o histórico</div><div class="s">A contagem na tela pode estar incompleta.</div><button class="undo-btn" id="retryLoadBtn" style="margin-top:8px;color:var(--caixa);">tentar de novo</button></div>` : ''}

    ${state.closed ? `
      <div class="fechado-banner">
        <div class="t">Relatório de hoje fechado</div>
        <div class="s">${state.closed.atendidas} atendidas · ${state.closed.caixaPostal} caixa postal · fechado às ${timeLabel(state.closed.closedAt)}</div>
        <button class="undo-btn" id="reopenBtn" style="margin-top:8px;">reabrir relatório</button>
      </div>
    ` : ''}

    <button class="call-btn btn-atendeu" id="btnAtendeu" ${disabled?'disabled':''}>
      <span class="icon">&#9679;</span> Cliente atendeu
    </button>
    <button class="call-btn btn-caixa" id="btnCaixa" ${disabled?'disabled':''}>
      <span class="icon">&#9724;</span> Caixa postal
    </button>

    <div class="undo-row">
      ${(!disabled && total>0) ? '<button class="undo-btn" id="undoBtn">desfazer última ligação</button>' : ''}
    </div>

    <button class="fechar-btn" id="fecharBtn" ${disabled?'disabled':''}>
      ${disabled ? 'Relatório já fechado' : 'Fechar relatório do dia'}
    </button>

    <div class="history">
      <div class="history-head" id="historyHead">
        <span>Histórico de hoje (${total})</span>
        <span class="chev">${state.historyOpen?'&#9650;':'&#9660;'}</span>
      </div>
      <div class="history-list ${state.historyOpen?'open':''}">
        ${total===0 ? '<div class="empty-hint">Nenhuma ligação registrada ainda.</div>' :
          [...state.calls].reverse().map((c,i)=>`
            <div class="history-item">
              <span class="tag ${c.type==='atendeu'?'tag-atendeu':'tag-caixa'}">${c.type==='atendeu'?'Atendeu':'Caixa postal'}</span>
              <span class="time">${timeLabel(c.ts)}</span>
            </div>
          `).join('')
        }
      </div>
    </div>
    </div>
    </div>

    ${renderCallModal()}
  `;
  renderCentral(app, {
    top:{eb:'Central do vendedor', titulo:`Olá, ${esc(nomeCurto(state.vendor))}`, sub: todayLabel(), acoes: dsIconeHoje()},
    html: corpoHoje,
    estreita: true
  });
  bindDsHoje(app);

  const retryLoadBtn = document.getElementById('retryLoadBtn');
  if(retryLoadBtn) retryLoadBtn.onclick = ()=>loadVendorData(state.vendor);
  document.getElementById('historyHead').onclick = ()=>{ state.historyOpen = !state.historyOpen; render(); };
  if(!disabled){
    document.getElementById('btnAtendeu').onclick = ()=>openCallModal('atendeu');
    document.getElementById('btnCaixa').onclick = ()=>openCallModal('caixa_postal');
    const undo = document.getElementById('undoBtn');
    if(undo) undo.onclick = undoLast;
  }
  document.getElementById('fecharBtn').onclick = ()=>{ if(!disabled) fecharRelatorio(); };
  const reopenBtn = document.getElementById('reopenBtn');
  if(reopenBtn) reopenBtn.onclick = reopenDay;
  app.querySelectorAll('[data-fechar-pendente]').forEach(btn=>{
    btn.onclick = ()=>fecharPendente(btn.getAttribute('data-fechar-pendente'));
  });

  const vendasEditBtn = document.getElementById('vendasEditBtn');
  if(vendasEditBtn) vendasEditBtn.onclick = ()=>{ state.vendasEditOpen = !state.vendasEditOpen; render(); };
  const vendasInfoBtn = document.getElementById('vendasInfoBtn');
  const vendasTooltip = document.getElementById('vendasTooltip');
  if(vendasInfoBtn && vendasTooltip){
    vendasInfoBtn.onmouseenter = ()=>{ vendasTooltip.style.display = 'block'; };
    vendasInfoBtn.onmouseleave = ()=>{ vendasTooltip.style.display = 'none'; };
    vendasInfoBtn.onclick = (e)=>{
      e.stopPropagation();
      vendasTooltip.style.display = vendasTooltip.style.display==='block' ? 'none' : 'block';
    };
  }
  const vendasSaveBtn = document.getElementById('vendasSaveBtn');
  if(vendasSaveBtn) vendasSaveBtn.onclick = saveVendasProgress;

  const callModalSim = document.getElementById('callModalSim');
  const callModalNao = document.getElementById('callModalNao');
  if(callModalSim) callModalSim.onclick = ()=>answerCallModal('sim');
  if(callModalNao) callModalNao.onclick = ()=>answerCallModal('não');
}

async function init(){
  try{ localStorage.removeItem('fbs_session'); }catch(e){} // sessao do modelo antigo
  cronoTick(); // marca o passo atual (sem aviso de troca ao abrir o site)
  if(sessao && await entrarNoSistema()) return;
  irParaLogin();
}
init();
</script>
</body>
</html>
