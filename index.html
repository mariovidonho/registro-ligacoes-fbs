    </div>`;
  app.querySelectorAll('[data-papel]').forEach(b=>{ b.onclick = ()=>{ L.papel = b.getAttribute('data-papel'); L.nome = ''; L.erro = ''; render(); }; });
  app.querySelectorAll('[data-nome]').forEach(b=>{ b.onclick = ()=>{
    L.nome = b.getAttribute('data-nome'); L.erro = '';
    app.querySelectorAll('[data-nome]').forEach(x=>x.classList.toggle('on', x===b));
    document.getElementById('lgPin').focus();
  }; });
  document.getElementById('lgEntrar').onclick = entrar;
  app.querySelectorAll('.lg-card input').forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); }));
}

async function entrar(){
  const L = state.login, porEmail = L.papel==='representante';
  let email, senha;
  if(porEmail){
    email = document.getElementById('lgEmail').value.trim().toLowerCase();
    senha = document.getElementById('lgSenha').value;
    if(!email || !senha){ L.erro = 'Preenche o e-mail e a senha.'; render(); return; }
  }else{
    const pessoa = (L.nomes||[]).find(n=>n.nome===L.nome && n.papel===L.papel);
    const pin = document.getElementById('lgPin').value.trim();
    if(!pessoa){ L.erro = 'Escolhe o seu nome.'; render(); return; }
    if(!pin){ L.erro = 'Digita o seu PIN.'; render(); return; }
    email = pessoa.login; senha = 'fbs-' + pin;
  }
  L.enviando = true; L.erro = ''; render();
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey: SUPABASE_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email, password: senha})
    });
    if(!res.ok){
      L.erro = res.status===429 ? 'Muitas tentativas. Aguarda alguns minutos e tenta de novo.'
        : (porEmail ? 'E-mail ou senha incorretos.' : 'PIN incorreto.');
      L.enviando = false; render(); return;
    }
    aceitarToken(await res.json());
  }catch(e){
    console.error('Falha no login', e);
    L.erro = 'Sem conexão com o servidor. Tenta de novo.';
    L.enviando = false; render(); return;
  }
  L.enviando = false;
  if(!await entrarNoSistema()){ if(!L.erro) L.erro = 'Não consegui abrir o seu acesso. Tenta de novo.'; guardarSessao(null); irParaLogin(); }
}

// Com a sessao valida: descobre quem e, exige o PIN novo se precisar e abre a area certa
async function entrarNoSistema(){
  let perfil;
  try{ perfil = await rpc('meu_perfil', {}, 1); }
  catch(e){ console.error('Falha ao ler perfil', e); return false; }
  if(!perfil){ state.login.erro = 'Esta conta ainda não tem acesso liberado. Fale com o representante.'; return false; }
  state.perfilAcesso = perfil;
  if(perfil.trocar_pin){ state.view = 'novoPin'; render(); return true; }
  await abrirArea();
  return true;
}
async function abrirArea(){
  const p = state.perfilAcesso;
  await loadVendorList();
  loadCronograma();
  if(p.papel==='vendedor'){ selectVendor(p.nome); return; }
  state.view = 'admin';
  loadAdminData();
  loadAdminMetas();
  loadCampanhas();
  startAdminPolling();
}

function renderNovoPin(app){
  const P = state.perfilAcesso;
  app.innerHTML = `
    <div class="lg">
      ${ladoMarca()}
      <main class="lg-form">
        <div class="lg-card">
          <h1>Crie seu novo PIN</h1>
          <div class="sub">${esc(P.nome.split(' ')[0])}, para proteger os dados dos clientes, seu acesso agora usa um PIN de <b style="color:var(--text);">6 números</b>. Só você vai saber: nem o gestor consegue ver.</div>
          <label class="lg-rotulo" for="npPin">Novo PIN</label>
          <input id="npPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="6 números">
          <label class="lg-rotulo" for="npPin2">Repita o PIN</label>
          <input id="npPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="6 números">
          <div class="lg-erro" id="npErro"></div>
          <button class="btn gold lg-entrar" id="npSalvar">Salvar e entrar</button>
        </div>
      </main>
    </div>`;
  const salvar = async ()=>{
    const a = document.getElementById('npPin').value.trim(), b = document.getElementById('npPin2').value.trim(), erro = document.getElementById('npErro');
    if(!/^[0-9]{6}$/.test(a)){ erro.textContent = 'O PIN precisa ter exatamente 6 números.'; return; }
    if(/^(\d)\1{5}$/.test(a) || '0123456789'.includes(a) || '9876543210'.includes(a)){ erro.textContent = 'Esse PIN é fácil de adivinhar. Escolhe outro.'; return; }
    if(a!==b){ erro.textContent = 'Os dois PINs não estão iguais.'; return; }
    const bt = document.getElementById('npSalvar'); bt.disabled = true; bt.textContent = 'Salvando…';
    try{
      await rpc('trocar_meu_pin', {p_novo:a});
      state.perfilAcesso.trocar_pin = false;
      await abrirArea();
    }catch(e){
      console.error('Falha ao trocar PIN', e);
      erro.textContent = 'Não foi possível salvar. Tenta de novo.';
      bt.disabled = false; bt.textContent = 'Salvar e entrar';
    }
  };
  document.getElementById('npSalvar').onclick = salvar;
  app.querySelectorAll('.lg-card input').forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter') salvar(); }));
}

function renderMetasPanel(){
  if(!state.metas){
    return `<div class="metas-card"><div class="metas-title">Minhas metas da semana</div><div class="empty-hint" style="padding:4px 0;">${state.metasLoading?'Carregando metas...':'Não foi possível carregar suas metas agora.'}</div></div>`;
  }
  const m = state.metas;
  const rows = [
    {key:'agendamentos', label:'Agendamentos', unidade:'agendamentos'},
    {key:'comparecimentos', label:'Comparecimentos', unidade:'comparecimentos'},
    {key:'vendas', label:'Vendas', unidade:'vendas', editable:true},
    {key:'ligacoes', label:'Ligações', unidade:'ligações'}
  ];
  return `
    <div class="metas-card">
      <div class="metas-title">Minhas metas da semana</div>
      ${rows.map(r=>{
        const d = m[r.key] || {meta:1, progresso:0};
        const ratio = d.meta>0 ? d.progresso/d.meta : 0;
        const pct = Math.min(1, ratio);
        return `
        <div class="meta-row">
          <div class="meta-row-head">
            <span class="meta-row-label">${r.label}${r.editable ? `
              <button class="meta-icon-btn" id="vendasEditBtn" type="button" title="Editar vendas">&#9998;</button>
              <button class="meta-icon-btn" id="vendasInfoBtn" type="button" title="Ajuda">&#9432;</button>
            `:''}</span>
            <span class="meta-row-value"><b>${d.progresso}</b> de ${d.meta} ${r.unidade}</span>
          </div>
          <div class="meta-bar"><div class="meta-bar-fill ${metaBarClass(ratio)}" style="width:${pct*100}%;"></div></div>
          ${r.editable ? `<div class="meta-tooltip" id="vendasTooltip" style="display:none;">Registre aqui se você fechou uma venda essa semana.</div>` : ''}
          ${(r.editable && state.vendasEditOpen) ? `
            <div class="meta-edit-row">
              <input id="vendasProgressoInput" type="number" min="0" inputmode="numeric" value="${d.progresso}">
              <button id="vendasSaveBtn" type="button">Salvar</button>
            </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderCallModal(){
  if(!state.callModal) return '';
  const pergunta = state.callModal==='agendou' ? 'Agendou?' : 'Chamou no WhatsApp?';
  return `
    <div class="modal-backdrop" id="callModalBackdrop">
      <div class="modal-card">
        <h3>${pergunta}</h3>
        <div class="modal-actions">
          <button class="modal-btn-nao" id="callModalNao">Não</button>
          <button class="modal-btn-sim" id="callModalSim">Sim</button>
        </div>
      </div>
    </div>
  `;
}

function render(pulse){
  const app = document.getElementById('app');
  // admin e central do vendedor usam o layout de tela cheia
  document.body.classList.toggle('modo-admin', ['admin','app','login','novoPin'].includes(state.view));

  if(state.view === 'loading'){
    app.innerHTML = `<p class="eyebrow"><img src="logo-icon.png" alt="">FBS Prime</p><h1>Carregando...</h1>`;
    return;
  }

  if(state.view === 'login'){
    renderLogin(app);
    return;
  }
  if(state.view === 'novoPin'){
    renderNovoPin(app);
    return;
  }

  if(state.view === 'admin'){
    renderAdmin(app);
    return;
  }

  const atendidas = state.calls.filter(c=>c.type==='atendeu').length;
  const caixa = state.calls.filter(c=>c.type==='caixa_postal').length;
  const total = state.calls.length;
  const disabled = !!state.closed;

  if(state.centralTab !== 'hoje'){
    const pagina = {relatorios: paginaRelatoriosVendedor, desempenho: paginaDesempenho, ranking: ()=>paginaRanking(false), campanhas: paginaCampanhasVendedor, minhameta: paginaMinhaMeta}[state.centralTab];
    if(pagina){ renderCentral(app, pagina()); return; }
  }

  const corpoHoje = `
    <h2 class="sr-only">Registro de ligações do dia para ${esc(state.vendor)}</h2>
    <div class="hoje">
    <div class="hoje-info">
    ${renderCronoCard(false)}

    ${renderMetasPanel()}
    </div>
    <div class="hoje-reg">

    ${state.pendentes.length ? state.pendentes.map(p=>`
      <div class="fechado-banner" style="border-color:var(--caixa);text-align:left;">
        <div class="t" style="color:var(--caixa);">Relatório de ${new Date(p.data+'T12:00:00').toLocaleDateString('pt-BR')} pendente</div>
        <div class="s">${p.atendeu} atendidas · ${p.caixa} caixa postal · ${p.total} no total — esqueceu de fechar esse dia</div>
        <button class="undo-btn" data-fechar-pendente="${p.data}" style="margin-top:8px;color:var(--caixa);">fechar agora</button>
      </div>
    `).join('') : ''}

    <div class="tally">
      <div class="tally-card">
        <div class="tally-label">Atendidas</div>
        <div class="tally-num tally-atendeu ${pulse==='atendeu'?'pulse':''}">${atendidas}</div>
      </div>
      <div class="tally-card">
        <div class="tally-label">Caixa postal</div>
        <div class="tally-num tally-caixa ${pulse==='caixa'?'pulse':''}">${caixa}</div>
      </div>
    </div>
    <div class="tally-total">Total de ligações hoje: <b>${total}</b></div>
    ${state.calls.filter(c=>c.pending).length ? `<div class="tally-total" style="color:var(--caixa);margin-top:-14px;">⏳ ${state.calls.filter(c=>c.pending).length} ligação(ões) sincronizando com o servidor — já estão guardadas, o envio é automático</div>` : ''}
    ${state.loadError ? `<div class="fechado-banner" style="border-color:var(--caixa);"><div class="t" style="color:var(--caixa);">Não consegui atualizar o histórico</div><div class="s">A contagem na tela pode estar incompleta.</div><button class="undo-btn" id="retryLoadBtn" style="margin-top:8px;color:var(--caixa);">tentar de novo</button></div>` : ''}

    ${state.closed ? `
      <div class="fechado-banner">
        <div class="t">Relatório de hoje fechado</div>
        <div class="s">${state.closed.atendidas} atendidas · ${state.closed.caixaPostal} caixa postal · fechado às ${timeLabel(state.closed.closedAt)}</div>
        <button class="undo-btn" id="reopenBtn" style="margin-top:8px;">reabrir relatório</button>
      </div>
    ` : ''}

    <button class="call-btn btn-atendeu" id="btnAtendeu" ${disabled?'disabled':''}>
      <span class="icon">&#9679;</span> Cliente atendeu
    </button>
    <button class="call-btn btn-caixa" id="btnCaixa" ${disabled?'disabled':''}>
      <span class="icon">&#9724;</span> Caixa postal
    </button>

    <div class="undo-row">
      ${(!disabled && total>0) ? '<button class="undo-btn" id="undoBtn">desfazer última ligação</button>' : ''}
    </div>

    <button class="fechar-btn" id="fecharBtn" ${disabled?'disabled':''}>
      ${disabled ? 'Relatório já fechado' : 'Fechar relatório do dia'}
    </button>

    <div class="history">
      <div class="history-head" id="historyHead">
        <span>Histórico de hoje (${total})</span>
        <span class="chev">${state.historyOpen?'&#9650;':'&#9660;'}</span>
      </div>
      <div class="history-list ${state.historyOpen?'open':''}">
        ${total===0 ? '<div class="empty-hint">Nenhuma ligação registrada ainda.</div>' :
          [...state.calls].reverse().map((c,i)=>`
            <div class="history-item">
              <span class="tag ${c.type==='atendeu'?'tag-atendeu':'tag-caixa'}">${c.type==='atendeu'?'Atendeu':'Caixa postal'}</span>
              <span class="time">${timeLabel(c.ts)}</span>
            </div>
          `).join('')
        }
      </div>
    </div>
    </div>
    </div>

    ${renderCallModal()}
  `;
  renderCentral(app, {
    top:{eb:'Central do vendedor', titulo:`Olá, ${esc(nomeCurto(state.vendor))}`, sub: todayLabel()},
    html: corpoHoje,
    estreita: true
  });

  const retryLoadBtn = document.getElementById('retryLoadBtn');
  if(retryLoadBtn) retryLoadBtn.onclick = ()=>loadVendorData(state.vendor);
  document.getElementById('historyHead').onclick = ()=>{ state.historyOpen = !state.historyOpen; render(); };
  if(!disabled){
    document.getElementById('btnAtendeu').onclick = ()=>openCallModal('atendeu');
    document.getElementById('btnCaixa').onclick = ()=>openCallModal('caixa_postal');
    const undo = document.getElementById('undoBtn');
    if(undo) undo.onclick = undoLast;
  }
  document.getElementById('fecharBtn').onclick = ()=>{ if(!disabled) fecharRelatorio(); };
  const reopenBtn = document.getElementById('reopenBtn');
  if(reopenBtn) reopenBtn.onclick = reopenDay;
  app.querySelectorAll('[data-fechar-pendente]').forEach(btn=>{
    btn.onclick = ()=>fecharPendente(btn.getAttribute('data-fechar-pendente'));
  });

  const vendasEditBtn = document.getElementById('vendasEditBtn');
  if(vendasEditBtn) vendasEditBtn.onclick = ()=>{ state.vendasEditOpen = !state.vendasEditOpen; render(); };
  const vendasInfoBtn = document.getElementById('vendasInfoBtn');
  const vendasTooltip = document.getElementById('vendasTooltip');
  if(vendasInfoBtn && vendasTooltip){
    vendasInfoBtn.onmouseenter = ()=>{ vendasTooltip.style.display = 'block'; };
    vendasInfoBtn.onmouseleave = ()=>{ vendasTooltip.style.display = 'none'; };
    vendasInfoBtn.onclick = (e)=>{
      e.stopPropagation();
      vendasTooltip.style.display = vendasTooltip.style.display==='block' ? 'none' : 'block';
    };
  }
  const vendasSaveBtn = document.getElementById('vendasSaveBtn');
  if(vendasSaveBtn) vendasSaveBtn.onclick = saveVendasProgress;

  const callModalSim = document.getElementById('callModalSim');
  const callModalNao = document.getElementById('callModalNao');
  if(callModalSim) callModalSim.onclick = ()=>answerCallModal('sim');
  if(callModalNao) callModalNao.onclick = ()=>answerCallModal('não');
}

async function init(){
  try{ localStorage.removeItem('fbs_session'); }catch(e){} // sessao do modelo antigo
  cronoTick(); // marca o passo atual (sem aviso de troca ao abrir o site)
  if(sessao && await entrarNoSistema()) return;
  irParaLogin();
}
init();
</script>
</body>
