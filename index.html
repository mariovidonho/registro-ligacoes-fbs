                <span style="min-width:0;">${esc(v.vendedor)}<small>${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')}${v.cliente?' · '+esc(v.cliente):''}</small></span>
                <span class="val">${brlCurto(v.valor)}</span>
              </div>`).join('') || `<div class="mute" style="font-size:13px;">Nenhuma venda registrada no site em ${ano}. Use <b>Registrar venda</b> no topo.</div>`}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-h">
        <h3>Produção mês a mês</h3>
        <span style="display:flex;align-items:center;gap:14px;">
          <span class="legend"><span><i style="background:var(--text);"></i>fechado</span><span><i style="background:#5FD39A;"></i>soma das vendas do site</span></span>
          <button class="btn small ${state.prodEdit?'gold':''}" id="prodEditBtn">${state.prodEdit?'Concluir edição':'Editar valores'}</button>
        </span>
      </div>
      ${state.prodEdit ? `<div class="card-b" style="padding-bottom:6px;font-size:12px;color:var(--a-dim);">Digite o valor fechado do mês em reais (ex.: 1.517.156,10). Deixe em branco para usar a soma das vendas registradas no site.</div>` : ''}
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr>
            <th>Mês</th>
            ${equipes.map(eq=>`<th class="r"><span style="color:${corEquipe(eq.nome)};">●</span> ${esc(eq.nome)}${coordTexto(eq, ano) ? `<span class="coord">${esc(coordTexto(eq, ano))}</span>` : ''}</th>`).join('')}
            <th class="r">Total FBS</th>
            <th class="r">vs ${ano-1}</th>
          </tr></thead>
          <tbody>
            ${MESES.map((nome,i)=>{
              const futuro = ano > anoAtual || (ano===anoAtual && i+1 > mesAtual);
              const atual = ano===anoAtual && i+1===mesAtual;
              const v = totais[i], va = totaisAnt[i];
              return `<tr class="${futuro && v===null ? 'futuro' : ''} ${atual?'atual':''}">
                <td>${nome}${atual?' <span class="pill live" style="margin-left:6px;">mês atual</span>':''}</td>
                ${equipes.map(eq=>{
                  const c = prodCelula(ano, i+1, eq.nome);
                  if(state.prodEdit){
                    const man = p.manual.find(r=>r.ano===ano && r.mes===i+1 && r.equipe===eq.nome);
                    return `<td class="r"><input class="cel prod-cell" inputmode="decimal" data-mes="${i+1}" data-equipe="${esc(eq.nome)}" value="${man ? man.valor.toLocaleString('pt-BR',{minimumFractionDigits:2}) : ''}" placeholder="${c && c.fonte==='vendas' ? BRL.format(c.valor) : '—'}"></td>`;
                  }
                  return c ? `<td class="r ${c.fonte==='vendas'?'auto':''}">${BRL.format(c.valor)}</td>` : `<td class="r mute">—</td>`;
                }).join('')}
                <td class="r"><b>${v===null ? '<span class="mute">—</span>' : BRL.format(v)}</b></td>
                <td class="r">${v!==null && va ? `<span class="${v>=va?'up':'down'}">${v>=va?'+':''}${Math.round((v/va-1)*100)}%</span>` : '<span class="mute">—</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td>Total ${ano}</td>
            ${equipes.map(eq=>{
              const s = MESES.reduce((acc,_,i)=>{ const c = prodCelula(ano, i+1, eq.nome); return acc + (c ? c.valor : 0); }, 0);
              return `<td class="r">${s ? BRL.format(s) : '—'}</td>`;
            }).join('')}
            <td class="r">${BRL.format(totalAno)}</td>
            <td class="r">${variacao===null ? '—' : (variacao>=0?'+':'')+Math.round(variacao)+'%'}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Vendas registradas em ${ano}</h3><span class="hint">${vendasAno.length} ${vendasAno.length===1?'venda':'vendas'} · ${BRL.format(vendasAno.reduce((s,v)=>s+v.valor,0))}</span></div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Data</th><th>Vendedor</th><th>Cliente</th><th>Canal</th><th>Equipe</th><th class="r">Valor</th><th></th></tr></thead>
          <tbody>
            ${vendasAno.map(v=>`<tr>
              <td>${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')}</td>
              <td><span class="pessoa">${avatar(v.vendedor)}${esc(v.vendedor)}</span></td>
              <td>${v.cliente ? esc(v.cliente) : '<span class="mute">—</span>'}</td>
              <td>${v.canal ? esc(v.canal) : '<span class="mute">—</span>'}</td>
              <td>${v.equipe ? esc(v.equipe) : '<span class="mute">—</span>'}</td>

            </tr>`).join('') || `<tr><td colspan="7" class="mute" style="text-align:center;padding:24px;">Nenhuma venda registrada no site em ${ano}.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Equipes</h3><span class="hint">Crie uma equipe quando surgir uma nova coordenação. As encerradas continuam no histórico.</span></div>
      <div class="card-b">
        <div class="cards-grid">
          ${p.equipes.map(eq=>{
            const totalGeral = p.manual.filter(r=>r.equipe===eq.nome).reduce((s,r)=>s+r.valor,0)
              + p.vendas.filter(v=>v.equipe===eq.nome && !p.manual.some(r=>r.equipe===eq.nome && r.ano===Number(v.data.slice(0,4)) && r.mes===Number(v.data.slice(5,7)))).reduce((s,v)=>s+v.valor,0);
            return `<div class="pcard">
              <div class="top">
                <span class="av" style="background:${corEquipe(eq.nome)};border-radius:12px;">${esc(iniciais(eq.nome))}</span>
                <div style="flex:1;min-width:0;"><div class="nm">${esc(eq.nome)}</div><div class="meta-l">${eq.ativa ? '<span class="pill live">ativa</span>' : '<span class="pill">encerrada</span>'}</div></div>
              </div>
              <div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin-bottom:4px;">Coordenação</div>
                ${coordPeriodos(eq).map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;">
                  <span><span class="mute" style="font-size:12px;">${periodoRotulo(x)}</span> · ${esc(x.nome)}</span>
                  <button class="link danger" data-coord-del="${esc(eq.nome)}|${esc(x.k)}" title="Remover esse período">×</button>
                </div>`).join('') || '<div class="mute" style="font-size:12px;">sem coordenador registrado</div>'}
              </div>
              <div class="stats" style="grid-template-columns:1fr;"><div><span>Produção total registrada</span><b>${BRL.format(totalGeral)}</b></div></div>
              ${eq.ativa ? `<div style="display:flex;gap:6px;">
                <input data-coord-nome="${esc(eq.nome)}" placeholder="Novo coordenador" style="flex:1;min-width:0;padding:7px 9px;font-size:13px;">
                <select data-coord-mes="${esc(eq.nome)}" style="padding:7px 6px;font-size:13px;">${MESES.map((m,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?'selected':''}>${mesCurto(i+1)}/${new Date().getFullYear()}</option>`).join('')}</select>
                <button class="btn small" data-coord-salvar="${esc(eq.nome)}">Trocar</button>
              </div>` : ''}
              <div class="foot">
                <span></span>
                <button class="link ${eq.ativa?'danger':''}" data-equipe-ativa="${esc(eq.nome)}">${eq.ativa?'encerrar equipe':'reativar'}</button>
              </div>
            </div>`;
          }).join('')}
          <div class="pcard novo">
            <div class="nm">Nova equipe</div>
            <input id="novaEquipeNome" placeholder="Nome da equipe">
            <input id="novaEquipeCoord" placeholder="Coordenador (opcional)">
            <button class="btn" id="novaEquipeBtn" style="justify-content:center;">${icone('mais')}Adicionar equipe</button>
          </div>
        </div>
      </div>
    </div>`;

  const bind = app=>{
    app.querySelectorAll('[data-prod-ano]').forEach(b=>{ b.onclick = ()=>{ state.prodAno = Number(b.getAttribute('data-prod-ano')); render(); }; });
    document.getElementById('abrirVendaBtn').onclick = ()=>{ state.vendaDrawer = true; render(); };
    document.getElementById('prodEditBtn').onclick = ()=>{ state.prodEdit = !state.prodEdit; render(); };
    app.querySelectorAll('.prod-cell').forEach(inp=>{
      inp.onchange = ()=>salvarProducaoMes(Number(inp.getAttribute('data-mes')), inp.getAttribute('data-equipe'), inp.value);
    });
    app.querySelectorAll('[data-venda-del]').forEach(b=>{ b.onclick = ()=>removerVenda(Number(b.getAttribute('data-venda-del'))); });
    app.querySelectorAll('[data-coord-salvar]').forEach(b=>{
      const nome = b.getAttribute('data-coord-salvar');
      b.onclick = ()=>trocarCoordenador(nome,
        app.querySelector(`[data-coord-nome="${CSS.escape(nome)}"]`).value,
        Number(app.querySelector(`[data-coord-mes="${CSS.escape(nome)}"]`).value));
    });
    app.querySelectorAll('[data-coord-del]').forEach(b=>{
      const [nome, k] = b.getAttribute('data-coord-del').split('|');
      b.onclick = ()=>removerPeriodoCoord(nome, k);
    });
    app.querySelectorAll('[data-equipe-ativa]').forEach(b=>{ b.onclick = ()=>alternarEquipe(b.getAttribute('data-equipe-ativa')); });
    document.getElementById('novaEquipeBtn').onclick = adicionarEquipe;
  };
  return {top, html, bind};
}

function fecharVendaDrawer(){ state.vendaDrawer = false; render(); }
function bindVendaDrawer(){
  const bg = document.getElementById('vendaDrawerBg');
  bg.onclick = e=>{ if(e.target===bg) fecharVendaDrawer(); };
  document.getElementById('vendaCancelarBtn').onclick = fecharVendaDrawer;
  document.getElementById('vendaSalvarBtn').onclick = registrarVenda;
  const selV = document.getElementById('vendaVendedor'), selE = document.getElementById('vendaEquipe');
  // a equipe padrao e a da ultima venda desse vendedor (ou a primeira ativa)
  selV.onchange = ()=>{
    const ult = state.prod && state.prod.vendas.find(v=>v.vendedor===selV.value && v.equipe);
    if(ult && [...selE.options].some(o=>o.value===ult.equipe)) selE.value = ult.equipe;
  };
  setTimeout(()=>selV.focus(), 50);
}
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && state.vendaDrawer) fecharVendaDrawer(); });

// ---------------- Vendedores ----------------
function paginaVendedores(){
  const ano = new Date().getFullYear();
  const rows = state.adminRows || [];
  const vendas = state.prod && !state.prod.erro ? state.prod.vendas.filter(v=>v.data.slice(0,4)===String(ano)) : null;
  const top = {titulo:'Vendedores', sub:`${VENDORES.length} no time · ligações de ${periodLabel().toLowerCase()}`};
  const equipesAtivas = state.prod && !state.prod.erro ? state.prod.equipes.filter(e=>e.ativa).map(e=>e.nome) : ['Gaviões'];
  if(!state.coords) loadCoordenadores();
  const html = `
    <div class="cards-grid">
      ${VENDORES.map(v=>{
        const r = rows.find(x=>x.vendor===v) || {total:0, atendeu:0};
        const vs = vendas ? vendas.filter(x=>x.vendedor===v) : [];
        return `<div class="pcard">
          <div class="top">${avatar(v)}
            <div style="flex:1;min-width:0;"><div class="nm">${esc(v)}</div><div class="meta-l">${esc((VENDOR_PERFIL[v]||{}).equipe || 'sem equipe')}${(VENDOR_PERFIL[v]||{}).aniversario ? ' · 🎂 '+esc(VENDOR_PERFIL[v].aniversario) : ''}</div></div>
            <button class="link" data-perfil="${esc(v)}">editar perfil</button>
          </div>
          ${(VENDOR_PERFIL[v]||{}).frase ? `<div style="font-size:12px;color:var(--a-dim);font-style:italic;">“${esc(VENDOR_PERFIL[v].frase)}”</div>` : ''}
          <div class="stats">
            <div><span>Ligações</span><b>${r.total}</b></div>
            <div><span>Atend.</span><b>${r.total ? pct(r.atendeu,r.total)+'%' : '—'}</b></div>
            <div><span>Vendas ${ano}</span><b>${vendas ? (vs.length ? brlCurto(vs.reduce((s,x)=>s+x.valor,0)) : '0') : '…'}</b></div>
          </div>
          <div class="foot">
            <select data-equipe-de="${esc(v)}" style="padding:5px 8px;font-size:12px;">${equipesAtivas.map(e=>`<option ${e===(VENDOR_PERFIL[v]||{}).equipe?'selected':''}>${esc(e)}</option>`).join('')}</select>
            <span><button class="link" data-pin="${esc(v)}">redefinir PIN</button> <button class="link danger" data-remove="${esc(v)}">remover</button></span>
          </div>
        </div>`;
      }).join('')}
      <div class="pcard novo">
        <div class="nm">Novo vendedor</div>
        <input id="newVendorName" placeholder="Nome completo">
        <select id="newVendorEquipe" style="width:100%;">${equipesAtivas.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
        <input id="newVendorPin" placeholder="PIN provisório" inputmode="numeric">
        <button class="btn" id="addVendorBtn" style="justify-content:center;">${icone('mais')}Adicionar vendedor</button>
      </div>
    </div>
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a-gold);font-weight:700;margin:30px 0 12px;">Coordenadores</div>
    <div class="cards-grid">
      ${(state.coords||[]).map(c=>`<div class="pcard">
        <div class="top">${avatar(c.nome)}<div style="flex:1;min-width:0;"><div class="nm">${esc(c.nome)}</div><div class="meta-l">Equipe ${esc(c.equipe||'—')}${c.trocar_pin ? ' · aguardando 1º acesso' : ''}</div></div></div>
        <div class="foot"><span></span><span><button class="link" data-pin="${esc(c.nome)}">redefinir PIN</button> <button class="link danger" data-coord-rem="${esc(c.nome)}">remover</button></span></div>
      </div>`).join('')}
      <div class="pcard novo">
        <div class="nm">Novo coordenador</div>
        <input id="newCoordNome" placeholder="Nome">
        <select id="newCoordEquipe" style="width:100%;">${equipesAtivas.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
        <input id="newCoordPin" placeholder="PIN provisório" inputmode="numeric">
        <button class="btn" id="addCoordBtn" style="justify-content:center;">${icone('mais')}Criar acesso</button>
      </div>
    </div>`;
  const bind = app=>{
    document.getElementById('addVendorBtn').onclick = addVendor;
    document.getElementById('addCoordBtn').onclick = addCoordenador;
    app.querySelectorAll('[data-pin]').forEach(b=>{ b.onclick = ()=>redefinirPin(b.getAttribute('data-pin')); });
    app.querySelectorAll('[data-coord-rem]').forEach(b=>{ b.onclick = ()=>removeCoordenador(b.getAttribute('data-coord-rem')); });
    app.querySelectorAll('[data-equipe-de]').forEach(sel=>{
      sel.onchange = async ()=>{
        try{ await rpc('admin_definir_equipe', {p_nome:sel.getAttribute('data-equipe-de'), p_equipe:sel.value}); await loadVendorList(); render(); }
        catch(e){ console.error(e); alert('Não foi possível mudar a equipe.'); }

    app.querySelectorAll('[data-remove]').forEach(btn=>{ btn.onclick = ()=>removeVendor(btn.getAttribute('data-remove')); });
    app.querySelectorAll('[data-perfil]').forEach(btn=>{ btn.onclick = ()=>abrirPerfil(btn.getAttribute('data-perfil')); });
  };
  return {top, html, bind};
}

// ---------------- Cronograma ----------------
function paginaCronograma(){
  const blocos = state.cronoDraft || cronoBlocos;
  const eventos = state.cronoEventosDraft || cronoEventos;
  const e = cronoEstado();
  const iniDia = hhmmMin(blocos[0].inicio), fimDia = hhmmMin(blocos[blocos.length-1].fim), totalDia = Math.max(1, fimDia-iniDia);
  const diaHoje = new Date().getDay();
  const top = {titulo:'Cronograma diário', sub:'Segunda a sexta · horário de Brasília · vale para todos os vendedores'};
  const html = `
    <div class="grid-2">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>Como fica o dia</h3><span class="hint">${blocos[0].inicio.replace(/^0/,'')} às ${blocos[blocos.length-1].fim.replace(/^0/,'')}</span></div>
          <div class="card-b">
            <div class="timeline">
              ${blocos.map((b,i)=>`
                <div class="blk ${b.tipo} ${e.i===i?'atual':''}" style="flex:${hhmmMin(b.fim)-hhmmMin(b.inicio)};" title="${esc(b.titulo)} · ${b.inicio}–${b.fim}">
                  ${b.tipo==='passo' ? `<b>${esc(b.num||'')}</b>` : `<span>${b.tipo==='cafe'?'☕':'Intervalo'}</span>`}
                  <span>${b.inicio.replace(/^0/,'')}–${b.fim.replace(/^0/,'')}</span>
                </div>`).join('')}
            </div>
            ${eventos.length ? `
              <div class="tl-eventos">
                ${eventos.map(ev=>{
                  const s0 = Math.max(hhmmMin(ev.inicio), iniDia), f0 = Math.min(hhmmMin(ev.fim), fimDia);
                  if(f0 <= s0) return '';
                  const esq = (s0-iniDia)/totalDia*100, larg = (f0-s0)/totalDia*100;
                  return `<div class="tl-ev ${ev.dia===diaHoje?'hoje':''}" style="left:${esq}%;width:${larg}%;" title="${esc(ev.titulo)} · ${DIAS_SEMANA[ev.dia]} ${ev.inicio}–${ev.fim}"></div>
                    <div class="tl-ev-txt" style="left:calc(${esq+larg}% + 8px);">📣 ${esc(DIAS_SEMANA[ev.dia])} ${ev.inicio.replace(/^0/,'')}–${ev.fim.replace(/^0/,'')} · ${esc(ev.titulo)}</div>`;
                }).join('')}
              </div>` : ''}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Horários</h3><span class="hint">Quem estiver com o site aberto recebe a mudança em até 15 minutos.</span></div>
          <div class="scroll-x"><table class="tbl">
            <thead><tr><th>Etapa</th><th>Início</th><th>Fim</th><th class="r">Duração</th></tr></thead>
            <tbody>
              ${blocos.map((b,i)=>`<tr>
                <td style="white-space:normal;min-width:150px;">${b.tipo==='passo' ? `<b style="color:var(--a-gold);">Passo ${esc(b.num||'')}</b> · ${esc(b.titulo)}` : `<span class="mute">${esc(b.titulo)}</span>`}</td>
                <td><input type="time" class="crono-time" data-i="${i}" data-campo="inicio" value="${b.inicio}" aria-label="Início"></td>
                <td><input type="time" class="crono-time" data-i="${i}" data-campo="fim" value="${b.fim}" aria-label="Fim"></td>
                <td class="r mute">${duracaoLabel(Math.max(0, hhmmMin(b.fim)-hhmmMin(b.inicio)))}</td>
              </tr>`).join('')}
            </tbody>
          </table></div>
          <div class="card-b" style="padding-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
            <button class="btn ghost so-rep" id="cronoResetBtn">Voltar ao padrão</button>
            <button class="btn gold so-rep" id="cronoSaveBtn">Salvar horários</button>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Eventos fixos da semana</h3><span class="hint">Aparecem só no dia escolhido, por cima do cronograma (no cartão e na barra do dia)</span></div>
          <div class="scroll-x"><table class="tbl">
            <thead><tr><th>Evento</th><th>Dia</th><th>Início</th><th>Fim</th><th></th></tr></thead>
            <tbody>
              ${eventos.map((ev,i)=>`<tr>
                <td><input class="ev-campo" data-i="${i}" data-campo="titulo" value="${esc(ev.titulo)}" placeholder="Nome do evento" style="min-width:200px;"></td>
                <td><select class="ev-campo" data-i="${i}" data-campo="dia">${DIAS_SEMANA.map((d,k)=>`<option value="${k}" ${k===ev.dia?'selected':''}>${d}</option>`).join('')}</select></td>
                <td><input type="time" class="ev-campo" data-i="${i}" data-campo="inicio" value="${ev.inicio}" aria-label="Início"></td>
                <td><input type="time" class="ev-campo" data-i="${i}" data-campo="fim" value="${ev.fim}" aria-label="Fim"></td>
                <td class="r"><button class="link danger" data-ev-del="${i}">remover</button></td>
              </tr>`).join('') || `<tr><td colspan="5" class="mute" style="text-align:center;padding:20px;">Nenhum evento fixo.</td></tr>`}
            </tbody>
          </table></div>
          <div class="card-b" style="padding-top:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;">
            <button class="btn so-rep" id="evAddBtn">${icone('mais')}Adicionar evento</button>
            <button class="btn gold so-rep" id="evSaveBtn">Salvar eventos</button>
          </div>
        </div>
      </div>
      <div class="stack">
        <div>
          <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin:0 0 8px 2px;">Como o vendedor vê agora</div>
          ${renderCronoCard(true)}
        </div>
      </div>
    </div>`;
  const bind = app=>{
    app.querySelectorAll('.crono-time').forEach(inp=>{
      inp.onchange = ()=>{
        state.cronoDraft = (state.cronoDraft || cronoBlocos).map(b=>({...b}));
        state.cronoDraft[Number(inp.getAttribute('data-i'))][inp.getAttribute('data-campo')] = inp.value;
        render();
      };
    });
    const rascunhoEventos = ()=> state.cronoEventosDraft = (state.cronoEventosDraft || cronoEventos).map(x=>({...x}));
    app.querySelectorAll('.ev-campo').forEach(inp=>{
      inp.onchange = ()=>{
        const lista = rascunhoEventos(), campo = inp.getAttribute('data-campo');
        lista[Number(inp.getAttribute('data-i'))][campo] = campo==='dia' ? Number(inp.value) : inp.value;
        render();
      };
    });
    app.querySelectorAll('[data-ev-del]').forEach(b=>{
      b.onclick = ()=>{ rascunhoEventos().splice(Number(b.getAttribute('data-ev-del')),1); render(); };
    });
    document.getElementById('evAddBtn').onclick = ()=>{ rascunhoEventos().push({titulo:'', dia:1, inicio:'10:00', fim:'11:00'}); render(); };
    document.getElementById('evSaveBtn').onclick = ()=>salvarCronograma(state.cronoDraft || cronoBlocos, state.cronoEventosDraft || cronoEventos);
    document.getElementById('cronoSaveBtn').onclick = ()=>salvarCronograma(state.cronoDraft || cronoBlocos, state.cronoEventosDraft || cronoEventos);
    document.getElementById('cronoResetBtn').onclick = ()=>{
      if(confirm('Voltar todos os horários para o padrão do cronograma (9:30 às 19:00)? Os eventos fixos continuam.')) salvarCronograma(CRONO_PADRAO.map(b=>({...b})), cronoEventos);
    };
  };
  return {top, html, bind};
}

];
const relUrl = caminho => (state.relUrls||{})[caminho] || '#';
async function assinarRelatorios(caminhos){
  if(!caminhos.length) return;
  try{
    const res = await fetch(SUPABASE_URL + '/storage/v1/object/sign/relatorios', {
      method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type':'application/json'},
      body: JSON.stringify({expiresIn: 21600, paths: caminhos})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.relUrls = state.relUrls || {};
    (await res.json()).forEach(x=>{ if(x.signedURL) state.relUrls[x.path] = SUPABASE_URL + '/storage/v1' + x.signedURL; });
  }catch(e){ console.error('Falha ao gerar links dos relatórios', e); }
}
const relRotulo = r => r.semana ? `Semana ${r.semana}` : 'Fechamento do mês';

function irParaCentral(id){

}

// ---------------- Relatorios (vendedor) ----------------
async function loadRelatoriosVendedor(){
  const vendor = state.vendor;
  try{
    const rows = await sb('relatorios?select=id,ano,mes,semana,titulo,caminho,criado_em,visto_em&vendedor='+eq(vendor)+'&order=ano.desc,mes.desc,semana.desc.nullsfirst', undefined, 1);
    if(state.vendor !== vendor) return;
    state.relatorios = rows || [];
    await assinarRelatorios(state.relatorios.map(r=>r.caminho));
  }catch(e){
    console.error('Falha ao carregar relatórios', e);
    if(!state.relatorios) state.relatorios = [];
    state.relErro = true;
  }
  if(state.view==='app') render();
}

async function abrirRelatorio(id){
  const r = (state.relatorios||[]).find(x=>x.id===id);
  if(!r) return;
  // telas menores nao tem o visualizador ao lado: abre o PDF numa aba nova
  if(window.matchMedia('(max-width:1180px)').matches) window.open(relUrl(r.caminho), '_blank', 'noopener');
  state.relAberto = id;
  if(!r.visto_em){
    r.visto_em = new Date().toISOString();
    sb('relatorios?id=eq.'+id+'&visto_em=is.null', {method:'PATCH', prefer:'return=minimal', body:{visto_em: r.visto_em}})
      .catch(e=>console.error('Falha ao marcar relatório como visto', e));
  }
  render();
}

function paginaRelatoriosVendedor(){
  const lista = state.relatorios;
  const top = {titulo:'Meus relatórios', sub:'Os relatórios semanais que o gestor envia para você'};
  if(!lista) return {top, html:`<div class="card"><div class="card-b" style="padding:30px;text-align:center;color:var(--a-dim);">Carregando relatórios...</div></div>`};

  const aberto = lista.find(r=>r.id===state.relAberto) || lista[0];
  const novos = lista.filter(r=>!r.visto_em).length;
  top.sub = `${lista.length} relatórios${novos ? ` · <span style="color:var(--a-gold);">${novos} ${novos===1?'novo':'novos'}</span>` : ''}`;
  const grupos = [];
  lista.forEach(r=>{
    const k = r.ano+'-'+r.mes;
    let g = grupos.find(x=>x.k===k);
    if(!g){ g = {k, nome:`${MESES[r.mes-1]} de ${r.ano}`, itens:[]}; grupos.push(g); }
    g.itens.push(r);
  });

  const html = `
    <div class="rel-wrap">
      <div class="card rel-list">
        ${grupos.map(g=>`
          <div class="rel-mes">${g.nome}</div>
          ${g.itens.map(r=>`
            <button class="rel-item ${r.id===aberto.id?'on':''}" data-rel="${r.id}">
              <span class="ic">PDF</span>
              <span style="min-width:0;">${relRotulo(r)}<small>enviado em ${new Date(r.criado_em).toLocaleDateString('pt-BR')}</small></span>
              ${!r.visto_em ? '<span class="pill ok novo">novo</span>' : ''}
            </button>`).join('')}
        `).join('')}
      </div>
      <div class="card viewer">
        <div class="card-h">
          <h3>${MESES[aberto.mes-1]} · ${relRotulo(aberto)}</h3>
          <a class="btn small" href="${relUrl(aberto.caminho)}" target="_blank" rel="noopener">${icone('baixar')}Abrir em nova aba</a>
        </div>
        <iframe src="${relUrl(aberto.caminho)}#view=FitH" title="Relatório ${esc(relRotulo(aberto))}"></iframe>
      </div>
    </div>`;
  const bind = app=>{
    app.querySelectorAll('[data-rel]').forEach(b=>{ b.onclick = ()=>abrirRelatorio(Number(b.getAttribute('data-rel'))); });

    if(!aberto.visto_em && !window.matchMedia('(max-width:1180px)').matches) abrirRelatorio(aberto.id);
  };
  return {top, html, bind};
}

// ---------------- Relatorios (admin) ----------------
const MESES_MIN = MESES.map(m=>m.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase());
// "Relatório Arthur Lima - Novembro 1.pdf" -> {vendedor, mes, semana}
function lerNomeRelatorio(nomeArquivo){
  const base = nomeArquivo.replace(/\.pdf$/i,'');
  const simples = base.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const vendedor = VENDORES.find(v=>simples.includes(v.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()))
    || VENDORES.find(v=>simples.includes(v.split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()))
    || '';
  const iMes = MESES_MIN.findIndex(m=>simples.includes(m));
  const num = simples.match(/(\d)\s*$/);
  const hoje = new Date();
  return {
    vendedor,
    mes: iMes>=0 ? iMes+1 : hoje.getMonth()+1,
    semana: num ? Number(num[1]) : Math.min(5, Math.ceil(hoje.getDate()/7))
  };
}
const slugNome = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function loadAdminRelatorios(){
  try{
    const rows = await sb('relatorios?select=id,vendedor,ano,mes,semana,caminho,criado_em,visto_em&order=ano.desc,mes.desc,semana.desc.nullsfirst,vendedor', undefined, 1);
    state.adminRel = rows || [];
    await assinarRelatorios(state.adminRel.map(r=>r.caminho));
  }catch(e){
    console.error('Falha ao carregar relatórios', e);
    state.adminRel = state.adminRel || [];
  }
  if(state.view==='admin') render();
}

function adicionarArquivosRelatorio(files){
  const ano = new Date().getFullYear();
  [...files].filter(f=>/\.pdf$/i.test(f.name)).forEach(f=>{
    const lido = lerNomeRelatorio(f.name);
    state.relEnvio.push({file:f, nome:f.name, ano, ...lido, status:''});
  });
  render();
}

async function enviarRelatorios(){
  const fila = state.relEnvio.filter(x=>x.status!=='ok');
  if(fila.some(x=>!x.vendedor)){ alert('Escolhe o vendedor de todos os arquivos antes de enviar.'); return; }
  for(const item of fila){
    item.status = 'enviando'; render();
    const caminho = `${item.ano}/${String(item.mes).padStart(2,'0')}/${item.semana ? 'semana-'+item.semana : 'mes'}/${slugNome(item.vendedor)}.pdf`;
    try{
      const res = await fetch(SUPABASE_URL + '/storage/v1/object/relatorios/' + caminho, {
        method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type':'application/pdf', 'x-upsert':'true'}, body:item.file
      });
      if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));
      await sb('relatorios?on_conflict=caminho', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body:{vendedor:item.vendedor, ano:item.ano, mes:item.mes, semana:item.semana||null, caminho, tamanho:item.file.size,
              titulo:`Relatório semanal · ${MESES[item.mes-1]} · ${item.semana ? 'Semana '+item.semana : 'Mês'}`,
              criado_em:new Date().toISOString(), visto_em:null}
      });
      item.status = 'ok';
    }catch(e){
      console.error('Falha ao enviar relatório', item.nome, e);
      item.status = 'erro';
    }
  }
  const ok = state.relEnvio.filter(x=>x.status==='ok').length, erro = state.relEnvio.filter(x=>x.status==='erro').length;
  state.relEnvio = state.relEnvio.filter(x=>x.status!=='ok');
  await loadAdminRelatorios();
  showCronoToast('Relatórios', `${ok} ${ok===1?'enviado':'enviados'}${erro ? ` · ${erro} com erro, tenta de novo` : ''}`);
}

async function removerRelatorio(id){
  const r = state.adminRel.find(x=>x.id===id);
  if(!r || !confirm(`Remover o relatório de ${r.vendedor} (${MESES[r.mes-1]} · ${relRotulo(r)})?`)) return;
  try{
    await fetch(SUPABASE_URL + '/storage/v1/object/relatorios/' + r.caminho, {method:'DELETE', headers: await cabecalhoAuth()});
    await sb('relatorios?id=eq.'+id, {method:'DELETE'});
  }catch(e){
    console.error('Falha ao remover relatório', e);
    alert('Não foi possível remover o relatório. Tenta de novo.');
  }
  await loadAdminRelatorios();
}

          <tbody>
            ${!todos ? `<tr><td colspan="6" class="mute" style="text-align:center;padding:24px;">Carregando...</td></tr>` :

                <td class="r"><a class="link" href="${relUrl(r.caminho)}" target="_blank" rel="noopener">ver</a> <button class="link danger so-rep" data-rel-del="${r.id}">remover</button></td>

const METAS_FIXAS = {
  semana: {ligacoes:150, agendamentos:5, comparecimentos:2, vendas:1},
  mes:    {ligacoes:600, agendamentos:20, comparecimentos:7, vendas:1}
};
// no ranking de 2026 a primeira coluna (abril) e o acumulado de janeiro a abril
const RANKING_ACUMULADO = {2026: 4};

const dKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dDe = k => new Date(k+'T12:00:00');
function somaDias(k, n){ const d = dDe(k); d.setDate(d.getDate()+n); return dKey(d); }
const dataCurta = k => dDe(k).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

// "26/10-02/11/2026 (FECHADA)", "17-23/08/2026", "10-16/08" -> {ini, fim} (AAAA-MM-DD)
function lerSemana(rotulo, anoPadrao){
  const t = String(rotulo).replace(/\(.*?\)/g,'').trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if(m){
    const ano = Number(m[5]||anoPadrao), viraAno = Number(m[2]) > Number(m[4]);
    return {ini: dKey(new Date(ano-(viraAno?1:0), m[2]-1, Number(m[1]))), fim: dKey(new Date(ano, m[4]-1, Number(m[3])))};
  }
  m = t.match(/^(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if(m){
    const ano = Number(m[4]||anoPadrao);
    return {ini: dKey(new Date(ano, m[3]-1, Number(m[1]))), fim: dKey(new Date(ano, m[3]-1, Number(m[2])))};
  }
  return null;
}

async function loadDesempenho(){
  const desde = somaDias(todayKey(), -150);
  try{
    const [dias, metricas, vendas] = await Promise.all([
      rpc('ligacoes_diarias', {p_desde: desde}, 1),
      sb('metricas_semanais?select=vendedor,semana,agendamentos,comparecimentos,vendas,receita,cards_parados,zero_comentario,negocios_ativos,dias_atividade', undefined, 1),
      rpc('vendas_resumo', {}, 1)
    ]);
    const ano = new Date().getFullYear();
    state.desemp = {
      desde,
      dias: dias || [],
      semanas: (metricas||[]).map(m=>({...m, ...(lerSemana(m.semana, ano)||{})})).filter(m=>m.ini),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar desempenho', e);
    state.desemp = {erro:true};
  }
  render();
}

// Numeros de um vendedor num intervalo de dias [ini, fim]
function desempenhoPeriodo(vendedor, ini, fim, opts){
  const D = state.desemp;
  const dias = D.dias.filter(x=>x.vendedor===vendedor && x.dia>=ini && x.dia<=fim);
  const r = {
    ligacoes: dias.reduce((s,x)=>s+x.total,0),
    atendidas: dias.reduce((s,x)=>s+x.atendidas,0),
    diasTrabalhados: dias.filter(x=>x.total>0).length,
    agendamentos:0, comparecimentos:0, vendas:0, receita:0, cardsParados:null, semanasOficiais:[]
  };
  // semanas oficiais que comecam dentro do periodo
  const oficiais = D.semanas.filter(s=>s.vendedor===vendedor && s.ini>=ini && s.ini<=fim).sort((a,b)=>a.ini<b.ini?-1:1);
  oficiais.forEach(s=>{
    r.agendamentos += s.agendamentos||0; r.comparecimentos += s.comparecimentos||0;
    r.vendas += s.vendas||0; r.receita += Number(s.receita||0);
  });
  if(oficiais.length) r.cardsParados = oficiais[oficiais.length-1].cards_parados;
  r.semanasOficiais = oficiais;
  // dias que nenhuma semana oficial cobre: usa o que o site registrou
  const coberto = k => D.semanas.some(s=>s.vendedor===vendedor && k>=s.ini && k<=s.fim);
  dias.filter(x=>!coberto(x.dia)).forEach(x=>{ r.agendamentos += x.agendamentos; });
  D.vendas.filter(v=>v.vendedor===vendedor && v.data>=ini && v.data<=fim && !coberto(v.data)).forEach(v=>{ r.vendas += 1; r.receita += v.valor; });
  if(opts && opts.comparecimentosSemanaAtual) r.comparecimentos += opts.comparecimentosSemanaAtual;
  return r;
}

function inicioSemana(k){ const d = dDe(k); const dia = d.getDay(); d.setDate(d.getDate() + (dia===0 ? -6 : 1-dia)); return dKey(d); }
function fimMes(k){ const d = dDe(k); return dKey(new Date(d.getFullYear(), d.getMonth()+1, 0)); }

// Frases da leitura automatica, no estilo dos relatorios semanais
function leituraAutomatica(v, mes, semana, time, diasUteisRestantes){
  const bem = [], atencao = [], cruzada = [];
  const M = METAS_FIXAS.mes, S = METAS_FIXAS.semana;
  if(semana){
    const nomeSem = `Na semana ${dataCurta(semana.ini)} a ${dataCurta(semana.fim)}`;
    const batidas = ['ligacoes','agendamentos','comparecimentos','vendas'].filter(k=>(semana.r[k]||0) >= S[k]);
    if(batidas.length===4) bem.push(`${nomeSem} você bateu as quatro metas semanais.`);
    else if(batidas.length) bem.push(`${nomeSem} você bateu ${batidas.length} de 4 metas: ${batidas.map(k=>({ligacoes:'ligações',agendamentos:'agendamentos',comparecimentos:'comparecimentos',vendas:'vendas'}[k])).join(', ')}.`);
    if(semana.r.ligacoes < S.ligacoes) atencao.push(`${nomeSem} foram <b>${semana.r.ligacoes} ligações</b>; a meta é ${S.ligacoes} (30 por dia).`);
    if(semana.r.agendamentos < S.agendamentos) atencao.push(`Agendamentos da semana: <b>${semana.r.agendamentos} de ${S.agendamentos}</b>. Lembre: 1 agendamento por dia.`);
  }
  if(mes.vendas >= M.vendas) bem.push(`Você já vendeu no mês: <b>${mes.vendas} ${mes.vendas===1?'venda':'vendas'}${mes.receita ? ' · '+BRL.format(mes.receita) : ''}</b>.`);
  else atencao.push(`Você ainda não vendeu neste mês. A meta do time é <b>ninguém zerado</b>${diasUteisRestantes ? ` — faltam ${diasUteisRestantes} dias úteis` : ''}.`);
  if(mes.agendamentos >= M.agendamentos) bem.push(`Meta de agendamentos do mês batida: <b>${mes.agendamentos}</b> de ${M.agendamentos}.`);
  if(mes.comparecimentos >= M.comparecimentos) bem.push(`Meta de comparecimentos do mês batida: <b>${mes.comparecimentos}</b> de ${M.comparecimentos}.`);
  if(mes.cardsParados != null && time.cardsParados != null && mes.cardsParados > Math.max(30, time.cardsParados*1.3))
    atencao.push(`<b>${mes.cardsParados} cards parados</b> na última semana fechada (média do time: ${Math.round(time.cardsParados)}). Negócio parado precisa de movimento ou ir para o controle de qualidade.`);

  if(mes.agendamentos > 0 && mes.ligacoes > 0){
    const lpa = Math.round(mes.ligacoes / mes.agendamentos);
    const lpaTime = time.agendamentos ? Math.round(time.ligacoes / time.agendamentos) : null;
    cruzada.push(`Neste mês você precisou de <b>${lpa} ligações para cada agendamento</b>${lpaTime ? ` (time: ${lpaTime})` : ''}: ${mes.ligacoes} ligações → ${mes.agendamentos} agendamentos → ${mes.comparecimentos} comparecimentos → ${mes.vendas} ${mes.vendas===1?'venda':'vendas'}.`);
  }else if(mes.ligacoes > 0){
    cruzada.push(`Neste mês: ${mes.ligacoes} ligações e nenhum agendamento ainda. Pela média da FBS, 600 ligações geram 20 agendamentos, 7 comparecimentos e 1 venda.`);
  }
  if(mes.agendamentos >= 3 && mes.semanasOficiais.length){
    const taxa = Math.round(mes.comparecimentos / mes.agendamentos * 100);
    const taxaTime = time.agendamentos ? Math.round(time.comparecimentos / time.agendamentos * 100) : null;
    cruzada.push(`Agendamento → comparecimento: <b>${taxa}%</b>${taxaTime!==null ? ` (time: ${taxaTime}%)` : ''}.${taxaTime!==null && taxa < taxaTime-10 ? ' Confirme a visita na véspera para trazer mais gente à loja.' : ''}`);
  }
  if(diasUteisRestantes > 0 && mes.ligacoes < M.ligacoes){
    const falta = M.ligacoes - mes.ligacoes;
    cruzada.push(`Para fechar as ${M.ligacoes} ligações do mês faltam <b>${falta}</b>: cerca de ${Math.ceil(falta/diasUteisRestantes)} por dia útil.`);
  }
  return {bem, atencao, cruzada};
}

function diasUteisEntre(iniK, fimK){
  let n = 0; for(let k=iniK; k<=fimK; k=somaDias(k,1)){ const d = dDe(k).getDay(); if(d!==0 && d!==6) n++; }
  return n;
}

function paginaDesempenho(){
  const top = {titulo:'Meu desempenho', sub:'Metas fixas da FBS: 150 ligações, 5 agendamentos, 2 comparecimentos e 1 venda por semana'};
  const D = state.desemp;
  if(!D) return {top, html:`<div class="card"><div class="card-b" style="padding:30px;text-align:center;color:var(--a-dim);">Carregando seu desempenho...</div></div>`};
  if(D.erro) return {top, html:`<div class="alerta"><div class="t">Não consegui carregar seus números agora</div><button class="btn small" id="desRetry" style="margin-top:10px;">Tentar de novo</button></div>`,
    bind:()=>{ document.getElementById('desRetry').onclick = ()=>{ state.desemp = null; render(); loadDesempenho(); }; }};

  const v = state.vendor, hoje = todayKey();
  const iniMes = hoje.slice(0,8)+'01', fimM = fimMes(hoje);
  const iniSem = inicioSemana(hoje);
  const compSemana = state.metas && state.metas.comparecimentos ? state.metas.comparecimentos.progresso : 0;
  const temOficialSemana = D.semanas.some(s=>s.vendedor===v && hoje>=s.ini && hoje<=s.fim);
  const mes = desempenhoPeriodo(v, iniMes, hoje, {comparecimentosSemanaAtual: temOficialSemana ? 0 : compSemana});
  const M = METAS_FIXAS.mes;
  const diasUteisRestantes = diasUteisEntre(somaDias(hoje,1), fimM);

  // media do time no mes (vendedores ativos)
  const doTime = VENDORES.map(x=>desempenhoPeriodo(x, iniMes, hoje));
  const time = {
    ligacoes: doTime.reduce((s,x)=>s+x.ligacoes,0), agendamentos: doTime.reduce((s,x)=>s+x.agendamentos,0),
    comparecimentos: doTime.reduce((s,x)=>s+x.comparecimentos,0),
    cardsParados: (()=>{ const c = doTime.map(x=>x.cardsParados).filter(x=>x!=null); return c.length ? c.reduce((a,b)=>a+b,0)/c.length : null; })()
  };
  const zerados = VENDORES.filter((x,i)=>doTime[i].vendas===0).length;

  // semanas: as 8 ultimas oficiais do vendedor + a semana em andamento
  const oficiais = D.semanas.filter(s=>s.vendedor===v).sort((a,b)=>a.ini<b.ini?1:-1).slice(0,8).reverse();
  const linhas = oficiais.map(s=>({ini:s.ini, fim:s.fim, oficial:true, r:{
    ligacoes: D.dias.filter(x=>x.vendedor===v && x.dia>=s.ini && x.dia<=s.fim).reduce((a,x)=>a+x.total,0),
    agendamentos:s.agendamentos||0, comparecimentos:s.comparecimentos||0, vendas:s.vendas||0, receita:Number(s.receita||0), cardsParados:s.cards_parados
  }}));
  const ultimaOficial = linhas[linhas.length-1];
  // semana em andamento: do dia seguinte a ultima semana oficial (ou da segunda-feira) ate domingo
  if(!temOficialSemana){
    const iniAnd = ultimaOficial && ultimaOficial.fim >= iniSem ? somaDias(ultimaOficial.fim, 1) : iniSem;
    const fimAnd = somaDias(iniSem, 6);
    if(iniAnd <= hoje){
      const r = desempenhoPeriodo(v, iniAnd, fimAnd, {comparecimentosSemanaAtual: compSemana});
      linhas.push({ini:iniAnd, fim:fimAnd, oficial:false, r});
    }
  }
  const leitura = leituraAutomatica(v, mes, ultimaOficial, time, diasUteisRestantes);
  const maxLig = Math.max(METAS_FIXAS.semana.ligacoes, ...linhas.map(l=>l.r.ligacoes));
  const corMeta = (x, meta) => x>=meta ? '#5FD39A' : (x>=meta*.7 ? 'var(--a-gold)' : '#E59866');
  const funil = [
    {l:'Ligações', v:mes.ligacoes}, {l:'Atendidas', v:mes.atendidas}, {l:'Agendamentos', v:mes.agendamentos},
    {l:'Comparecimentos', v:mes.comparecimentos}, {l:'Vendas', v:mes.vendas}
  ];
  top.sub = `${MESES[Number(hoje.slice(5,7))-1]} de ${hoje.slice(0,4)} · ${diasUteisRestantes} ${diasUteisRestantes===1?'dia útil restante':'dias úteis restantes'}`;

  const blocoLeitura = (titulo, cor, fundo, itens) => itens.length ? `
    <div style="border-left:3px solid ${cor};background:${fundo};border-radius:0 12px 12px 0;padding:13px 16px;">
      <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:${cor};font-weight:700;margin-bottom:6px;">${titulo}</div>
      ${itens.map(t=>`<div style="font-size:13px;line-height:1.55;margin-top:4px;">${t}</div>`).join('')}
    </div>` : '';

  const html = `
    <div class="kpis">
      ${[
        {l:'Ligações no mês', v:mes.ligacoes, m:M.ligacoes},
        {l:'Agendamentos', v:mes.agendamentos, m:M.agendamentos},
        {l:'Comparecimentos', v:mes.comparecimentos, m:M.comparecimentos},
        {l:'Vendas', v:mes.vendas, m:M.vendas, extra: mes.receita ? BRL.format(mes.receita) : ''}
      ].map((k,i)=>`
        <div class="kpi ${i===3 && k.v>=k.m ? 'destaque' : ''}"><div class="l">${k.l}</div>
          <div class="v">${k.v.toLocaleString('pt-BR')}<span style="font-size:17px;color:var(--a-dim);"> / ${k.m}</span></div>
          <div class="barra" style="margin-top:10px;min-width:0;"><i style="width:${Math.min(100,pct(k.v,k.m))}%;background:${corMeta(k.v,k.m)};"></i></div>
          <div class="d">${k.v>=k.m ? 'meta do mês batida' : `faltam ${k.m-k.v}`}${k.extra ? ' · '+k.extra : ''}</div>
        </div>`).join('')}
    </div>

    <div class="grid-2" style="margin-bottom:18px;">
      <div class="card">
        <div class="card-h"><h3>Leitura do mês</h3><span class="hint">gerada a partir dos seus números</span></div>
        <div class="card-b" style="display:flex;flex-direction:column;gap:12px;">
          ${blocoLeitura('O que foi bem', '#5FD39A', 'rgba(47,158,100,.10)', leitura.bem)}
          ${blocoLeitura('Ponto de atenção', '#F0A3A3', 'rgba(139,58,58,.14)', leitura.atencao)}
          ${blocoLeitura('Leitura cruzada', 'var(--a-gold)', 'var(--a-gold-soft)', leitura.cruzada)}
          ${!leitura.bem.length && !leitura.atencao.length && !leitura.cruzada.length ? '<div class="mute" style="font-size:13px;">Ainda não há números suficientes neste mês.</div>' : ''}
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>Funil do mês</h3><span class="hint">ligação até a venda</span></div>
          <div class="card-b">
            ${funil.map((f,i)=>`
              <div style="margin-top:${i?10:0}px;">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;">
                  <span>${f.l}</span>
                  <span><b>${f.v.toLocaleString('pt-BR')}</b>${i ? `<span class="mute" style="font-size:11px;"> · ${funil[i-1].v ? pct(f.v, funil[i-1].v)+'%' : '—'}</span>` : ''}</span>
                </div>
                <div class="barra" style="min-width:0;height:10px;"><i style="width:${funil[0].v ? Math.max(f.v?2:0, f.v/funil[0].v*100) : 0}%;background:${['#6FA8DC','#5FD39A','var(--a-gold)','#E59866','#B39DDB'][i]};"></i></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Time no mês</h3></div>
          <div class="card-b" style="font-size:13px;line-height:1.7;">
            <div>${VENDORES.length - zerados} de ${VENDORES.length} vendedores já venderam</div>

          </div>

      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Ligações por semana</h3><span class="legend"><span><i style="background:var(--a-gold);"></i>ligações</span><span><i style="background:transparent;border-top:2px dashed #5FD39A;border-radius:0;height:0;vertical-align:3px;"></i>meta 150</span></span></div>

          </div>`).join('')}
      </div>
      <div class="chart-x">${linhas.map(l=>`<span>${dataCurta(l.ini)}</span>`).join('')}</div>

    <div class="card">

          <tbody>
            ${[...linhas].reverse().map(l=>{
              const S = METAS_FIXAS.semana;

// ---------------- Ranking ----------------
async function loadRanking(){
  try{
    const [hist, vendas] = await Promise.all([
      sb('ranking_historico?select=vendedor,ano,mes,valor,ativo', undefined, 1),
      rpc('vendas_resumo', {}, 1)
    ]);
    state.ranking = {
      hist: (hist||[]).map(r=>({...r, valor:Number(r.valor)})),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar ranking', e);
    state.ranking = {erro:true};
  }
  render();
}

function montarRanking(ano){
  const R = state.ranking, hoje = new Date();
  const mesAtual = ano===hoje.getFullYear() ? hoje.getMonth()+1 : 12;
  const hist = R.hist.filter(r=>r.ano===ano);
  const mesesHist = [...new Set(hist.filter(r=>r.mes).map(r=>r.mes))].sort((a,b)=>a-b);
  const primeiro = mesesHist.length ? mesesHist[0] : 1;
  const ultimoHist = mesesHist.length ? mesesHist[mesesHist.length-1] : 0;
  const meses = []; for(let m=primeiro; m<=mesAtual; m++) meses.push(m);
  const vendasAno = R.vendas.filter(v=>v.data.slice(0,4)===String(ano));
  const nomes = new Set([...hist.filter(r=>r.ativo).map(r=>r.vendedor), ...VENDORES]);
  const ativos = [...nomes].map(nome=>{
    const valores = meses.map(m=>{
      if(m <= ultimoHist){ const h = hist.find(r=>r.vendedor===nome && r.mes===m); return h ? h.valor : null; }
      const vs = vendasAno.filter(v=>v.vendedor===nome && Number(v.data.slice(5,7))===m);
      if(vs.length) return vs.reduce((s,v)=>s+v.valor,0);
      return VENDORES.includes(nome) ? 0 : null;
    });
    const total = valores.reduce((s,x)=>s+(x||0),0);
    // media: meses em que estava no time (o mes atual so conta se ja vendeu)
    const mesesConta = valores.filter((x,i)=>x!==null && (meses[i]<mesAtual || x>0)).length;
    return {nome, valores, total, media: mesesConta ? total/mesesConta : 0, ativoHoje: VENDORES.includes(nome)};
  }).filter(x=>x.total>0 || x.ativoHoje).sort((a,b)=>b.total-a.total);
  const sairam = hist.filter(r=>!r.ativo).sort((a,b)=>b.valor-a.valor);
  const totalSairam = sairam.reduce((s,r)=>s+r.valor,0);
  const totalAno = ativos.reduce((s,x)=>s+x.total,0) + totalSairam;
  const iAtual = meses.indexOf(mesAtual);
  const totalMesAtual = iAtual>=0 ? ativos.reduce((s,x)=>s+(x.valores[iAtual]||0),0) : 0;
  const venderamMes = iAtual>=0 ? ativos.filter(x=>x.ativoHoje && (x.valores[iAtual]||0)>0).length : 0;
  return {meses, ativos, sairam, totalSairam, totalAno, mesAtual, totalMesAtual, venderamMes, iAtual};
}

  Campanhas de premiacao. Progresso do vendedor = base lancada no admin (vendas de
  antes do site) + vendas registradas no site dentro do periodo, so dos canais da
  campanha. "Marco" e a antecipacao (ex.: R$ 3 mi ate 31/10 ja libera o premio).
*/
ICONES.campanhas = '<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/>';

async function loadCampanhas(){
  try{
    const [lista, ajustes, vendas] = await Promise.all([
      sb('campanhas?select=*&order=inicio.desc', undefined, 1),
      sb('campanha_ajustes?select=campanha_id,vendedor,valor', undefined, 1),
      rpc('vendas_resumo', {}, 1)
    ]);
    state.camp = {
      lista: (lista||[]).map(c=>({...c, meta:Number(c.meta), marco_valor: c.marco_valor!=null ? Number(c.marco_valor) : null})),
      ajustes: (ajustes||[]).map(a=>({...a, valor:Number(a.valor)})),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar campanhas', e);
    state.camp = {erro:true};
  }
  render();
}

function progressoCampanha(c, vendedor){
  const C = state.camp;
  const base = (C.ajustes.find(a=>a.campanha_id===c.id && a.vendedor===vendedor)||{}).valor || 0;
  const vale = v => v.vendedor===vendedor && v.data>=c.inicio && v.data<=c.fim && (!c.canais.length || c.canais.includes(v.canal));
  const vendas = C.vendas.filter(vale);
  const site = vendas.reduce((s,v)=>s+v.valor,0);
  const total = base + site;
  const ateMarco = c.marco_ate ? base + vendas.filter(v=>v.data<=c.marco_ate).reduce((s,v)=>s+v.valor,0) : 0;
  return {base, site, nVendas: vendas.length, total, pct: total/c.meta, bateu: total>=c.meta,
          marcoOk: !!(c.marco_valor && ateMarco>=c.marco_valor), ateMarco};
}

function statusCampanha(c, pr){
  const hoje = todayKey();
  if(pr.bateu) return {cls:'ok', txt:'🏆 Meta batida! O prêmio é seu.'};
  if(pr.marcoOk) return {cls:'ok', txt:`Antecipação garantida: o prêmio já é seu. Faltam ${BRL.format(c.meta-pr.total)} para confirmar até ${dataCurta(c.fim)}.`};
  if(hoje > c.fim) return {cls:'', txt:`Campanha encerrada com ${BRL.format(pr.total)}.`};
  if(c.marco_valor && c.marco_ate && hoje <= c.marco_ate)
    return {cls:'', txt:`Faltam ${BRL.format(c.marco_valor-pr.ateMarco)} para a antecipação até ${dataCurta(c.marco_ate)} · ${BRL.format(c.meta-pr.total)} para a meta.`};
  const dias = diasUteisEntre(hoje, c.fim);
  return {cls:'', txt:`Faltam ${BRL.format(c.meta-pr.total)} até ${dataCurta(c.fim)}${dias ? ` · cerca de ${brlCurto((c.meta-pr.total)/dias)} por dia útil` : ''}.`};
}

function barraCampanha(c, pr, alto){
  const marco = c.marco_valor ? Math.min(100, c.marco_valor/c.meta*100) : null;
  return `<div class="camp-barra" style="height:${alto||12}px;">
    <i style="width:${Math.min(100, pr.pct*100)}%;"></i>
    ${marco!==null ? `<span class="camp-marco" style="left:${marco}%;" title="Antecipação: ${BRL.format(c.marco_valor)} até ${dataCurta(c.marco_ate)}"></span>` : ''}
  </div>`;
}

function periodoCampanha(c){
  const hoje = todayKey();
  if(hoje < c.inicio) return `<span class="pill">começa em ${dataCurta(c.inicio)}</span>`;
  if(hoje > c.fim) return `<span class="pill">encerrada em ${dataCurta(c.fim)}</span>`;
  const dias = Math.round((dDe(c.fim) - dDe(hoje)) / 864e5);
  return `<span class="pill live">valendo · ${dias===0 ? 'último dia' : `faltam ${dias} ${dias===1?'dia':'dias'}`}</span>`;
}

    </div>`;
  }).join('') || `<div class="card"><div class="card-b" style="padding:36px;text-align:center;color:var(--a-dim);">Nenhuma campanha ainda. Clique em <b>Nova campanha</b>.</div></div>`;

  const bind = app=>{

}

async function salvarBaseCampanha(id, vendedor, texto){
  const valor = parseBRL(texto);
  if(Number.isNaN(valor) || (valor!==null && valor<0)){ alert('Digita um valor válido, por exemplo 1.050.000'); render(); return; }
  try{
    await sb('campanha_ajustes?on_conflict=campanha_id,vendedor', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{campanha_id:id, vendedor, valor: valor||0}});
  }catch(e){
    console.error('Falha ao salvar base da campanha', e);
    alert('Não foi possível salvar. Tenta de novo.');
  }
  await loadCampanhas();
}

async function alternarCampanha(id){
  const c = state.camp.lista.find(x=>x.id===id);
  if(!confirm(c.ativa ? `Ocultar "${c.titulo}" da Central do Vendedor?` : `Mostrar "${c.titulo}" para os vendedores?`)) return;
  try{ await sb('campanhas?id=eq.'+id, {method:'PATCH', prefer:'return=minimal', body:{ativa:!c.ativa}}); }
  catch(e){ console.error(e); alert('Não foi possível alterar a campanha.'); return; }
  await loadCampanhas();
}

/*
  Minha meta: o vendedor escolhe quanto quer vender no mes e ve o funil necessario,
  pela regra da FBS (ticket medio e funil de 1 venda, editaveis no admin) e pelo
  historico dele (as taxas reais das semanas fechadas). A atividade e proporcional

  So o vendedor e o gestor veem.
*/

async function loadMetasPessoais(){

// Taxas reais do vendedor nas semanas fechadas (so semanas com ligacoes registradas no site)
function taxasHistorico(v, regra){
  const D = state.desemp, hoje = todayKey();
  let L=0, A=0, C=0, V=0, Rv=0, Vv=0, n=0, desde=null;
  D.semanas.filter(s=>s.vendedor===v && s.fim < hoje).forEach(s=>{
    const lig = D.dias.filter(x=>x.vendedor===v && x.dia>=s.ini && x.dia<=s.fim).reduce((a,x)=>a+x.total,0);
    if(!lig) return;
    L += lig; A += s.agendamentos||0; C += s.comparecimentos||0; V += s.vendas||0; n++;
    if(s.vendas && Number(s.receita)){ Rv += Number(s.receita); Vv += s.vendas; }
    if(!desde || s.ini < desde) desde = s.ini;
  });
  const fbs = {la: regra.ligacoes/regra.agendamentos, ac: regra.agendamentos/regra.comparecimentos, cv: regra.comparecimentos};
  const la = A>0 ? L/A : null, ac = C>0 ? A/C : null, cv = V>0 ? C/V : null;
  const ticket = Vv>=2 ? Rv/Vv : null;
  const cvU = cv ?? fbs.cv, acU = ac ?? fbs.ac, laU = la ?? fbs.la;
  return {n, desde, L, A, C, V, la, ac, cv, ticket,
    porVenda: {comparecimentos: cvU, agendamentos: cvU*acU, ligacoes: cvU*acU*laU},
    ticketUsado: ticket ?? regra.ticket,
    completo: la!==null && ac!==null && cv!==null};
}
function planoMeta(valor, porVenda, ticket){
  const vendas = valor / ticket;
  const mes = {
    ligacoes: Math.ceil(vendas*porVenda.ligacoes - 1e-9),
    agendamentos: Math.ceil(vendas*porVenda.agendamentos - 1e-9),
    comparecimentos: Math.ceil(vendas*porVenda.comparecimentos - 1e-9)
  };
  const semana = {}, dia = {};
  Object.keys(mes).forEach(k=>{ semana[k] = Math.ceil(mes[k]/4 - 1e-9); dia[k] = Math.ceil(semana[k]/5 - 1e-9); });
  return {vendas, vendasMin: Math.ceil(vendas - 1e-9), mes, semana, dia, ticket};
}
const planoPadrao = (valor, regra) => planoMeta(valor, {ligacoes:regra.ligacoes, agendamentos:regra.agendamentos, comparecimentos:regra.comparecimentos}, regra.ticket);
const vendasTexto = p => { const v = Math.round(p.vendas*10)/10; return Number.isInteger(v) ? `${v} ${v===1?'venda':'vendas'}` : `${v.toLocaleString('pt-BR')} vendas (pelo menos ${p.vendasMin})`; };

      state.mmValor = Number.isNaN(n) ? null : n;
      document.getElementById('mmResultado').innerHTML = htmlPlanos(state.mmValor, v);
      document.getElementById('mmResumo').textContent = state.mmValor ? `${BRL.format(state.mmValor)} = ${vendasTexto(planoPadrao(state.mmValor, state.mp.regra)).replace(/<[^>]+>/g,'')} no ticket médio de ${brlCurto(state.mp.regra.ticket)}.` : '';
      app.querySelectorAll('[data-mm-chip]').forEach(b=>b.classList.toggle('gold', Number(b.getAttribute('data-mm-chip'))===state.mmValor));
      const bt = document.getElementById('mmSalvar');
      bt.textContent = salva ? (salva.valor===state.mmValor ? '✓ Meta salva' : 'Atualizar minha meta') : 'Salvar como minha meta';
    };
    inp.oninput = atualizar;
    app.querySelectorAll('[data-mm-chip]').forEach(b=>{ b.onclick = ()=>{ inp.value = Number(b.getAttribute('data-mm-chip')).toLocaleString('pt-BR'); atualizar(); }; });
    document.getElementById('mmSalvar').onclick = ()=>salvarMetaPessoal(v, mes, state.mmValor);
  };
  return {top, html, bind};
}

async function salvarMetaPessoal(v, mes, valor){
  if(!valor || valor<=0 || Number.isNaN(valor)){ alert('Digita a meta em reais, por exemplo 1.000.000'); return; }
  const M = state.mp, h = taxasHistorico(v, M.regra);
  // guarda o retrato do momento: regra, taxas do vendedor e os dois planos
  const plano = {regra: M.regra, historico: {semanas:h.n, desde:h.desde, ligacoes_por_agendamento:h.la, agendamentos_por_comparecimento:h.ac, comparecimentos_por_venda:h.cv, ticket:h.ticket},
    padrao: planoPadrao(valor, M.regra), pelo_historico: planoMeta(valor, h.porVenda, h.ticketUsado)};
  try{
    await sb('metas_pessoais?on_conflict=vendedor,mes', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{vendedor:v, mes, valor, plano, atualizado_em:new Date().toISOString()}});
  }catch(e){
    console.error('Falha ao salvar meta pessoal', e);
    alert('Não foi possível salvar a meta. Tenta de novo.');
    return;
  }
  await loadMetasPessoais();
  showCronoToast('Minha meta', `${BRL.format(valor)} em ${MESES[Number(mes.slice(5,7))-1].toLowerCase()}`);
}

  const mes = mesAtualKey(), hoje = todayKey(), iniMes = hoje.slice(0,8)+'01', fimM = fimMes(hoje);

    const meta = M.metas.find(m=>m.vendedor===v && m.mes===mes);
    const r = desempenhoPeriodo(v, iniMes, hoje);
    const plano = meta ? planoPadrao(meta.valor, M.regra) : null;
    const esperadoLig = plano ? plano.mes.ligacoes * passados / Math.max(1,totalDias) : 0;
    return {v, meta, r, plano, ritmo: plano && esperadoLig ? r.ligacoes/esperadoLig : null};
  });
  const comMeta = linhas.filter(x=>x.meta);
  const somaMetas = comMeta.reduce((s,x)=>s+x.meta.valor,0);
  const realizado = linhas.reduce((s,x)=>s+x.r.receita,0);
  const realizadoComMeta = comMeta.reduce((s,x)=>s+x.r.receita,0);
  const historico = M.metas.filter(m=>m.mes < mes);
  const ritmoPill = x => x.ritmo==null ? '<span class="mute">—</span>' : (x.ritmo>=1 ? `<span class="pill ok">no ritmo · ${Math.round(x.ritmo*100)}%</span>` : (x.ritmo>=.7 ? `<span class="pill">${Math.round(x.ritmo*100)}% do ritmo</span>` : `<span class="pill warn">${Math.round(x.ritmo*100)}% do ritmo</span>`));

    <div class="kpis">
      <div class="kpi destaque"><div class="l">Se todos baterem</div><div class="v">${brlCurto(somaMetas)}</div><div class="d">soma das metas individuais</div></div>
      <div class="kpi"><div class="l">Produzido no mês</div><div class="v">${brlCurto(realizado)}</div><div class="d">${BRL.format(realizado)}</div></div>
      <div class="kpi"><div class="l">Atingido</div><div class="v">${somaMetas ? pct(realizadoComMeta, somaMetas)+'%' : '—'}</div><div class="d">de quem tem meta</div></div>
      <div class="kpi"><div class="l">Com meta definida</div><div class="v">${comMeta.length}<span style="font-size:17px;color:var(--a-dim);"> / ${VENDORES.length}</span></div><div class="d">${passados} de ${totalDias} dias úteis passados</div></div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Por vendedor</h3><span class="hint">feito / necessário no mês pela regra da FBS</span></div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Vendedor</th><th class="r">Meta do mês</th><th class="r">Vendas</th><th class="r">Ligações</th><th class="r">Agend.</th><th class="r">Comp.</th><th class="r">Produção</th><th>Atingido</th><th>Ritmo de ligações</th></tr></thead>
          <tbody>
            ${linhas.map(x=>`<tr>
              <td><span class="pessoa">${avatar(x.v)}${esc(x.v)}</span></td>
              <td class="r"><input class="cel mm-admin" inputmode="decimal" data-vendedor="${esc(x.v)}" value="${x.meta ? x.meta.valor.toLocaleString('pt-BR') : ''}" placeholder="sem meta"></td>
              <td class="r">${x.plano ? `${x.r.vendas} <span class="mute">/ ${x.plano.vendasMin}</span>` : '<span class="mute">—</span>'}</td>
              <td class="r">${x.r.ligacoes.toLocaleString('pt-BR')}${x.plano ? ` <span class="mute">/ ${x.plano.mes.ligacoes.toLocaleString('pt-BR')}</span>` : ''}</td>
              <td class="r">${x.r.agendamentos}${x.plano ? ` <span class="mute">/ ${x.plano.mes.agendamentos}</span>` : ''}</td>
              <td class="r">${x.r.comparecimentos}${x.plano ? ` <span class="mute">/ ${x.plano.mes.comparecimentos}</span>` : ''}</td>
              <td class="r"><b style="color:var(--a-gold);">${x.r.receita ? brlCurto(x.r.receita) : '0'}</b></td>
              <td style="min-width:130px;">${x.meta ? `<div class="barra" style="min-width:0;height:7px;"><i style="width:${Math.min(100,pct(x.r.receita,x.meta.valor))}%;background:var(--a-gold);"></i></div><span class="mute" style="font-size:11px;">${pct(x.r.receita,x.meta.valor)}%</span>` : '<span class="mute">—</span>'}</td>
              <td>${ritmoPill(x)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-h"><h3>Histórico das metas pessoais</h3><span class="hint">base para descobrir o padrão de cada vendedor</span></div>
        <div class="scroll-x">
          <table class="tbl">
            <thead><tr><th>Mês</th><th>Vendedor</th><th class="r">Meta</th><th class="r">Produção</th><th class="r">Atingido</th><th class="r">Lig./agend.</th></tr></thead>
            <tbody>
              ${historico.map(m=>{
                const ini = m.mes+'-01', r = desempenhoPeriodo(m.vendedor, ini, fimMes(ini));
                const la = m.plano && m.plano.historico && m.plano.historico.ligacoes_por_agendamento;

            </tbody>
          </table>
        </div>
      </div>
      <div class="card so-rep">
        <div class="card-h"><h3>Regra da calculadora</h3></div>
        <div class="card-b">
          <div style="font-size:12px;color:var(--a-dim);margin-bottom:12px;">Usada no "Padrão FBS" da calculadora e no acompanhamento acima.</div>
          <label class="mm-rotulo" for="rgTicket">Ticket médio (R$)</label>

function bindMetasIndividuais(app){
  app.querySelectorAll('.mm-admin').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = inp.getAttribute('data-vendedor'), valor = parseBRL(inp.value), mes = mesAtualKey();
      if(Number.isNaN(valor)){ alert('Digita um valor válido, por exemplo 1.000.000'); render(); return; }
      if(valor===null){
        if(!confirm(`Tirar a meta de ${v} em ${nomeMes(mes).toLowerCase()}?`)){ render(); return; }
        try{ await sb('metas_pessoais?vendedor='+eq(v)+'&mes=eq.'+mes, {method:'DELETE'}); }catch(e){ alert('Não foi possível tirar a meta.'); }
        await loadMetasPessoais();
        return;
      }
      await salvarMetaPessoal(v, mes, valor);
    };
  });
  const bt = document.getElementById('rgSalvar');
  if(bt) bt.onclick = async ()=>{
    const regra = {ticket: parseBRL(document.getElementById('rgTicket').value), ligacoes: Number(document.getElementById('rgLig').value),
      agendamentos: Number(document.getElementById('rgAg').value), comparecimentos: Number(document.getElementById('rgComp').value)};
    if(!regra.ticket || Number.isNaN(regra.ticket) || [regra.ligacoes, regra.agendamentos, regra.comparecimentos].some(x=>!x || x<1)){
      alert('Confere os valores: ticket em reais e números maiores que zero.'); return;
    }
    if(!confirm(`Salvar a regra?\n\nTicket médio ${BRL.format(regra.ticket)}\n1 venda = ${regra.ligacoes} ligações, ${regra.agendamentos} agendamentos, ${regra.comparecimentos} comparecimentos`)) return;
    try{
      await sb('config?on_conflict=chave', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{chave:'regra_meta', valor:regra, atualizado_em:new Date().toISOString()}});
    }catch(e){ console.error(e); alert('Não foi possível salvar a regra.'); return; }
    await loadMetasPessoais();
    showCronoToast('Metas', 'Regra da calculadora salva');
  };
}

async function salvarProducaoMes(mes, equipe, texto){
  const ano = state.prodAno;
  const valor = parseBRL(texto);
  if(Number.isNaN(valor) || (valor !== null && valor < 0)){ alert('Digita um valor válido, por exemplo 1.517.156,10'); render(); return; }
  try{
    if(valor === null){
      await sb(`producao_mensal?ano=eq.${ano}&mes=eq.${mes}&equipe=${eq(equipe)}`, {method:'DELETE'});
    }else{
      await sb('producao_mensal?on_conflict=ano,mes,equipe', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ano, mes, equipe, valor}
      });
    }
  }catch(e){
    console.error('Falha ao salvar produção do mês', e);
    alert('Não foi possível salvar esse valor. Verifica sua conexão e tenta de novo.');
  }
  await loadProducao();
}

async function registrarVenda(){
  const vendedor = document.getElementById('vendaVendedor').value;
  const valor = parseBRL(document.getElementById('vendaValor').value);
  const data = document.getElementById('vendaData').value;
  const cliente = document.getElementById('vendaCliente').value.trim();
  const canal = document.getElementById('vendaCanal').value;
  const equipe = document.getElementById('vendaEquipe').value;
  if(!vendedor){ alert('Escolhe o vendedor.'); return; }
  if(!valor || valor <= 0){ alert('Digita o valor da venda, por exemplo 400.000'); return; }
  if(!data){ alert('Escolhe a data da venda.'); return; }
  if(!equipe){ alert('Cadastre uma equipe ativa antes de registrar vendas.'); return; }
  if(!confirm(`Registrar venda?\n\n${vendedor} · ${BRL.format(valor)}\n${new Date(data+'T12:00:00').toLocaleDateString('pt-BR')}${cliente?' · '+cliente:''}\nEquipe ${equipe}`)) return;
  const btn = document.getElementById('vendaSalvarBtn');
  btn.disabled = true; btn.textContent = 'Registrando...';
  try{
    // sem reenvio automatico: repetir poderia duplicar a venda
    await sb('vendas', {method:'POST', prefer:'return=minimal', body:{vendedor, valor, data, cliente: cliente||null, canal: canal||null, equipe}});
  }catch(e){
    console.error('Falha ao registrar venda', e);
    alert('Não foi possível registrar a venda. Verifica sua conexão e tenta de novo.');
    btn.disabled = false; btn.textContent = 'Registrar venda';
    return;
  }
  state.prodAno = Number(data.slice(0,4));
  state.vendaDrawer = false;
  await loadProducao();
  launchConfetti(false);
  showCronoToast('Venda registrada', `${esc(vendedor)} · ${BRL.format(valor)}`);
}

async function removerVenda(id){
  const v = state.prod.vendas.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Remover a venda de ${v.vendedor} (${BRL.format(v.valor)}, ${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')})?\n\nA cópia que já foi para o Airtable não é apagada: ajuste lá também.`)) return;
  try{
    await sb('vendas?id=eq.'+id, {method:'DELETE'});
  }catch(e){
    console.error('Falha ao remover venda', e);
    alert('Não foi possível remover a venda. Tenta de novo.');
    return;
  }
  await loadProducao();
}

async function adicionarEquipe(){
  const nome = document.getElementById('novaEquipeNome').value.trim();
  const coord = document.getElementById('novaEquipeCoord').value.trim();
  if(!nome){ alert('Digita o nome da equipe.'); return; }
  if(state.prod.equipes.some(e=>e.nome.toLowerCase()===nome.toLowerCase())){ alert('Já existe uma equipe com esse nome.'); return; }
  const ordem = Math.max(0, ...state.prod.equipes.map(e=>e.ordem||0)) + 1;
  const coordenadores = coord ? {[new Date().getFullYear()]: coord} : {};
  try{
    await sb('equipes', {method:'POST', prefer:'return=minimal', body:{nome, coordenadores, ativa:true, ordem}});
  }catch(e){
    console.error('Falha ao adicionar equipe', e);
    alert('Não foi possível adicionar a equipe. Tenta de novo.');
    return;
  }
  await loadProducao();
}

async function salvarCoordenadores(nome, coordenadores){
  try{
    await sb('equipes?nome='+eq(nome), {method:'PATCH', prefer:'return=minimal', body:{coordenadores}});
  }catch(e){
    console.error('Falha ao salvar coordenador', e);
    alert('Não foi possível salvar o coordenador. Tenta de novo.');
    return;
  }
  await loadProducao();
}
// novo coordenador a partir de um mes do ano atual (janeiro vira a chave do ano)
async function trocarCoordenador(nome, coord, mes){
  coord = (coord||'').trim();
  if(!coord){ alert('Digita o nome do novo coordenador.'); return; }
  const ano = new Date().getFullYear();
  const chave = mes===1 ? String(ano) : `${ano}-${String(mes).padStart(2,'0')}`;
  if(!confirm(`${coord} passa a coordenar a ${nome} a partir de ${MESES[mes-1].toLowerCase()} de ${ano}?`)) return;
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  await salvarCoordenadores(nome, {...(eqp.coordenadores||{}), [chave]: coord});
}
async function removerPeriodoCoord(nome, chave){
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  const x = coordPeriodos(eqp).find(p=>p.k===chave);
  if(!x || !confirm(`Tirar ${x.nome} (${periodoRotulo(x)}) da coordenação da ${nome}?`)) return;
  const coordenadores = {...(eqp.coordenadores||{})};
  delete coordenadores[chave];
  await salvarCoordenadores(nome, coordenadores);
}

async function alternarEquipe(nome){
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  const msg = eqp.ativa
    ? `Encerrar a equipe ${nome}? O histórico dela continua guardado; ela só deixa de aparecer para novas vendas.`
    : `Reativar a equipe ${nome}?`;
  if(!confirm(msg)) return;
  try{
    await sb('equipes?nome='+eq(nome), {method:'PATCH', prefer:'return=minimal', body:{ativa: !eqp.ativa}});
  }catch(e){
    console.error('Falha ao alterar equipe', e);
    alert('Não foi possível alterar a equipe. Tenta de novo.');
    return;
  }
  await loadProducao();
}
