function bindPerfilDrawer(){
  const bg = document.getElementById('perfilBg');
  const lerCampos = ()=>{
    state.perfil.apelido = document.getElementById('perfilApelido').value;
    state.perfil.frase = document.getElementById('perfilFrase').value;
    state.perfil.telefone = document.getElementById('perfilTelefone').value;
    state.perfil.aniversario = document.getElementById('perfilAniver').value;
  };
  const fechar = ()=>{ state.perfil = null; render(); };
  bg.onclick = e=>{ if(e.target===bg) fechar(); };
  document.getElementById('perfilCancelar').onclick = fechar;
  document.getElementById('perfilFoto').onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    lerCampos();
    state.perfil.enviando = true; render();
    try{
      state.perfil.foto = await enviarFoto(state.perfil.nome, file);
    }catch(err){
      console.error('Falha ao enviar foto', err);
      alert('Não foi possível enviar a foto. Tenta outra imagem (JPG ou PNG) ou tenta de novo.');
    }
    if(state.perfil){ state.perfil.enviando = false; render(); }
  };
  const tirar = document.getElementById('perfilTirarFoto');
  if(tirar) tirar.onclick = ()=>{ lerCampos(); state.perfil.foto = ''; render(); };
  document.getElementById('perfilSalvar').onclick = salvarPerfil;
}
async function salvarPerfil(){
  const p = state.perfil;
  p.apelido = document.getElementById('perfilApelido').value.trim();
  p.frase = document.getElementById('perfilFrase').value.trim();
  p.telefone = document.getElementById('perfilTelefone').value.replace(/[^0-9]/g,'');
  if(p.telefone && p.telefone.length < 10){ alert('Escreve o telefone com DDD.'); return; }
  p.aniversario = document.getElementById('perfilAniver').value.trim();
  if(p.aniversario && !/^(0?[1-9]|[12]\d|3[01])\/(0?[1-9]|1[0-2])$/.test(p.aniversario)){ alert('Escreve o aniversário como dia/mês, por exemplo 25/03.'); return; }
  if(p.aniversario) p.aniversario = p.aniversario.split('/').map(x=>x.padStart(2,'0')).join('/');
  try{
    await sb('vendedores?nome='+eq(p.nome), {method:'PATCH', prefer:'return=minimal',
      body:{foto_url: p.foto || null, apelido: p.apelido || null, frase: p.frase || null, aniversario: p.aniversario || null, telefone: p.telefone || null}});
  }catch(e){
    console.error('Falha ao salvar perfil', e);
    alert('Não foi possível salvar o perfil. Verifica sua conexão e tenta de novo.');
    return;
  }
  VENDOR_PERFIL[p.nome] = {...VENDOR_PERFIL[p.nome], foto:p.foto, apelido:p.apelido, frase:p.frase, aniversario:p.aniversario, telefone:p.telefone};
  state.perfil = null;
  render();
  showCronoToast('Perfil', 'Perfil salvo');
}

function miniCronoHtml(){
  const e = cronoEstado();
  let v, s;
  if(e.evento){ v = esc(e.evento.titulo); s = `até ${e.evento.fim.replace(/^0/,'')}`; }
  else if(e.fase==='passo'){ v = `Passo ${esc(e.bloco.num||'')} · ${esc(e.bloco.titulo)}`; s = `até ${e.bloco.fim.replace(/^0/,'')} · faltam ${duracaoLabel(e.restante)}`; }
  else if(e.fase==='pausa'){ v = esc(e.bloco.titulo); s = `volta às ${e.bloco.fim.replace(/^0/,'')}`; }
  else if(e.fase==='antes'){ v = 'Antes do início'; s = `começa às ${minHhmm(e.ini)}`; }
  else if(e.fase==='fim'){ v = 'Dia encerrado'; s = 'hora de fechar os relatórios'; }
  else if(e.fase==='livre'){ v = 'Pausa no cronograma'; s = `volta às ${minHhmm(e.ateMin)}`; }
  else { v = 'Fim de semana'; s = 'sem cronograma hoje'; }
  return `<div class="k">Cronograma · ${e.relogio}</div><div class="v">${v}</div><div class="s">${s}</div>`;
}

// ---------------- Producao ----------------
// coordenadores da equipe por periodo: {"2025":"Fabrício","2026":"Edmilson","2026-10":"Fabrício"}
// (chave "AAAA" vale desde janeiro; "AAAA-MM" a partir daquele mes)
function coordPeriodos(eqp){
  return Object.entries(eqp.coordenadores||{})
    .map(([k,nome])=>{ const [a,m] = k.split('-'); return {k, ano:Number(a), mes:Number(m||1), nome}; })
    .sort((x,y)=>x.ano-y.ano || x.mes-y.mes);
}
// quem coordenou no ano, em ordem; quem vinha do ano anterior conta desde janeiro
function coordDoAno(eqp, ano){
  const ps = coordPeriodos(eqp);
  const doAno = ps.filter(x=>x.ano===ano);
  const antes = ps.filter(x=>x.ano<ano).pop();
  if(doAno.length && doAno[0].mes===1) return doAno;
  return antes ? [{...antes, ano, mes:1}, ...doAno] : doAno;
}
const mesCurto = m => MESES[m-1].slice(0,3).toLowerCase();
function coordTexto(eqp, ano){
  const l = coordDoAno(eqp, ano);
  if(l.length < 2) return l.length ? l[0].nome : '';
  return l.map((x,i)=> i===0 ? `${x.nome} até ${mesCurto(l[1].mes-1)}` : `${x.nome} desde ${mesCurto(x.mes)}`).join(' · ');
}
const periodoRotulo = x => x.k.includes('-') ? `desde ${mesCurto(x.mes)}/${x.ano}` : String(x.ano);

function paginaProducao(){
  const p = state.prod;
  const ano = state.prodAno;
  const top = {titulo:'Produção FBS', sub:`Ano de ${ano}`};
  if(!p) return {top, html:`<div class="card"><div class="card-b" style="padding:30px;text-align:center;color:var(--a-dim);">Carregando produção...</div></div>`};
  if(p.erro) return {top, html:`<div class="alerta"><div class="t">Não consegui carregar a produção</div><button class="btn small" id="prodRetryBtn" style="margin-top:10px;">Tentar de novo</button></div>`,
    bind:()=>{ document.getElementById('prodRetryBtn').onclick = ()=>{ state.prod = null; render(); loadProducao(); }; }};

  const hoje = new Date(), anoAtual = hoje.getFullYear(), mesAtual = hoje.getMonth()+1;
  const anos = prodAnos();
  top.acoes = `
    <div class="seg">${anos.map(a=>`<button class="${a===ano?'on':''}" data-prod-ano="${a}">${a}</button>`).join('')}</div>
    <button class="btn gold" id="abrirVendaBtn">${icone('mais')}Registrar venda</button>`;

  const equipes = prodEquipesDoAno(ano);
  const totais = MESES.map((_,i)=>prodTotalMes(ano, i+1));
  const totaisAnt = MESES.map((_,i)=>prodTotalMes(ano-1, i+1));
  const totalAno = totais.reduce((s,v)=>s+(v||0),0);
  const mesesComValor = totais.map((v,i)=>v!==null ? i : -1).filter(i=>i>=0);
  const totalAntMesmo = mesesComValor.reduce((s,i)=>s+(totaisAnt[i]||0),0);
  const temAnt = mesesComValor.some(i=>totaisAnt[i]!==null);
  const variacao = temAnt && totalAntMesmo>0 ? (totalAno/totalAntMesmo - 1)*100 : null;
  const media = mesesComValor.length ? totalAno/mesesComValor.length : 0;
  const melhor = totais.reduce((b,v,i)=>(v!==null && (b<0 || v>totais[b])) ? i : b, -1);
  const maxBar = Math.max(1, ...totais.map(v=>v||0), ...totaisAnt.map(v=>v||0));
  const vendasAno = p.vendas.filter(v=>v.data.slice(0,4)===String(ano));
  const porEquipe = equipes.map(eq=>({eq, total: MESES.reduce((s,_,i)=>{ const c = prodCelula(ano,i+1,eq.nome); return s+(c?c.valor:0); },0)})).filter(x=>x.total>0);

  const html = `
    <div class="kpis">
      <div class="kpi destaque"><div class="l">Produção ${ano}</div><div class="v">${brlCurto(totalAno)}</div><div class="d">${BRL.format(totalAno)}</div></div>
      <div class="kpi"><div class="l">vs ${ano-1}</div><div class="v ${variacao===null?'':(variacao>=0?'up':'down')}">${variacao===null?'—':(variacao>=0?'+':'')+Math.round(variacao)+'%'}</div><div class="d">${variacao===null?'sem dados para comparar':`${BRL.format(totalAntMesmo)} nos mesmos meses`}</div></div>
      <div class="kpi"><div class="l">Média mensal</div><div class="v">${brlCurto(media)}</div><div class="d">${mesesComValor.length} ${mesesComValor.length===1?'mês':'meses'} com produção</div></div>
      <div class="kpi"><div class="l">Melhor mês</div><div class="v">${melhor>=0 ? MESES[melhor] : '—'}</div><div class="d">${melhor>=0 ? BRL.format(totais[melhor]) : 'sem produção'}</div></div>
    </div>

    <div class="grid-2" style="margin-bottom:18px;">
      <div class="card">
        <div class="card-h"><h3>Total FBS por mês</h3><span class="legend"><span><i style="background:#26445F;"></i>${ano-1}</span><span><i style="background:var(--a-gold);"></i>${ano}</span></span></div>
        <div class="chart">
          ${[.25,.5,.75,1].map(f=>`<div class="gl" style="bottom:${f*100}%;"><span>${brlCurto(maxBar*f)}</span></div>`).join('')}
          ${MESES.map((m,i)=>`
            <div class="m">
              <div class="b ant" style="height:${(totaisAnt[i]||0)/maxBar*100}%;${totaisAnt[i]===null?'visibility:hidden;':''}"></div>
              <div class="b" style="height:${(totais[i]||0)/maxBar*100}%;${totais[i]===null?'visibility:hidden;':''}"></div>
              <div class="tip ${i<2?'esq':(i>9?'dir':'')}">${m}<br><b>${ano}: ${totais[i]===null?'—':BRL.format(totais[i])}</b><br>${ano-1}: ${totaisAnt[i]===null?'—':BRL.format(totaisAnt[i])}${totais[i]!==null && totaisAnt[i] ? `<br>${totais[i]>=totaisAnt[i]?'▲':'▼'} ${Math.abs(Math.round((totais[i]/totaisAnt[i]-1)*100))}%` : ''}</div>
            </div>`).join('')}
        </div>
        <div class="chart-x">${MESES.map(m=>`<span>${m.slice(0,3)}</span>`).join('')}</div>
        <div style="height:12px;"></div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>Por equipe</h3><span class="hint">${ano}</span></div>
          <div class="card-b">
            ${porEquipe.length ? `
              <div class="share">${porEquipe.map(x=>`<i style="width:${x.total/totalAno*100}%;background:${corEquipe(x.eq.nome)};" title="${esc(x.eq.nome)}"></i>`).join('')}</div>
              ${porEquipe.map(x=>`
                <div class="share-row">
                  <span class="dot" style="background:${corEquipe(x.eq.nome)};"></span>
                  <span class="nm">${esc(x.eq.nome)}<small>${esc(coordTexto(x.eq, ano) || 'sem coordenador')}</small></span>
                  <span style="text-align:right;"><b>${brlCurto(x.total)}</b><br><span class="mute" style="font-size:11px;">${pct(x.total,totalAno)}%</span></span>
                </div>`).join('')}`
              : '<div class="mute" style="font-size:13px;">Sem produção nesse ano.</div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Últimas vendas</h3><span class="hint">registradas no site</span></div>
          <div class="card-b">
            ${vendasAno.slice(0,5).map(v=>`
              <div class="feed-item">${avatar(v.vendedor)}
                <span style="min-width:0;">${esc(v.vendedor)}<small>${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')}${v.cliente?' · '+esc(v.cliente):''}</small></span>
                <span class="val">${brlCurto(v.valor)}</span>
              </div>`).join('') || `<div class="mute" style="font-size:13px;">Nenhuma venda registrada no site em ${ano}. Use <b>Registrar venda</b> no topo.</div>`}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-h">
        <h3>Produção mês a mês</h3>
        <span style="display:flex;align-items:center;gap:14px;">
          <span class="legend"><span><i style="background:var(--text);"></i>fechado</span><span><i style="background:#5FD39A;"></i>soma das vendas do site</span></span>
          <button class="btn small ${state.prodEdit?'gold':''}" id="prodEditBtn">${state.prodEdit?'Concluir edição':'Editar valores'}</button>
        </span>
      </div>
      ${state.prodEdit ? `<div class="card-b" style="padding-bottom:6px;font-size:12px;color:var(--a-dim);">Digite o valor fechado do mês em reais (ex.: 1.517.156,10). Deixe em branco para usar a soma das vendas registradas no site.</div>` : ''}
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr>
            <th>Mês</th>
            ${equipes.map(eq=>`<th class="r"><span style="color:${corEquipe(eq.nome)};">●</span> ${esc(eq.nome)}${coordTexto(eq, ano) ? `<span class="coord">${esc(coordTexto(eq, ano))}</span>` : ''}</th>`).join('')}
            <th class="r">Total FBS</th>
            <th class="r">vs ${ano-1}</th>
          </tr></thead>
          <tbody>
            ${MESES.map((nome,i)=>{
              const futuro = ano > anoAtual || (ano===anoAtual && i+1 > mesAtual);
              const atual = ano===anoAtual && i+1===mesAtual;
              const v = totais[i], va = totaisAnt[i];
              return `<tr class="${futuro && v===null ? 'futuro' : ''} ${atual?'atual':''}">
                <td>${nome}${atual?' <span class="pill live" style="margin-left:6px;">mês atual</span>':''}</td>
                ${equipes.map(eq=>{
                  const c = prodCelula(ano, i+1, eq.nome);
                  if(state.prodEdit){
                    const man = p.manual.find(r=>r.ano===ano && r.mes===i+1 && r.equipe===eq.nome);
                    return `<td class="r"><input class="cel prod-cell" inputmode="decimal" data-mes="${i+1}" data-equipe="${esc(eq.nome)}" value="${man ? man.valor.toLocaleString('pt-BR',{minimumFractionDigits:2}) : ''}" placeholder="${c && c.fonte==='vendas' ? BRL.format(c.valor) : '—'}"></td>`;
                  }
                  return c ? `<td class="r ${c.fonte==='vendas'?'auto':''}">${BRL.format(c.valor)}</td>` : `<td class="r mute">—</td>`;
                }).join('')}
                <td class="r"><b>${v===null ? '<span class="mute">—</span>' : BRL.format(v)}</b></td>
                <td class="r">${v!==null && va ? `<span class="${v>=va?'up':'down'}">${v>=va?'+':''}${Math.round((v/va-1)*100)}%</span>` : '<span class="mute">—</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td>Total ${ano}</td>
            ${equipes.map(eq=>{
              const s = MESES.reduce((acc,_,i)=>{ const c = prodCelula(ano, i+1, eq.nome); return acc + (c ? c.valor : 0); }, 0);
              return `<td class="r">${s ? BRL.format(s) : '—'}</td>`;
            }).join('')}
            <td class="r">${BRL.format(totalAno)}</td>
            <td class="r">${variacao===null ? '—' : (variacao>=0?'+':'')+Math.round(variacao)+'%'}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-h"><h3>Vendas registradas em ${ano}</h3><span class="hint">${vendasAno.length} ${vendasAno.length===1?'venda':'vendas'} · ${BRL.format(vendasAno.reduce((s,v)=>s+v.valor,0))}</span></div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Data</th><th>Vendedor</th><th>Cliente</th><th>Canal</th><th>Equipe</th><th class="r">Valor</th><th></th></tr></thead>
          <tbody>
            ${vendasAno.map(v=>`<tr>
              <td>${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')}</td>
              <td><span class="pessoa">${avatar(v.vendedor)}${esc(v.vendedor)}</span></td>
              <td>${v.cliente ? esc(v.cliente) : '<span class="mute">—</span>'}</td>
              <td>${v.canal ? esc(v.canal) : '<span class="mute">—</span>'}</td>
              <td>${v.equipe ? esc(v.equipe) : '<span class="mute">—</span>'}</td>
              <td class="r"><b style="color:var(--a-gold);">${BRL.format(v.valor)}</b></td>
              <td class="r"><button class="link danger" data-venda-del="${v.id}">remover</button></td>
            </tr>`).join('') || `<tr><td colspan="7" class="mute" style="text-align:center;padding:24px;">Nenhuma venda registrada no site em ${ano}.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Equipes</h3><span class="hint">Crie uma equipe quando surgir uma nova coordenação. As encerradas continuam no histórico.</span></div>
      <div class="card-b">
        <div class="cards-grid">
          ${p.equipes.map(eq=>{
            const totalGeral = p.manual.filter(r=>r.equipe===eq.nome).reduce((s,r)=>s+r.valor,0)
              + p.vendas.filter(v=>v.equipe===eq.nome && !p.manual.some(r=>r.equipe===eq.nome && r.ano===Number(v.data.slice(0,4)) && r.mes===Number(v.data.slice(5,7)))).reduce((s,v)=>s+v.valor,0);
            return `<div class="pcard">
              <div class="top">
                <span class="av" style="background:${corEquipe(eq.nome)};border-radius:12px;">${esc(iniciais(eq.nome))}</span>
                <div style="flex:1;min-width:0;"><div class="nm">${esc(eq.nome)}</div><div class="meta-l">${eq.ativa ? '<span class="pill live">ativa</span>' : '<span class="pill">encerrada</span>'}</div></div>
              </div>
              <div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin-bottom:4px;">Coordenação</div>
                ${coordPeriodos(eq).map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;">
                  <span><span class="mute" style="font-size:12px;">${periodoRotulo(x)}</span> · ${esc(x.nome)}</span>
                  <button class="link danger" data-coord-del="${esc(eq.nome)}|${esc(x.k)}" title="Remover esse período">×</button>
                </div>`).join('') || '<div class="mute" style="font-size:12px;">sem coordenador registrado</div>'}
              </div>
              <div class="stats" style="grid-template-columns:1fr;"><div><span>Produção total registrada</span><b>${BRL.format(totalGeral)}</b></div></div>
              ${eq.ativa ? `<div style="display:flex;gap:6px;">
                <input data-coord-nome="${esc(eq.nome)}" placeholder="Novo coordenador" style="flex:1;min-width:0;padding:7px 9px;font-size:13px;">
                <select data-coord-mes="${esc(eq.nome)}" style="padding:7px 6px;font-size:13px;">${MESES.map((m,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?'selected':''}>${mesCurto(i+1)}/${new Date().getFullYear()}</option>`).join('')}</select>
                <button class="btn small" data-coord-salvar="${esc(eq.nome)}">Trocar</button>
              </div>` : ''}
              <div class="foot">
                <span></span>
                <button class="link ${eq.ativa?'danger':''}" data-equipe-ativa="${esc(eq.nome)}">${eq.ativa?'encerrar equipe':'reativar'}</button>
              </div>
            </div>`;
          }).join('')}
          <div class="pcard novo">
            <div class="nm">Nova equipe</div>
            <input id="novaEquipeNome" placeholder="Nome da equipe">
            <input id="novaEquipeCoord" placeholder="Coordenador (opcional)">
            <button class="btn" id="novaEquipeBtn" style="justify-content:center;">${icone('mais')}Adicionar equipe</button>
          </div>
        </div>
      </div>
    </div>`;

  const bind = app=>{
    app.querySelectorAll('[data-prod-ano]').forEach(b=>{ b.onclick = ()=>{ state.prodAno = Number(b.getAttribute('data-prod-ano')); render(); }; });
    document.getElementById('abrirVendaBtn').onclick = ()=>{ state.vendaDrawer = true; render(); };
    document.getElementById('prodEditBtn').onclick = ()=>{ state.prodEdit = !state.prodEdit; render(); };
    app.querySelectorAll('.prod-cell').forEach(inp=>{
      inp.onchange = ()=>salvarProducaoMes(Number(inp.getAttribute('data-mes')), inp.getAttribute('data-equipe'), inp.value);
    });
    app.querySelectorAll('[data-venda-del]').forEach(b=>{ b.onclick = ()=>removerVenda(Number(b.getAttribute('data-venda-del'))); });
    app.querySelectorAll('[data-coord-salvar]').forEach(b=>{
      const nome = b.getAttribute('data-coord-salvar');
      b.onclick = ()=>trocarCoordenador(nome,
        app.querySelector(`[data-coord-nome="${CSS.escape(nome)}"]`).value,
        Number(app.querySelector(`[data-coord-mes="${CSS.escape(nome)}"]`).value));
    });
    app.querySelectorAll('[data-coord-del]').forEach(b=>{
      const [nome, k] = b.getAttribute('data-coord-del').split('|');
      b.onclick = ()=>removerPeriodoCoord(nome, k);
    });
    app.querySelectorAll('[data-equipe-ativa]').forEach(b=>{ b.onclick = ()=>alternarEquipe(b.getAttribute('data-equipe-ativa')); });
    document.getElementById('novaEquipeBtn').onclick = adicionarEquipe;
  };
  return {top, html, bind};
}

function renderVendaDrawer(){
  const ativas = state.prod ? state.prod.equipes.filter(e=>e.ativa) : [];
  return `
    <div class="drawer-bg" id="vendaDrawerBg">
      <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="vendaDrawerTitulo">
        <h2 id="vendaDrawerTitulo">Registrar venda</h2>
        <div class="sub">Entra na produção do mês na hora e é copiada para o Airtable.</div>
        <label for="vendaVendedor">Vendedor</label>
        <select id="vendaVendedor">
          <option value="" disabled selected>Escolha o vendedor</option>
          ${VENDORES.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
        </select>
        <label for="vendaValor">Valor da venda (R$)</label>
        <input id="vendaValor" class="valor-grande" inputmode="decimal" placeholder="400.000" autocomplete="off">
        <div class="linha">
          <div><label for="vendaData">Data</label><input id="vendaData" type="date" value="${todayKey()}"></div>
          <div><label for="vendaEquipe">Equipe</label>
            <select id="vendaEquipe">${ativas.map(e=>`<option>${esc(e.nome)}</option>`).join('') || '<option value="">(cadastre uma equipe)</option>'}</select>
          </div>
        </div>
        <label for="vendaCliente">Cliente</label>
        <input id="vendaCliente" placeholder="Nome do cliente" autocomplete="off">
        <label for="vendaCanal">Canal</label>
        <select id="vendaCanal"><option value="">—</option>${CANAIS_VENDA.map(c=>`<option>${c}</option>`).join('')}</select>
        ${(state.camp && !state.camp.erro ? state.camp.lista : []).filter(c=>c.ativa && c.canais.length && todayKey()<=c.fim).map(c=>
          `<div style="font-size:12px;color:#C9B8F0;margin-top:6px;">★ ${esc(c.titulo)}: só conta venda de ${c.canais.map(esc).join(', ')}.</div>`).join('')}
        <div class="acoes">
          <button class="btn" id="vendaCancelarBtn">Cancelar</button>
          <button class="btn gold" id="vendaSalvarBtn">Registrar venda</button>
        </div>
      </div>
    </div>`;
}
function fecharVendaDrawer(){ state.vendaDrawer = false; render(); }
function bindVendaDrawer(){
  const bg = document.getElementById('vendaDrawerBg');
  bg.onclick = e=>{ if(e.target===bg) fecharVendaDrawer(); };
  document.getElementById('vendaCancelarBtn').onclick = fecharVendaDrawer;
  document.getElementById('vendaSalvarBtn').onclick = registrarVenda;
  const selV = document.getElementById('vendaVendedor'), selE = document.getElementById('vendaEquipe');
  // a equipe padrao e a da ultima venda desse vendedor (ou a primeira ativa)
  selV.onchange = ()=>{
    const ult = state.prod && state.prod.vendas.find(v=>v.vendedor===selV.value && v.equipe);
    if(ult && [...selE.options].some(o=>o.value===ult.equipe)) selE.value = ult.equipe;
  };
  setTimeout(()=>selV.focus(), 50);
}
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && state.vendaDrawer) fecharVendaDrawer(); });

// ---------------- Vendedores ----------------
function paginaVendedores(){
  const ano = new Date().getFullYear();
  const rows = state.adminRows || [];
  const vendas = state.prod && !state.prod.erro ? state.prod.vendas.filter(v=>v.data.slice(0,4)===String(ano)) : null;
  const top = {titulo:'Vendedores', sub:`${VENDORES.length} no time · ligações de ${periodLabel().toLowerCase()}`};
  const equipesAtivas = state.prod && !state.prod.erro ? state.prod.equipes.filter(e=>e.ativa).map(e=>e.nome) : ['Gaviões'];
  if(!state.coords) loadCoordenadores();
  const html = `
    <div class="cards-grid">
      ${VENDORES.map(v=>{
        const r = rows.find(x=>x.vendor===v) || {total:0, atendeu:0};
        const vs = vendas ? vendas.filter(x=>x.vendedor===v) : [];
        return `<div class="pcard">
          <div class="top">${avatar(v)}
            <div style="flex:1;min-width:0;"><div class="nm">${esc(v)}</div><div class="meta-l">${esc((VENDOR_PERFIL[v]||{}).equipe || 'sem equipe')}${(VENDOR_PERFIL[v]||{}).aniversario ? ' · 🎂 '+esc(VENDOR_PERFIL[v].aniversario) : ''}</div></div>
            <button class="link" data-perfil="${esc(v)}">editar perfil</button>
          </div>
          ${(VENDOR_PERFIL[v]||{}).frase ? `<div style="font-size:12px;color:var(--a-dim);font-style:italic;">“${esc(VENDOR_PERFIL[v].frase)}”</div>` : ''}
          <div>${campoPin(v, 'vendedor')}</div>
          <div class="stats">
            <div><span>Ligações</span><b>${r.total}</b></div>
            <div><span>Atend.</span><b>${r.total ? pct(r.atendeu,r.total)+'%' : '—'}</b></div>
            <div><span>Vendas ${ano}</span><b>${vendas ? (vs.length ? brlCurto(vs.reduce((s,x)=>s+x.valor,0)) : '0') : '…'}</b></div>
          </div>
          <div class="foot">
            <select data-equipe-de="${esc(v)}" style="padding:5px 8px;font-size:12px;">${equipesAtivas.map(e=>`<option ${e===(VENDOR_PERFIL[v]||{}).equipe?'selected':''}>${esc(e)}</option>`).join('')}</select>
            <span><button class="link" data-pin="${esc(v)}">redefinir PIN</button> <button class="link danger" data-remove="${esc(v)}">remover</button></span>
          </div>
        </div>`;
      }).join('')}
      <div class="pcard novo">
        <div class="nm">Novo vendedor</div>
        <input id="newVendorName" placeholder="Nome completo">
        <select id="newVendorEquipe" style="width:100%;">${equipesAtivas.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
        <input id="newVendorPin" placeholder="PIN provisório" inputmode="numeric">
        <button class="btn" id="addVendorBtn" style="justify-content:center;">${icone('mais')}Adicionar vendedor</button>
      </div>
    </div>
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a-gold);font-weight:700;margin:30px 0 12px;">Coordenadores</div>
    <div class="cards-grid">
      ${(state.coords||[]).map(c=>`<div class="pcard">
        <div class="top">${avatar(c.nome)}<div style="flex:1;min-width:0;"><div class="nm">${esc(c.nome)}</div><div class="meta-l">Equipe ${esc(c.equipe||'—')}${c.trocar_pin ? ' · aguardando 1º acesso' : ''}</div></div></div>
        <div>${campoPin(c.nome, 'coordenador')}</div>
        <div class="foot"><span></span><span><button class="link" data-pin="${esc(c.nome)}">redefinir PIN</button> <button class="link danger" data-coord-rem="${esc(c.nome)}">remover</button></span></div>
      </div>`).join('')}
      <div class="pcard novo">
        <div class="nm">Novo coordenador</div>
        <input id="newCoordNome" placeholder="Nome">
        <select id="newCoordEquipe" style="width:100%;">${equipesAtivas.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
        <input id="newCoordPin" placeholder="PIN provisório" inputmode="numeric">
        <button class="btn" id="addCoordBtn" style="justify-content:center;">${icone('mais')}Criar acesso</button>
      </div>
    </div>`;
  const bind = app=>{
    document.getElementById('addVendorBtn').onclick = addVendor;
    document.getElementById('addCoordBtn').onclick = addCoordenador;
    app.querySelectorAll('[data-pin]').forEach(b=>{ b.onclick = ()=>redefinirPin(b.getAttribute('data-pin')); });
    app.querySelectorAll('[data-ver-pin]').forEach(b=>{ b.onclick = ()=>{
      const k = b.getAttribute('data-ver-pin');
      state.pinsAbertos = {...(state.pinsAbertos||{}), [k]: !(state.pinsAbertos||{})[k]};
      render();
    }; });
    app.querySelectorAll('[data-coord-rem]').forEach(b=>{ b.onclick = ()=>removeCoordenador(b.getAttribute('data-coord-rem')); });
    app.querySelectorAll('[data-equipe-de]').forEach(sel=>{
      sel.onchange = async ()=>{
        try{ await rpc('admin_definir_equipe', {p_nome:sel.getAttribute('data-equipe-de'), p_equipe:sel.value}); await loadVendorList(); render(); }
        catch(e){ console.error(e); alert('Não foi possível mudar a equipe.'); }
      };
    });
    app.querySelectorAll('[data-remove]').forEach(btn=>{ btn.onclick = ()=>removeVendor(btn.getAttribute('data-remove')); });
    app.querySelectorAll('[data-perfil]').forEach(btn=>{ btn.onclick = ()=>abrirPerfil(btn.getAttribute('data-perfil')); });
  };
  return {top, html, bind};
}

// ---------------- Cronograma ----------------
function paginaCronograma(){
  const blocos = state.cronoDraft || cronoBlocos;
  const eventos = state.cronoEventosDraft || cronoEventos;
  const e = cronoEstado();
  const iniDia = hhmmMin(blocos[0].inicio), fimDia = hhmmMin(blocos[blocos.length-1].fim), totalDia = Math.max(1, fimDia-iniDia);
  const diaHoje = new Date().getDay();
  const top = {titulo:'Cronograma diário', sub:'Segunda a sexta · horário de Brasília · vale para todos os vendedores'};
  const html = `
    <div class="grid-2">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>Como fica o dia</h3><span class="hint">${blocos[0].inicio.replace(/^0/,'')} às ${blocos[blocos.length-1].fim.replace(/^0/,'')}</span></div>
          <div class="card-b">
            <div class="timeline">
              ${blocos.map((b,i)=>`
                <div class="blk ${b.tipo} ${e.i===i?'atual':''}" style="flex:${hhmmMin(b.fim)-hhmmMin(b.inicio)};" title="${esc(b.titulo)} · ${b.inicio}–${b.fim}">
                  ${b.tipo==='passo' ? `<b>${esc(b.num||'')}</b>` : `<span>${b.tipo==='cafe'?'☕':'Intervalo'}</span>`}
                  <span>${b.inicio.replace(/^0/,'')}–${b.fim.replace(/^0/,'')}</span>
                </div>`).join('')}
            </div>
            ${eventos.length ? `
              <div class="tl-eventos">
                ${eventos.map(ev=>{
                  const s0 = Math.max(hhmmMin(ev.inicio), iniDia), f0 = Math.min(hhmmMin(ev.fim), fimDia);
                  if(f0 <= s0) return '';
                  const esq = (s0-iniDia)/totalDia*100, larg = (f0-s0)/totalDia*100;
                  return `<div class="tl-ev ${ev.dia===diaHoje?'hoje':''}" style="left:${esq}%;width:${larg}%;" title="${esc(ev.titulo)} · ${DIAS_SEMANA[ev.dia]} ${ev.inicio}–${ev.fim}"></div>
                    <div class="tl-ev-txt" style="left:calc(${esq+larg}% + 8px);">📣 ${esc(DIAS_SEMANA[ev.dia])} ${ev.inicio.replace(/^0/,'')}–${ev.fim.replace(/^0/,'')} · ${esc(ev.titulo)}</div>`;
                }).join('')}
              </div>` : ''}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Horários</h3><span class="hint">Quem estiver com o site aberto recebe a mudança em até 15 minutos.</span></div>
          <div class="scroll-x"><table class="tbl">
            <thead><tr><th>Etapa</th><th>Início</th><th>Fim</th><th class="r">Duração</th></tr></thead>
            <tbody>
              ${blocos.map((b,i)=>`<tr>
                <td style="white-space:normal;min-width:150px;">${b.tipo==='passo' ? `<b style="color:var(--a-gold);">Passo ${esc(b.num||'')}</b> · ${esc(b.titulo)}` : `<span class="mute">${esc(b.titulo)}</span>`}</td>
                <td><input type="time" class="crono-time" data-i="${i}" data-campo="inicio" value="${b.inicio}" aria-label="Início"></td>
                <td><input type="time" class="crono-time" data-i="${i}" data-campo="fim" value="${b.fim}" aria-label="Fim"></td>
                <td class="r mute">${duracaoLabel(Math.max(0, hhmmMin(b.fim)-hhmmMin(b.inicio)))}</td>
              </tr>`).join('')}
            </tbody>
          </table></div>
          <div class="card-b" style="padding-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
            <button class="btn ghost so-rep" id="cronoResetBtn">Voltar ao padrão</button>
            <button class="btn gold so-rep" id="cronoSaveBtn">Salvar horários</button>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Eventos fixos da semana</h3><span class="hint">Aparecem só no dia escolhido, por cima do cronograma (no cartão e na barra do dia)</span></div>
          <div class="scroll-x"><table class="tbl">
            <thead><tr><th>Evento</th><th>Dia</th><th>Início</th><th>Fim</th><th></th></tr></thead>
            <tbody>
              ${eventos.map((ev,i)=>`<tr>
                <td><input class="ev-campo" data-i="${i}" data-campo="titulo" value="${esc(ev.titulo)}" placeholder="Nome do evento" style="min-width:200px;"></td>
                <td><select class="ev-campo" data-i="${i}" data-campo="dia">${DIAS_SEMANA.map((d,k)=>`<option value="${k}" ${k===ev.dia?'selected':''}>${d}</option>`).join('')}</select></td>
                <td><input type="time" class="ev-campo" data-i="${i}" data-campo="inicio" value="${ev.inicio}" aria-label="Início"></td>
                <td><input type="time" class="ev-campo" data-i="${i}" data-campo="fim" value="${ev.fim}" aria-label="Fim"></td>
                <td class="r"><button class="link danger" data-ev-del="${i}">remover</button></td>
              </tr>`).join('') || `<tr><td colspan="5" class="mute" style="text-align:center;padding:20px;">Nenhum evento fixo.</td></tr>`}
            </tbody>
          </table></div>
          <div class="card-b" style="padding-top:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;">
            <button class="btn so-rep" id="evAddBtn">${icone('mais')}Adicionar evento</button>
            <button class="btn gold so-rep" id="evSaveBtn">Salvar eventos</button>
          </div>
        </div>
      </div>
      <div class="stack">
        <div>
          <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin:0 0 8px 2px;">Como o vendedor vê agora</div>
          ${renderCronoCard(true)}
        </div>
      </div>
    </div>`;
  const bind = app=>{
    app.querySelectorAll('.crono-time').forEach(inp=>{
      inp.onchange = ()=>{
        state.cronoDraft = (state.cronoDraft || cronoBlocos).map(b=>({...b}));
        state.cronoDraft[Number(inp.getAttribute('data-i'))][inp.getAttribute('data-campo')] = inp.value;
        render();
      };
    });
    const rascunhoEventos = ()=> state.cronoEventosDraft = (state.cronoEventosDraft || cronoEventos).map(x=>({...x}));
    app.querySelectorAll('.ev-campo').forEach(inp=>{
      inp.onchange = ()=>{
        const lista = rascunhoEventos(), campo = inp.getAttribute('data-campo');
        lista[Number(inp.getAttribute('data-i'))][campo] = campo==='dia' ? Number(inp.value) : inp.value;
        render();
      };
    });
    app.querySelectorAll('[data-ev-del]').forEach(b=>{
      b.onclick = ()=>{ rascunhoEventos().splice(Number(b.getAttribute('data-ev-del')),1); render(); };
    });
    document.getElementById('evAddBtn').onclick = ()=>{ rascunhoEventos().push({titulo:'', dia:1, inicio:'10:00', fim:'11:00'}); render(); };
    document.getElementById('evSaveBtn').onclick = ()=>salvarCronograma(state.cronoDraft || cronoBlocos, state.cronoEventosDraft || cronoEventos);
    document.getElementById('cronoSaveBtn').onclick = ()=>salvarCronograma(state.cronoDraft || cronoBlocos, state.cronoEventosDraft || cronoEventos);
    document.getElementById('cronoResetBtn').onclick = ()=>{
      if(confirm('Voltar todos os horários para o padrão do cronograma (9:30 às 19:00)? Os eventos fixos continuam.')) salvarCronograma(CRONO_PADRAO.map(b=>({...b})), cronoEventos);
    };
  };
  return {top, html, bind};
}

ICONES.hoje = '<path d="M4 11.5 12 5l8 6.5M6 10v9h12v-9"/>';

const CENTRAL_PAGINAS = [
  {id:'hoje', nome:'Hoje'},
  {id:'relatorios', nome:'Relatórios'}
];
const relUrl = caminho => (state.relUrls||{})[caminho] || '#';
async function assinarRelatorios(caminhos){
  if(!caminhos.length) return;
  try{
    const res = await fetch(SUPABASE_URL + '/storage/v1/object/sign/relatorios', {
      method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type':'application/json'},
      body: JSON.stringify({expiresIn: 21600, paths: caminhos})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.relUrls = state.relUrls || {};
    (await res.json()).forEach(x=>{ if(x.signedURL) state.relUrls[x.path] = SUPABASE_URL + '/storage/v1' + x.signedURL; });
  }catch(e){ console.error('Falha ao gerar links dos relatórios', e); }
}
const relRotulo = r => r.semana ? `Semana ${r.semana}` : 'Fechamento do mês';

function irParaCentral(id){
  if(state.centralTab==='atendimentos' && state.at.fichaId && id!=='atendimentos') atSalvar(true);
  state.centralTab = id;
  if(id==='relatorios' && !state.relatorios) loadRelatoriosVendedor();
  if(id==='desempenho'){ if(!state.desemp) loadDesempenho(); if(!state.mp) loadMetasPessoais(); }
  if(id==='ranking' && !state.ranking) loadRanking();
  if(id==='campanhas' && !state.camp) loadCampanhas();
  if(id==='minhameta'){ if(!state.mp) loadMetasPessoais(); if(!state.desemp) loadDesempenho(); }
  if(id==='atendimentos' && !state.at.lista) loadAtendimentos();
  render();
  window.scrollTo(0,0);
}

// ---------------- Relatorios (vendedor) ----------------
async function loadRelatoriosVendedor(){
  const vendor = state.vendor;
  try{
    const rows = await sb('relatorios?select=id,ano,mes,semana,titulo,caminho,criado_em,visto_em&vendedor='+eq(vendor)+'&order=ano.desc,mes.desc,semana.desc.nullsfirst', undefined, 1);
    if(state.vendor !== vendor) return;
    state.relatorios = rows || [];
    await assinarRelatorios(state.relatorios.map(r=>r.caminho));
  }catch(e){
    console.error('Falha ao carregar relatórios', e);
    if(!state.relatorios) state.relatorios = [];
    state.relErro = true;
  }
  if(state.view==='app') render();
}

async function abrirRelatorio(id){
  const r = (state.relatorios||[]).find(x=>x.id===id);
  if(!r) return;
  // telas menores nao tem o visualizador ao lado: abre o PDF numa aba nova
  if(window.matchMedia('(max-width:1180px)').matches) window.open(relUrl(r.caminho), '_blank', 'noopener');
  state.relAberto = id;
  if(!r.visto_em){
    r.visto_em = new Date().toISOString();
    sb('relatorios?id=eq.'+id+'&visto_em=is.null', {method:'PATCH', prefer:'return=minimal', body:{visto_em: r.visto_em}})
      .catch(e=>console.error('Falha ao marcar relatório como visto', e));
  }
  render();
}

function paginaRelatoriosVendedor(){
  const lista = state.relatorios;
  const top = {titulo:'Meus relatórios', sub:'Os relatórios semanais que o gestor envia para você'};
  if(!lista) return {top, html:`<div class="card"><div class="card-b" style="padding:30px;text-align:center;color:var(--a-dim);">Carregando relatórios...</div></div>`};
  if(!lista.length) return {top, html:`<div class="card"><div class="card-b" style="padding:36px;text-align:center;color:var(--a-dim);">${state.relErro ? 'Não consegui carregar seus relatórios agora. Tenta de novo em instantes.' : 'Você ainda não tem relatórios. Quando o gestor enviar, eles aparecem aqui.'}</div></div>`};

  const aberto = lista.find(r=>r.id===state.relAberto) || lista[0];
  const novos = lista.filter(r=>!r.visto_em).length;
  top.sub = `${lista.length} relatórios${novos ? ` · <span style="color:var(--a-gold);">${novos} ${novos===1?'novo':'novos'}</span>` : ''}`;
  const grupos = [];
  lista.forEach(r=>{
    const k = r.ano+'-'+r.mes;
    let g = grupos.find(x=>x.k===k);
    if(!g){ g = {k, nome:`${MESES[r.mes-1]} de ${r.ano}`, itens:[]}; grupos.push(g); }
    g.itens.push(r);
  });

  const html = `
    <div class="rel-wrap">
      <div class="card rel-list">
        ${grupos.map(g=>`
          <div class="rel-mes">${g.nome}</div>
          ${g.itens.map(r=>`
            <button class="rel-item ${r.id===aberto.id?'on':''}" data-rel="${r.id}">
              <span class="ic">PDF</span>
              <span style="min-width:0;">${relRotulo(r)}<small>enviado em ${new Date(r.criado_em).toLocaleDateString('pt-BR')}</small></span>
              ${!r.visto_em ? '<span class="pill ok novo">novo</span>' : ''}
            </button>`).join('')}
        `).join('')}
      </div>
      <div class="card viewer">
        <div class="card-h">
          <h3>${MESES[aberto.mes-1]} · ${relRotulo(aberto)}</h3>
          <a class="btn small" href="${relUrl(aberto.caminho)}" target="_blank" rel="noopener">${icone('baixar')}Abrir em nova aba</a>
        </div>
        <iframe src="${relUrl(aberto.caminho)}#view=FitH" title="Relatório ${esc(relRotulo(aberto))}"></iframe>
      </div>
    </div>`;
  const bind = app=>{
    app.querySelectorAll('[data-rel]').forEach(b=>{ b.onclick = ()=>abrirRelatorio(Number(b.getAttribute('data-rel'))); });
    // o primeiro relatorio ja aparece aberto no visualizador: conta como visto
    if(!aberto.visto_em && !window.matchMedia('(max-width:1180px)').matches) abrirRelatorio(aberto.id);
  };
  return {top, html, bind};
}

// ---------------- Relatorios (admin) ----------------
const MESES_MIN = MESES.map(m=>m.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase());
// "Relatório Arthur Lima - Novembro 1.pdf" -> {vendedor, mes, semana}
function lerNomeRelatorio(nomeArquivo){
  const base = nomeArquivo.replace(/\.pdf$/i,'');
  const simples = base.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const vendedor = VENDORES.find(v=>simples.includes(v.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()))
    || VENDORES.find(v=>simples.includes(v.split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()))
    || '';
  const iMes = MESES_MIN.findIndex(m=>simples.includes(m));
  const num = simples.match(/(\d)\s*$/);
  const hoje = new Date();
  return {
    vendedor,
    mes: iMes>=0 ? iMes+1 : hoje.getMonth()+1,
    semana: num ? Number(num[1]) : Math.min(5, Math.ceil(hoje.getDate()/7))
  };
}
const slugNome = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function loadAdminRelatorios(){
  try{
    const rows = await sb('relatorios?select=id,vendedor,ano,mes,semana,caminho,criado_em,visto_em&order=ano.desc,mes.desc,semana.desc.nullsfirst,vendedor', undefined, 1);
    state.adminRel = rows || [];
    await assinarRelatorios(state.adminRel.map(r=>r.caminho));
  }catch(e){
    console.error('Falha ao carregar relatórios', e);
    state.adminRel = state.adminRel || [];
  }
  if(state.view==='admin') render();
}

function adicionarArquivosRelatorio(files){
  const ano = new Date().getFullYear();
  [...files].filter(f=>/\.pdf$/i.test(f.name)).forEach(f=>{
    const lido = lerNomeRelatorio(f.name);
    state.relEnvio.push({file:f, nome:f.name, ano, ...lido, status:''});
  });
  render();
}

async function enviarRelatorios(){
  const fila = state.relEnvio.filter(x=>x.status!=='ok');
  if(fila.some(x=>!x.vendedor)){ alert('Escolhe o vendedor de todos os arquivos antes de enviar.'); return; }
  for(const item of fila){
    item.status = 'enviando'; render();
    const caminho = `${item.ano}/${String(item.mes).padStart(2,'0')}/${item.semana ? 'semana-'+item.semana : 'mes'}/${slugNome(item.vendedor)}.pdf`;
    try{
      const res = await fetch(SUPABASE_URL + '/storage/v1/object/relatorios/' + caminho, {
        method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type':'application/pdf', 'x-upsert':'true'}, body:item.file
      });
      if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));
      await sb('relatorios?on_conflict=caminho', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body:{vendedor:item.vendedor, ano:item.ano, mes:item.mes, semana:item.semana||null, caminho, tamanho:item.file.size,
              titulo:`Relatório semanal · ${MESES[item.mes-1]} · ${item.semana ? 'Semana '+item.semana : 'Mês'}`,
              criado_em:new Date().toISOString(), visto_em:null}
      });
      item.status = 'ok';
    }catch(e){
      console.error('Falha ao enviar relatório', item.nome, e);
      item.status = 'erro';
    }
  }
  const ok = state.relEnvio.filter(x=>x.status==='ok').length, erro = state.relEnvio.filter(x=>x.status==='erro').length;
  state.relEnvio = state.relEnvio.filter(x=>x.status!=='ok');
  await loadAdminRelatorios();
  showCronoToast('Relatórios', `${ok} ${ok===1?'enviado':'enviados'}${erro ? ` · ${erro} com erro, tenta de novo` : ''}`);
}

async function removerRelatorio(id){
  const r = state.adminRel.find(x=>x.id===id);
  if(!r || !confirm(`Remover o relatório de ${r.vendedor} (${MESES[r.mes-1]} · ${relRotulo(r)})?`)) return;
  try{
    await fetch(SUPABASE_URL + '/storage/v1/object/relatorios/' + r.caminho, {method:'DELETE', headers: await cabecalhoAuth()});
    await sb('relatorios?id=eq.'+id, {method:'DELETE'});
  }catch(e){
    console.error('Falha ao remover relatório', e);
    alert('Não foi possível remover o relatório. Tenta de novo.');
  }
  await loadAdminRelatorios();
}

            ${!todos ? `<tr><td colspan="6" class="mute" style="text-align:center;padding:24px;">Carregando...</td></tr>` :

                <td>${MESES[r.mes-1]} ${r.ano}</td>

                <td class="r"><a class="link" href="${relUrl(r.caminho)}" target="_blank" rel="noopener">ver</a> <button class="link danger so-rep" data-rel-del="${r.id}">remover</button></td>

  const bind = app=>{
    const input = document.getElementById('relFiles'), drop = document.getElementById('relDrop');

    drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = ()=>drop.classList.remove('over');
    drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('over'); adicionarArquivosRelatorio(e.dataTransfer.files); };
    app.querySelectorAll('[data-env]').forEach(sel=>{

*/
ICONES.desempenho = '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>';
ICONES.ranking = '<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3"/>';
CENTRAL_PAGINAS.splice(1, 0, {id:'desempenho', nome:'Desempenho'}, {id:'ranking', nome:'Ranking'});

const METAS_FIXAS = {
  semana: {ligacoes:150, agendamentos:5, comparecimentos:2, vendas:1},
  mes:    {ligacoes:600, agendamentos:20, comparecimentos:7, vendas:1}
};
// no ranking de 2026 a primeira coluna (abril) e o acumulado de janeiro a abril
const RANKING_ACUMULADO = {2026: 4};

const dKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dDe = k => new Date(k+'T12:00:00');
function somaDias(k, n){ const d = dDe(k); d.setDate(d.getDate()+n); return dKey(d); }
const dataCurta = k => dDe(k).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

// "26/10-02/11/2026 (FECHADA)", "17-23/08/2026", "10-16/08" -> {ini, fim} (AAAA-MM-DD)
function lerSemana(rotulo, anoPadrao){
  const t = String(rotulo).replace(/\(.*?\)/g,'').trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if(m){
    const ano = Number(m[5]||anoPadrao), viraAno = Number(m[2]) > Number(m[4]);
    return {ini: dKey(new Date(ano-(viraAno?1:0), m[2]-1, Number(m[1]))), fim: dKey(new Date(ano, m[4]-1, Number(m[3])))};
  }
  m = t.match(/^(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if(m){
    const ano = Number(m[4]||anoPadrao);
    return {ini: dKey(new Date(ano, m[3]-1, Number(m[1]))), fim: dKey(new Date(ano, m[3]-1, Number(m[2])))};
  }
  return null;
}

async function loadDesempenho(){
  const desde = somaDias(todayKey(), -150);

      rpc('vendas_resumo', {}, 1)
    ]);
    const ano = new Date().getFullYear();
    state.desemp = {
      desde,
      dias: dias || [],
      semanas: (metricas||[]).map(m=>({...m, ...(lerSemana(m.semana, ano)||{})})).filter(m=>m.ini),
      vendas: (vendas||[]).map(v=>({...v, valor:Number(v.valor)}))
    };
    if(state.view==='app' && state.vendor){
      try{ Object.assign(state.desemp, await loadPadroesVendedor(state.vendor)); }
      catch(e){ console.error('Falha ao carregar padrões', e); state.desemp.lig = []; state.desemp.comp = []; }
    }
  }catch(e){

    state.desemp = {erro:true};

// Numeros de um vendedor num intervalo de dias [ini, fim]
function desempenhoPeriodo(vendedor, ini, fim, opts){
  const D = state.desemp;
  const dias = D.dias.filter(x=>x.vendedor===vendedor && x.dia>=ini && x.dia<=fim);
  const r = {
    ligacoes: dias.reduce((s,x)=>s+x.total,0),
    atendidas: dias.reduce((s,x)=>s+x.atendidas,0),
    diasTrabalhados: dias.filter(x=>x.total>0).length,
    agendamentos:0, comparecimentos:0, vendas:0, receita:0, cardsParados:null, semanasOficiais:[]
  };
  // semanas oficiais que comecam dentro do periodo
  const oficiais = D.semanas.filter(s=>s.vendedor===vendedor && s.ini>=ini && s.ini<=fim).sort((a,b)=>a.ini<b.ini?-1:1);
  oficiais.forEach(s=>{
    r.agendamentos += s.agendamentos||0; r.comparecimentos += s.comparecimentos||0;
    r.vendas += s.vendas||0; r.receita += Number(s.receita||0);
  });
  if(oficiais.length) r.cardsParados = oficiais[oficiais.length-1].cards_parados;
  r.semanasOficiais = oficiais;
  // dias que nenhuma semana oficial cobre: usa o que o site registrou
  const coberto = k => D.semanas.some(s=>s.vendedor===vendedor && k>=s.ini && k<=s.fim);
  dias.filter(x=>!coberto(x.dia)).forEach(x=>{ r.agendamentos += x.agendamentos; });
  D.vendas.filter(v=>v.vendedor===vendedor && v.data>=ini && v.data<=fim && !coberto(v.data)).forEach(v=>{ r.vendas += 1; r.receita += v.valor; });
  if(opts && opts.comparecimentosSemanaAtual) r.comparecimentos += opts.comparecimentosSemanaAtual;
  return r;
}

function inicioSemana(k){ const d = dDe(k); const dia = d.getDay(); d.setDate(d.getDate() + (dia===0 ? -6 : 1-dia)); return dKey(d); }
function fimMes(k){ const d = dDe(k); return dKey(new Date(d.getFullYear(), d.getMonth()+1, 0)); }

// Frases da leitura automatica, no estilo dos relatorios semanais
function leituraAutomatica(v, mes, semana, time, diasUteisRestantes){
  const bem = [], atencao = [], cruzada = [];
  const M = METAS_FIXAS.mes, S = METAS_FIXAS.semana;
  if(semana){
    const nomeSem = `Na semana ${dataCurta(semana.ini)} a ${dataCurta(semana.fim)}`;
    const batidas = ['ligacoes','agendamentos','comparecimentos','vendas'].filter(k=>(semana.r[k]||0) >= S[k]);
    if(batidas.length===4) bem.push(`${nomeSem} você bateu as quatro metas semanais.`);
    else if(batidas.length) bem.push(`${nomeSem} você bateu ${batidas.length} de 4 metas: ${batidas.map(k=>({ligacoes:'ligações',agendamentos:'agendamentos',comparecimentos:'comparecimentos',vendas:'vendas'}[k])).join(', ')}.`);
    if(semana.r.ligacoes < S.ligacoes) atencao.push(`${nomeSem} foram <b>${semana.r.ligacoes} ligações</b>; a meta é ${S.ligacoes} (30 por dia).`);
    if(semana.r.agendamentos < S.agendamentos) atencao.push(`Agendamentos da semana: <b>${semana.r.agendamentos} de ${S.agendamentos}</b>. Lembre: 1 agendamento por dia.`);
  }
  if(mes.vendas >= M.vendas) bem.push(`Você já vendeu no mês: <b>${mes.vendas} ${mes.vendas===1?'venda':'vendas'}${mes.receita ? ' · '+BRL.format(mes.receita) : ''}</b>.`);
  else atencao.push(`Você ainda não vendeu neste mês. A meta do time é <b>ninguém zerado</b>${diasUteisRestantes ? ` — faltam ${diasUteisRestantes} dias úteis` : ''}.`);
  if(mes.agendamentos >= M.agendamentos) bem.push(`Meta de agendamentos do mês batida: <b>${mes.agendamentos}</b> de ${M.agendamentos}.`);
  if(mes.comparecimentos >= M.comparecimentos) bem.push(`Meta de comparecimentos do mês batida: <b>${mes.comparecimentos}</b> de ${M.comparecimentos}.`);
  if(mes.cardsParados != null && time.cardsParados != null && mes.cardsParados > Math.max(30, time.cardsParados*1.3))
    atencao.push(`<b>${mes.cardsParados} cards parados</b> na última semana fechada (média do time: ${Math.round(time.cardsParados)}). Negócio parado precisa de movimento ou ir para o controle de qualidade.`);

  if(mes.agendamentos > 0 && mes.ligacoes > 0){
    const lpa = Math.round(mes.ligacoes / mes.agendamentos);
    const lpaTime = time.agendamentos ? Math.round(time.ligacoes / time.agendamentos) : null;
    cruzada.push(`Neste mês você precisou de <b>${lpa} ligações para cada agendamento</b>${lpaTime ? ` (time: ${lpaTime})` : ''}: ${mes.ligacoes} ligações → ${mes.agendamentos} agendamentos → ${mes.comparecimentos} comparecimentos → ${mes.vendas} ${mes.vendas===1?'venda':'vendas'}.`);
  }else if(mes.ligacoes > 0){
    cruzada.push(`Neste mês: ${mes.ligacoes} ligações e nenhum agendamento ainda. Pela média da FBS, 600 ligações geram 20 agendamentos, 7 comparecimentos e 1 venda.`);
  }
  if(mes.agendamentos >= 3 && mes.semanasOficiais.length){
    const taxa = Math.round(mes.comparecimentos / mes.agendamentos * 100);
    const taxaTime = time.agendamentos ? Math.round(time.comparecimentos / time.agendamentos * 100) : null;
    cruzada.push(`Agendamento → comparecimento: <b>${taxa}%</b>${taxaTime!==null ? ` (time: ${taxaTime}%)` : ''}.${taxaTime!==null && taxa < taxaTime-10 ? ' Confirme a visita na véspera para trazer mais gente à loja.' : ''}`);
  }
  if(diasUteisRestantes > 0 && mes.ligacoes < M.ligacoes){
    const falta = M.ligacoes - mes.ligacoes;
    cruzada.push(`Para fechar as ${M.ligacoes} ligações do mês faltam <b>${falta}</b>: cerca de ${Math.ceil(falta/diasUteisRestantes)} por dia útil.`);
  }
  return {bem, atencao, cruzada};
}

function diasUteisEntre(iniK, fimK){
  let n = 0; for(let k=iniK; k<=fimK; k=somaDias(k,1)){ const d = dDe(k).getDay(); if(d!==0 && d!==6 && !FERIADOS.has(k)) n++; }
  return n;
}

/*
  Desempenho com leitura profunda: diagnostico da semana oficial mais recente (Airtable),
  funil x time, projecao do mes (padrao FBS e meta pessoal), horarios, ritmo, dia da semana,
  evolucao e carteira. Padroes de horario e ritmo vem das ligacoes do proprio vendedor
  (ultimas 8 semanas). Nenhuma conclusao sai com pouca amostra.
*/
const FERIADOS = new Set(['2026-11-02','2026-11-20','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-03-26','2027-04-21','2027-05-01','2027-05-27','2027-09-07','2027-10-12','2027-11-02','2027-11-15','2027-11-20','2027-12-25']);
const minHM = m => `${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,'0')}`;
const hmMin = s => { const [h,m] = String(s).split(':').map(Number); return h*60+(m||0); };
const pc = (a,b) => b ? Math.round(a/b*100) : 0;
const DIAS_NOME = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_CURTO = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
// [9,11] -> "das 9h às 12h"; [14,14] -> "das 14h às 15h" vira "entre 14h e 15h"
const faixaNome = b => b[0]===b[1] ? `entre ${b[0]}h e ${b[0]+1}h` : `das ${b[0]}h às ${b[1]+1}h`;

async function loadPadroesVendedor(v){
  const desde = new Date(dDe(somaDias(todayKey(), -180)).setHours(0,0,0,0)).toISOString();
  let rows = [];
  for(let off=0; off<20000; off+=1000){
    const r = await sb(`ligacoes?select=ts,tipo&vendedor=${eq(v)}&ts=gte.${desde}&order=ts&limit=1000&offset=${off}`, undefined, 1) || [];
    rows = rows.concat(r);
    if(r.length < 1000) break;
  }
  let comp = [];
  try{ comp = await sb('compromissos?select=*&vendedor='+eq(v)+'&order=semana.desc&limit=12', undefined, 1) || []; }
  catch(e){ console.error('Falha ao carregar compromissos', e); }
  return {lig: rows.map(x=>({t:new Date(x.ts), a:x.tipo==='atendeu'})), comp};
}

function analisarDesempenho(v){
  const D = state.desemp;
  if(!D || D.erro || !D.lig) return null;
  const ofs = D.semanas.filter(s=>s.vendedor===v).sort((a,b)=>a.ini<b.ini?-1:1);
  if(!ofs.length) return null;
  const W = ofs[ofs.length-1], WA = ofs.length>1 ? ofs[ofs.length-2] : null;
  // dia util = dia de semana em que o time ligou (pega feriado sem precisar de lista)
  const diasUteisDe = (ini, fim) => {
    const s = new Set(D.dias.filter(x=>x.dia>=ini && x.dia<=fim && x.total>0).map(x=>x.dia));
    return [...s].filter(k=>{ const d = dDe(k).getDay(); return d!==0 && d!==6; }).length || diasUteisEntre(ini, fim) || 1;
  };
  const du = diasUteisDe(W.ini, W.fim);
  const r = desempenhoPeriodo(v, W.ini, W.fim);
  const rA = WA ? desempenhoPeriodo(v, WA.ini, WA.fim) : null, duA = WA ? diasUteisDe(WA.ini, WA.fim) : null;
  const tm = VENDORES.map(x=>desempenhoPeriodo(x, W.ini, W.fim)).filter(x=>x.semanasOficiais.length);
  const soma = k => tm.reduce((s,x)=>s+x[k],0);
  const T = {lig:soma('ligacoes'), at:soma('atendidas'), ag:soma('agendamentos'), comp:soma('comparecimentos')};
  const taxaAt = r.ligacoes ? r.atendidas/r.ligacoes : null, taxaAtT = T.lig ? T.at/T.lig : null;
  const taxaComp = r.agendamentos ? r.comparecimentos/r.agendamentos : null, taxaCompT = T.ag ? T.comp/T.ag : null;
  const metaLig = Math.round(METAS_FIXAS.semana.ligacoes*du/5), metaAg = Math.max(1, Math.round(METAS_FIXAS.semana.agendamentos*du/5));

  // padroes: 8 semanas ate o fim da semana analisada
  const fimP = dDe(somaDias(W.fim,1)); fimP.setHours(0,0,0,0);
  const P = D.lig.filter(l=>l.t<fimP);   // todo o historico ate o fim da semana analisada
  const horas = {};
  P.forEach(l=>{ const h = l.t.getHours(); const o = horas[h] = horas[h] || {n:0,a:0}; o.n++; if(l.a) o.a++; });
  const taxaMedia = P.length ? P.filter(l=>l.a).length/P.length : 0;
  const hs = Object.keys(horas).map(Number).filter(h=>horas[h].n>=15).sort((a,b)=>a-b);
  const melhores = hs.filter(h=>horas[h].n>=30 && horas[h].a/horas[h].n >= taxaMedia*1.15);
  const bandas = [];
  melhores.forEach(h=>{ const b = bandas[bandas.length-1]; if(b && b[1]===h-1) b[1] = h; else bandas.push([h,h]); });
  const faixa = (h0,h1) => { let n=0, a=0; for(let h=h0; h<=h1; h++) if(horas[h]){ n += horas[h].n; a += horas[h].a; } return {n, a, t:n?a/n:0}; };
  const banda = bandas.sort((x,y)=>faixa(y[0],y[1]).n-faixa(x[0],x[1]).n)[0] || null;
  const topVol = hs.slice().sort((a,b)=>horas[b].n-horas[a].n).slice(0,2).sort((a,b)=>a-b);

  const porDia = {};
  P.forEach(l=>{ (porDia[dKey(l.t)] = porDia[dKey(l.t)] || []).push(l.t); });
  const passos = cronoBlocos.filter(b=>b.tipo==='passo');
  const inicioCrono = passos.length ? Math.min(...passos.map(b=>hmMin(b.inicio))) : 570;
  const pausasPrevistas = cronoBlocos.filter(b=>b.tipo!=='passo').map(b=>[hmMin(b.inicio), hmMin(b.fim)]);
  const resumoDia = k => {
    const ts = porDia[k].slice().sort((a,b)=>a-b), m = d=>d.getHours()*60+d.getMinutes();
    let pausas = 0;
    for(let i=1; i<ts.length; i++){
      const a = m(ts[i-1]), b = m(ts[i]);
      if(b-a < 30) continue;
      const previsto = pausasPrevistas.reduce((s,[x,y])=>s+Math.max(0, Math.min(b,y)-Math.max(a,x)), 0);
      if(b-a-previsto >= 30) pausas++;   // almoco e cafe do cronograma nao contam
    }
    return {k, n:ts.length, prim:m(ts[0]), ult:m(ts[ts.length-1]), pausas};
  };
  const diasW = Object.keys(porDia).filter(k=>k>=W.ini && k<=W.fim).sort().map(resumoDia);
  const todosDias = Object.keys(porDia).map(resumoDia);
  const mediaPrim = todosDias.length ? Math.round(todosDias.reduce((s,d)=>s+d.prim,0)/todosDias.length) : null;
  const dow = {};
  P.forEach(l=>{ const d = l.t.getDay(); if(d===0 || d===6) return; const o = dow[d] = dow[d] || {n:0,a:0}; o.n++; if(l.a) o.a++; });
  const evol = ofs.slice(-12).map(s=>{ const x = desempenhoPeriodo(v, s.ini, s.fim), d = diasUteisDe(s.ini, s.fim); return {ini:s.ini, fim:s.fim, lig:x.ligacoes, d, porDia:x.ligacoes/d}; });

  // gargalo: a etapa mais longe do esperado
  const cand = [];
  if(r.ligacoes < metaLig*.85) cand.push({k:'volume', s:1-r.ligacoes/metaLig});
  if(r.ligacoes>=40 && taxaAtT!=null && taxaAt < taxaAtT-.05) cand.push({k:'atendimento', s:(taxaAtT-taxaAt)/taxaAtT});
  if(r.agendamentos < metaAg*.8) cand.push({k:'agendamento', s:1-r.agendamentos/metaAg});
  if(r.agendamentos>=3 && taxaCompT!=null && taxaComp < taxaCompT-.1) cand.push({k:'comparecimento', s:(taxaCompT-taxaComp)/taxaCompT});
  if(r.comparecimentos>=2 && r.vendas===0) cand.push({k:'fechamento', s:.3+.05*r.comparecimentos});
  const gargalo = cand.sort((a,b)=>b.s-a.s)[0] || null;
  const comecaTarde = mediaPrim!=null && todosDias.length>=8 && mediaPrim > inicioCrono+15;
  return {v, W, WA, du, duA, r, rA, T, taxaAt, taxaAtT, taxaComp, taxaCompT, metaLig, metaAg, horas, hs, taxaMedia, melhores, banda, faixa, topVol,
          diasW, todosDias, mediaPrim, inicioCrono, dow, evol, gargalo, comecaTarde, nP:P.length, desdeP: P.length ? dKey(P[0].t) : null, meses: mesesHistorico(v), semanaCompromisso: somaDias(W.fim,1)};
}

// Cada mes: ligacoes do site + semanas oficiais do Airtable que comecam no mes (mesma regra dos relatorios)
function mesesHistorico(v){
  const D = state.desemp;
  const linha = (vend, m) => {
    const ini = m+'-01', fim = fimMes(ini);
    const dias = D.dias.filter(x=>x.vendedor===vend && x.dia>=ini && x.dia<=fim);
    const sem = D.semanas.filter(s=>s.vendedor===vend && s.ini.slice(0,7)===m);
    return {
      lig: dias.reduce((a,x)=>a+x.total,0), at: dias.reduce((a,x)=>a+x.atendidas,0), dt: dias.filter(x=>x.total>0).length,
      ag: sem.reduce((a,s)=>a+(s.agendamentos||0),0), comp: sem.reduce((a,s)=>a+(s.comparecimentos||0),0),
      vendas: sem.reduce((a,s)=>a+(s.vendas||0),0), receita: sem.reduce((a,s)=>a+Number(s.receita||0),0), ns: sem.length
    };
  };
  const meses = [...new Set(D.semanas.filter(s=>s.vendedor===v).map(s=>s.ini.slice(0,7)))].sort().slice(-6);
  return meses.map(m=>{
    const eu = linha(v, m);
    const tm = VENDORES.map(x=>linha(x, m)).filter(x=>x.ns && x.lig);
    const t = tm.reduce((a,x)=>({lig:a.lig+x.lig, at:a.at+x.at, ag:a.ag+x.ag, comp:a.comp+x.comp}), {lig:0,at:0,ag:0,comp:0});
    return {m, ...eu, parcial: m===todayKey().slice(0,7), tAt: t.lig ? t.at/t.lig : null, tComp: t.ag ? t.comp/t.ag : null, tLigAg: t.ag ? t.lig/t.ag : null};
  }).filter(x=>x.lig || x.ns);
}
// em quantos meses o mesmo problema apareceu
function recorrencia(A, k){
  // comparecimento e fechamento vem do Airtable e nao dependem das ligacoes do site
  const ms = A.meses.filter(x=>['comparecimento','fechamento'].includes(k) ? x.ns>0 : x.lig>=50);
  const cond = {
    comparecimento: x=>x.ag>=3 && x.tComp!=null && x.comp/x.ag < x.tComp-.1,
    volume: x=>x.dt && x.lig/x.dt < METAS_FIXAS.semana.ligacoes/5*.85,
    atendimento: x=>x.tAt!=null && x.at/x.lig < x.tAt-.05,
    agendamento: x=>x.tLigAg!=null && (!x.ag || x.lig/x.ag > x.tLigAg*1.25),
    fechamento: x=>x.comp>=2 && !x.vendas
  }[k];
  if(!cond) return null;
  return {k: ms.filter(cond).length, n: ms.length};
}

const AT_GARGALO = {
  volume: 'Seu gargalo é o volume de ligações', atendimento: 'Seu gargalo é a taxa de atendimento',
  agendamento: 'Seu gargalo é transformar conversa em agendamento', comparecimento: 'Seu gargalo é o comparecimento',
  fechamento: 'Seu gargalo é o fechamento'
};
function compromissosSugeridos(A){
  const inicio = A.comecaTarde ? `, e começar a ligar às ${minHM(A.inicioCrono)}` : '';
  const faixaTxt = A.banda ? faixaNome(A.banda) : 'no começo da manhã';
  const lista = {
    comparecimento: {tipo:'comparecimento', texto:'Confirmar todas as visitas na véspera e de novo na manhã da visita'+inicio},
    volume: {tipo:'volume', texto:`Fazer ${Math.ceil(METAS_FIXAS.semana.ligacoes/5)} ligações por dia útil`+inicio},
    atendimento: {tipo:'atendimento', texto:`Concentrar mais ligações ${faixaTxt}, quando mais te atendem`},
    agendamento: {tipo:'agendamento', texto:'Propor dia e hora de visita em toda ligação atendida'+inicio},
    fechamento: {tipo:'fechamento', texto:'Ligar em até 48 horas para cada cliente que veio à loja e não fechou'},
    ritmo: {tipo:'volume', texto:`Manter ${Math.ceil(METAS_FIXAS.semana.ligacoes/5)} ligações e 1 agendamento por dia útil`+inicio}
  };
  const ordem = [A.gargalo ? A.gargalo.k : 'ritmo', 'comparecimento','volume','agendamento','atendimento','fechamento'];
  return [...new Set(ordem)].map(k=>lista[k]);
}
function diagnostico(A){
  const {r, rA, du, duA, T} = A;
  const titulo = A.gargalo ? AT_GARGALO[A.gargalo.k] : 'Semana no ritmo certo';
  // o que foi bem
  const bem = [];
  if(r.vendas) bem.push(`<b>${r.vendas} ${r.vendas===1?'venda':'vendas'}${r.receita ? ' de R$ '+brlCurto(r.receita) : ''}</b>`);
  if(r.agendamentos >= A.metaAg) bem.push(`meta de agendamentos batida: <b>${r.agendamentos} de ${A.metaAg}</b>`);
  if(r.ligacoes >= A.metaLig) bem.push(`<b>${r.ligacoes} ligações</b>, acima da meta de ${A.metaLig}`);
  if(r.agendamentos>=2 && A.taxaComp!=null && A.taxaCompT!=null && A.taxaComp >= A.taxaCompT) bem.push(`comparecimento de <b>${pc(r.comparecimentos,r.agendamentos)}%</b>, acima do time`);
  let fBem = bem.length ? bem.slice(0,2).join(' e ').replace(/^./, c=>c.toUpperCase())+'.' : '';
  if(r.ligacoes>=40 && A.taxaAtT!=null && A.taxaAt > A.taxaAtT+.03) fBem += ` Você é atendido em <b>${pc(r.atendidas,r.ligacoes)}%</b> das ligações, acima do time (${pc(T.at,T.lig)}%).`;
  // gargalo
  let fGar = '';
  const g = A.gargalo && A.gargalo.k;
  if(g==='volume') fGar = `Foram <b>${r.ligacoes} ligações em ${du} ${du===1?'dia útil':'dias úteis'}</b> (${(r.ligacoes/du).toFixed(1).replace('.',',')} por dia). A meta da semana era ${A.metaLig}.${rA && duA ? ` Na semana anterior foram ${(rA.ligacoes/duA).toFixed(1).replace('.',',')} por dia.` : ''}`;
  if(g==='atendimento') fGar = `Atenderam <b>${pc(r.atendidas,r.ligacoes)}%</b> das suas ligações; no time foram ${pc(T.at,T.lig)}%. O horário em que você liga pesa nisso.`;
  if(g==='agendamento') fGar = `<b>${r.agendamentos} ${r.agendamentos===1?'agendamento':'agendamentos'}</b> para uma meta de ${A.metaAg} na semana, com ${r.atendidas} ligações atendidas.`;
  if(g==='comparecimento') fGar = `De ${r.agendamentos} agendados, <b>só ${r.comparecimentos} ${r.comparecimentos===1?'veio':'vieram'} (${pc(r.comparecimentos,r.agendamentos)}%)</b>. No time vêm ${pc(T.comp,T.ag)}%. Na média do time, seriam <b>${Math.round(r.agendamentos*T.comp/T.ag)} visitas</b>.`;
  if(g==='fechamento') fGar = `<b>${r.comparecimentos} clientes vieram à loja</b> e nenhum fechou ainda. O retorno rápido para quem veio é onde está a venda.`;
  const rec = g ? recorrencia(A, g) : null;
  if(rec && rec.n>=2) fGar += rec.k>=2 ? ` <b>Isso se repete: aconteceu em ${rec.k} dos seus últimos ${rec.n} meses.</b>` : ` Nos seus últimos ${rec.n} meses isso quase não aconteceu: é um ponto desta semana, não um hábito.`;
  // padrao
  let fPad = '';
  const bandaT = A.banda ? A.faixa(A.banda[0], A.banda[1]) : null;
  if(A.comecaTarde && A.banda && A.banda[0] <= 10) fPad = `Você começa a ligar, em média, às <b>${minHM(A.mediaPrim)}</b>. A faixa <b>${faixaNome(A.banda)} é a que mais te atende (${pc(bandaT.a,bandaT.n)}%)</b>, e o cronograma começa às ${minHM(A.inicioCrono)}.`;
  else if(A.banda && A.topVol.length){
    const tv = A.topVol.reduce((s,h)=>({n:s.n+A.horas[h].n, a:s.a+A.horas[h].a}), {n:0,a:0});
    if(!A.topVol.some(h=>h>=A.banda[0] && h<=A.banda[1]) && bandaT.t - tv.a/tv.n > .05)
      fPad = `<b>${faixaNome(A.banda).replace(/^./,c=>c.toUpperCase())}</b> te atendem <b>${pc(bandaT.a,bandaT.n)}%</b> das vezes. Às ${A.topVol.map(h=>h+'h').join(' e ')}, onde você mais liga, atendem ${pc(tv.a,tv.n)}%.`;
  }
  if(!fPad){
    const ds = Object.keys(A.dow).map(Number).filter(d=>A.dow[d].n>=40);
    const best = ds.sort((a,b)=>A.dow[b].a/A.dow[b].n - A.dow[a].a/A.dow[a].n)[0];
    if(best && A.dow[best].a/A.dow[best].n > A.taxaMedia+.08) fPad = `<b>${DIAS_NOME[best]}</b> é o dia em que mais te atendem (<b>${pc(A.dow[best].a,A.dow[best].n)}%</b>), contra ${pc(A.taxaMedia*100,100)}% na média dos seus dias.`;
  }
  return {titulo, fBem, fGar, fPad};
}
function compromissoAtual(A){ return (state.desemp.comp||[]).find(c=>c.semana===A.semanaCompromisso) || null; }
function compromissoAvaliado(A){
  // compromisso que valia para a semana analisada
  const c = (state.desemp.comp||[]).find(c=>c.semana>=somaDias(A.W.ini,-1) && c.semana<=A.W.fim);
  if(!c) return null;
  const {r, du} = A;
  const res = {
    comparecimento: r.agendamentos ? `vieram ${r.comparecimentos} de ${r.agendamentos} agendados (${pc(r.comparecimentos,r.agendamentos)}%)` : 'sem agendamentos na semana',
    volume: `${(r.ligacoes/du).toFixed(1).replace('.',',')} ligações por dia útil`,
    atendimento: `atenderam ${pc(r.atendidas,r.ligacoes)}% das ligações`,
    agendamento: `${r.agendamentos} agendamentos`,
    fechamento: `${r.vendas} ${r.vendas===1?'venda':'vendas'}`
  }[c.tipo] || '';
  const prim = A.diasW.length && /começar/.test(c.texto) ? ` · 1ª ligação em média às ${minHM(A.diasW.reduce((s,d)=>s+d.prim,0)/A.diasW.length)}` : '';
  return {c, res: res+prim};
}

  if(tarde.length) notaRitmo += ` ${tarde.map(d=>`Na ${DIAS_NOME[dDe(d.k).getDay()].toLowerCase()} (${dataCurta(d.k)}) a 1ª ligação foi às <b>${minHM(d.prim)}</b>`).join('; ')}.`;

  if(comPausa.length) notaRitmo += ` Em ${comPausa.length} ${comPausa.length===1?'dia':'dias'} houve 3 ou mais pausas longas fora do almoço e do café. Vale ver se foi atendimento na loja ou tempo parado.`;
  // dia da semana
  const dws = [1,2,3,4,5].filter(d=>A.dow[d]);
  const melhorDia = dws.filter(d=>A.dow[d].n>=40).sort((a,b)=>A.dow[b].a/A.dow[b].n-A.dow[a].a/A.dow[a].n)[0];
  const menosDia = dws.slice().sort((a,b)=>A.dow[a].n-A.dow[b].n)[0];
  let notaDow = melhorDia ? `<b>${DIAS_NOME[melhorDia]} é o dia em que mais te atendem (${pc(A.dow[melhorDia].a,A.dow[melhorDia].n)}%)</b>` : '';
  if(melhorDia && melhorDia===menosDia) notaDow += `, e é o dia em que você menos liga (${A.dow[melhorDia].n})${melhorDia===1?', também por causa da reunião de marketing':''}.`;
  else if(melhorDia) notaDow += '.';
  // evolucao
  const ev = A.evol, ult = ev[ev.length-1], pen = ev[ev.length-2];
  const maxE = Math.max(1, ...ev.map(e=>e.porDia));
  let notaEvo = '';
  if(ult && pen){
    const varr = Math.round((ult.porDia/pen.porDia-1)*100);
    notaEvo = `Por dia útil, você foi de <b>${pen.porDia.toFixed(1).replace('.',',')} para ${ult.porDia.toFixed(1).replace('.',',')} ligações (${varr>0?'+':''}${varr}%)</b>.`;
    if(ult.d < 5) notaEvo += ` A semana teve ${ult.d} dias úteis, então o total (${pen.lig} → ${ult.lig}) exagera a diferença.`;
    if(ev.length>=4 && ult.porDia === Math.min(...ev.map(e=>e.porDia))) notaEvo += ` É a sua menor média em ${ev.length} semanas.`;
    if(ev.length>=4 && ult.porDia === Math.max(...ev.map(e=>e.porDia))) notaEvo += ` É a sua maior média em ${ev.length} semanas.`;

  // carteira

        ${et.map(e=>`<div class="ds-fl ${e.k && e.k===g ? 'gar' : ''}"><div>${e.n}${e.k && e.k===g ? '<span class="ds-tag">gargalo</span>' : ''}</div>
          <div class="ds-bar"><i style="width:${r.ligacoes ? Math.max(3, e.v/r.ligacoes*100) : 0}%"></i><span>${e.v}</span></div>
          <div class="ds-tx">${e.tx!=null ? `<b>${e.tx}%</b> · ` : ''}${e.ref}${e.sub ? `<br>${e.sub}` : ''}</div></div>`).join('')}
        <div class="nota">${notaFunil}</div></div></div>
      <div class="card"><div class="card-h"><h3>Projeção de ${MESES[Number(todayKey().slice(5,7))-1].toLowerCase()}</h3><span class="hint">até hoje</span></div><div class="card-b">${htmlProjecao(v)}</div></div>
    </div>
    ${htmlMeses(A)}
    <div class="card" style="margin-bottom:16px;"><div class="card-h"><h3>Seus horários</h3><span class="hint">desde ${A.desdeP ? dataCurta(A.desdeP) : '—'} · ${A.nP.toLocaleString('pt-BR')} ligações · altura = suas ligações · % = quanto atenderam</span></div><div class="card-b">
      <div class="ds-horas">${hsG.map(h=>{ const o = A.horas[h], top = A.melhores.includes(h); return `<div class="ds-hc"><div class="ds-ht ${top?'top':''}">${pc(o.a,o.n)}%</div><div class="ds-hv ${top?'top':''}" style="height:${Math.round(o.n/maxV*120)}px"></div><div class="ds-hn">${o.n}</div><div class="ds-hh">${h}h</div></div>`; }).join('')}</div>
      <div class="ds-leg"><span><i style="background:var(--a-gold)"></i>suas melhores horas</span><span><i style="background:#24425E"></i>demais horas</span><span>sua média: ${pc(A.taxaMedia*100,100)}% atendem</span></div>
      <div class="nota">${notaHoras}</div></div></div>
    <div class="grid-2" style="margin-bottom:16px;">
      <div class="card"><div class="card-h"><h3>Ritmo dos dias</h3><span class="hint">cronograma começa às ${minHM(A.inicioCrono)}</span></div><div class="card-b">
        <table class="tbl"><thead><tr><th>Dia</th><th class="r">Ligações</th><th class="r">1ª ligação</th><th class="r">Última</th><th class="r">Pausas longas</th></tr></thead><tbody>
        ${A.diasW.map(d=>`<tr><td>${DIAS_CURTO[dDe(d.k).getDay()]} ${dataCurta(d.k).slice(0,2)}</td><td class="r">${d.n}</td><td class="r" style="${d.prim > A.inicioCrono+15 ? 'color:#F0A3A3;' : ''}">${minHM(d.prim)}</td><td class="r">${minHM(d.ult)}</td><td class="r">${d.pausas}</td></tr>`).join('') || '<tr><td colspan="5" class="mute">Sem ligações nesta semana.</td></tr>'}
        </tbody></table>
        <div class="nota">${notaRitmo} <span class="mute">Pausa longa: 30 minutos ou mais sem ligar, fora do almoço e do café.</span></div></div></div>
      <div class="card"><div class="card-h"><h3>Dia da semana</h3><span class="hint">desde ${A.desdeP ? dataCurta(A.desdeP) : '—'}</span></div><div class="card-b">
        <table class="tbl"><thead><tr><th>Dia</th><th class="r">Ligações</th><th class="r">Atenderam</th></tr></thead><tbody>
        ${dws.map(d=>`<tr><td>${DIAS_NOME[d]}</td><td class="r">${A.dow[d].n}</td><td class="r" style="${d===melhorDia?'color:#5FD39A;font-weight:600;':''}">${pc(A.dow[d].a,A.dow[d].n)}%</td></tr>`).join('')}
        </tbody></table>

    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><h3>Evolução</h3><span class="hint">ligações por dia útil, semana a semana</span></div><div class="card-b">
        <div class="ds-evo">${ev.map((e,i)=>`<div class="${i===ev.length-1?'at':''}"><span>${Math.round(e.porDia)}</span><b style="height:${Math.round(e.porDia/maxE*100)}px"></b>${dataCurta(e.ini)}</div>`).join('')}</div>
        <div class="nota">${notaEvo}</div></div></div>
      <div class="card"><div class="card-h"><h3>Carteira no CRM</h3><span class="hint">Airtable · semana ${dataCurta(W.ini)} a ${dataCurta(W.fim)}</span></div><div class="card-b">
        <div class="ds-cart">${kc('Parados 3+ dias', parados, WA?WA.cards_parados:null, true)}${kc('Sem comentário', W.zero_comentario, WA?WA.zero_comentario:null, true)}${kc('Negócios ativos', W.negocios_ativos, WA?WA.negocios_ativos:null, null)}</div>
        <div class="nota">${parados>=20 ? `Com <b>${parados} leads parados</b>, o retorno de lead antigo é onde está a próxima venda. Meta sugerida para a semana: <b>baixar ${Math.ceil(parados*.1)}</b>, de ${parados} para ${parados-Math.ceil(parados*.1)}.` : parados!=null ? 'Carteira em dia: poucos leads parados.' : ''}</div></div></div>

  return {top, html, bind: ()=>bindDiagnostico(A)};
}

function htmlMeses(A){
  const ms = A.meses;
  if(ms.length < 2) return '';
  const cor = (bom) => bom==null ? '' : (bom ? 'color:#5FD39A;' : 'color:#F0A3A3;');
  const linhas = ms.map(x=>{
    const ligAg = x.ag && x.lig ? x.lig/x.ag : null, compP = x.ag ? x.comp/x.ag : null, atP = x.lig ? x.at/x.lig : null;
    return `<tr><td>${MESES[Number(x.m.slice(5,7))-1]}${x.parcial?' <span class="mute">(até hoje)</span>':''}</td>
      <td class="r">${x.dt ? (x.lig/x.dt).toFixed(0) : '—'}</td>
      <td class="r" style="${atP!=null && x.tAt!=null ? cor(atP >= x.tAt) : ''}">${atP!=null ? pc(x.at,x.lig)+'%' : '—'}</td>
      <td class="r" style="${ligAg!=null && x.tLigAg!=null ? cor(ligAg <= x.tLigAg) : ''}">${ligAg!=null ? Math.round(ligAg) : '—'}</td>
      <td class="r" style="${compP!=null && x.tComp!=null && x.ag>=3 ? cor(compP >= x.tComp) : ''}">${compP!=null ? `${pc(x.comp,x.ag)}% <span class="mute">(${x.comp}/${x.ag})</span>` : '—'}</td>
      <td class="r">${x.vendas}${x.receita ? ` <span class="mute">· R$ ${brlCurto(x.receita)}</span>` : ''}</td></tr>`;
  }).join('');
  // padroes entre os meses
  const notas = [];
  ['comparecimento','volume','atendimento','agendamento','fechamento'].forEach(k=>{
    const r = recorrencia(A, k);
    if(r && r.n>=2 && r.k>=2) notas.push({
      comparecimento:`Comparecimento abaixo do time em <b>${r.k} de ${r.n} meses</b>: confirmar a visita é um hábito a criar, não um ajuste de uma semana.`,
      volume:`Média de ligações por dia abaixo de 26 em <b>${r.k} de ${r.n} meses</b>.`,
      atendimento:`Taxa de atendimento abaixo do time em <b>${r.k} de ${r.n} meses</b>: o horário das ligações pesa nisso.`,
      agendamento:`Precisou de bem mais ligações por agendamento que o time em <b>${r.k} de ${r.n} meses</b>.`,
      fechamento:`Teve visitas e nenhuma venda em <b>${r.k} de ${r.n} meses</b>.`
    }[k]);
  });
  const fortes = [];
  const agBom = ms.filter(x=>x.ag && x.lig && x.tLigAg && x.lig/x.ag <= x.tLigAg).length;
  if(agBom>=2) fortes.push(`Agendou com menos ligações que o time em <b>${agBom} de ${ms.filter(x=>x.ag && x.lig).length} meses</b>: transformar conversa em visita é um ponto forte seu.`);
  const atBom = ms.filter(x=>x.lig>=50 && x.tAt!=null && x.at/x.lig >= x.tAt).length;
  if(atBom>=2) fortes.push(`Atendido acima da média do time em <b>${atBom} de ${ms.filter(x=>x.lig>=50).length} meses</b>.`);
  const melhor = ms.filter(x=>x.receita).sort((a,b)=>b.receita-a.receita)[0];
  if(melhor) fortes.push(`Seu melhor mês em vendas foi <b>${MESES[Number(melhor.m.slice(5,7))-1].toLowerCase()}</b> (R$ ${brlCurto(melhor.receita)}).`);
  return `<div class="card" style="margin-bottom:16px;"><div class="card-h"><h3>Mês a mês</h3><span class="hint">verde = melhor que o time no mês · vermelho = pior</span></div><div class="card-b">
    <div class="scroll-x"><table class="tbl"><thead><tr><th>Mês</th><th class="r" title="ligações por dia trabalhado">Lig./dia</th><th class="r">Atendem</th><th class="r" title="ligações para cada agendamento">Lig./agend.</th><th class="r">Comparec.</th><th class="r">Vendas</th></tr></thead><tbody>${linhas}</tbody></table></div>
    ${notas.length || fortes.length ? `<div class="ds-mes-notas">${fortes.map(t=>`<div class="ds-fr bem"><div class="rt">Padrão forte</div>${t}</div>`).join('')}${notas.map(t=>`<div class="ds-fr at"><div class="rt">Padrão que se repete</div>${t}</div>`).join('')}</div>` : '<div class="nota">Nenhum problema se repetiu de um mês para o outro.</div>'}
  </div></div>`;
}
