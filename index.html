<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FBS Prime · Registro de Ligações</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#0D1B2A;
    --panel:#132A3E;
    --panel-2:#1B3A54;
    --gold:#C9A84C;
    --atendeu:#2F9E64;
    --atendeu-dim:#1F6E46;
    --caixa:#C9793D;
    --caixa-dim:#8F5426;
    --fechar:#8B3A3A;
    --fechar-dim:#652929;
    --text:#F1EDE2;
    --text-dim:#93A2B5;
    --border:#22415C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 32px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin:0 0 2px;
  }
  .eyebrow img{
    height:18px;
    width:auto;
    display:block;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 18px;
    color:var(--text);
  }
  .vendor-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .vendor-name{font-size:16px;font-weight:600;}
  .vendor-date{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .trocar-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
  }
  .trocar-btn:active{background:var(--panel-2);}
  .trocar-btn.active{background:var(--panel-2);color:var(--text);border-color:var(--gold);}

  .tally{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .tally-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 12px;
    text-align:center;
  }
  .tally-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .tally-num{
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:40px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    line-height:1;
    transition:transform .18s ease;
  }
  .tally-num.pulse{transform:scale(1.18);}
  .tally-atendeu{color:var(--atendeu);}
  .tally-caixa{color:var(--caixa);}
  .tally-total{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin:-6px 0 20px;
  }
  .tally-total b{color:var(--text);font-family:ui-monospace,monospace;}

  .call-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:26px 20px;
    font-size:19px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, filter .08s ease;
  }
  .call-btn:active{transform:scale(.97);filter:brightness(.92);}
  .btn-atendeu{background:var(--atendeu);}
  .btn-caixa{background:var(--caixa);}
  .call-btn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:not-allowed;}
  .call-btn .icon{font-size:22px;line-height:1;}

  .undo-row{
    text-align:center;
    margin:2px 0 22px;
    min-height:20px;
  }
  .undo-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  .fechar-btn{
    width:100%;
    border:1px solid var(--fechar);
    background:transparent;
    color:#E8B4B4;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:18px;
  }
  .fechar-btn:active{background:var(--fechar-dim);}
  .fechar-btn:disabled{
    border-color:var(--border);
    color:var(--text-dim);
    cursor:not-allowed;
  }

  .fechado-banner{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
    text-align:center;
  }
  .fechado-banner .t{font-weight:600;color:var(--gold);margin-bottom:4px;}
  .fechado-banner .s{font-size:13px;color:var(--text-dim);}

  .history{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .history-head{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
  }
  .history-head .chev{color:var(--text-dim);transition:transform .15s ease;font-size:12px;}
  .history-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .2s ease;
  }
  .history-list.open{max-height:340px;overflow-y:auto;}
  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-top:1px solid var(--border);
    font-size:13px;
  }
  .history-item .tag{
    padding:2px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
  }
  .tag-atendeu{background:var(--atendeu-dim);color:#B9EFCF;}
  .tag-caixa{background:var(--caixa-dim);color:#F6D3B3;}
  .history-item .time{color:var(--text-dim);}
  .empty-hint{padding:16px;text-align:center;color:var(--text-dim);font-size:13px;}

  .picker-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
  }
  select,input{
    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    margin:12px 0 16px;
  }
  .confirm-btn{
    width:100%;
    background:var(--gold);
    color:#26200E;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---- Metas da semana ---- */
  .metas-card{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:16px;
    padding:16px 16px 6px;
    margin-bottom:18px;
  }
  .metas-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .meta-row{margin-bottom:14px;position:relative;}
  .meta-row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
  }
  .meta-row-label{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600;}
  .meta-row-value{color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .meta-row-value b{color:var(--text);}
  .meta-bar{
    height:10px;
    border-radius:6px;
    background:var(--panel-2);
    overflow:hidden;
  }
  .meta-bar-fill{
    height:100%;
    border-radius:6px;
    transition:width .4s ease;
    background:var(--text-dim);
  }
  .meta-bar-fill.ok{background:var(--atendeu);}
  .meta-bar-fill.mid{background:var(--gold);}
  .meta-bar-fill.low{background:var(--caixa-dim);}
  .meta-icon-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .meta-icon-btn:active{color:var(--gold);}
  .meta-tooltip{
    position:absolute;
    right:0;
    top:22px;
    z-index:5;
    background:#0A1622;
    border:1px solid var(--border);
    color:var(--text);
    font-size:12px;
    line-height:1.4;
    padding:8px 10px;
    border-radius:8px;
    width:200px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .meta-edit-row{
    display:flex;
    gap:6px;
    margin:6px 0 4px;
  }
  .meta-edit-row input{
    margin:0;
    padding:8px 10px;
    font-size:14px;
    flex:1;
  }
  .meta-edit-row button{
    background:var(--gold);
    color:#26200E;
    border:none;
    border-radius:10px;
    padding:0 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---- Popup Agendou / WhatsApp ---- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(4,10,18,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-card{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:18px;
    padding:26px 22px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .modal-card h3{margin:0 0 18px;font-size:18px;color:var(--text);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-btn-sim{background:var(--atendeu);color:#fff;}
  .modal-btn-nao{background:var(--panel-2);color:var(--text);border:1px solid var(--border) !important;}

  /* ---- Celebracao ---- */
  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:60;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:8px;
    height:14px;
    opacity:.9;
    animation:confetti-fall linear forwards;
    border-radius:2px;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(115vh) rotate(540deg); opacity:.3; }
  }
  .meta-row.celebrating .meta-bar{ box-shadow:0 0 0 2px var(--gold); }

  /* ---- Cronograma do dia ---- */
  .crono-card{
    background:var(--panel);
    border:1px solid rgba(201,168,76,.4);
    border-radius:16px;
    padding:13px 16px 10px;
    margin-bottom:16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .crono-card.pausa{border-color:var(--border);}
  .crono-card.fim{border-color:rgba(47,158,100,.45);}
  .crono-card.flash{animation:crono-flash 1.2s ease-in-out 3;}
  @keyframes crono-flash{
    0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}
    50%{box-shadow:0 0 0 3px rgba(201,168,76,.55),0 0 24px rgba(201,168,76,.35);}
  }
  .crono-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .crono-card.pausa .crono-top{color:var(--text-dim);}
  .crono-clock{color:var(--text-dim);letter-spacing:0;font-weight:400;font-variant-numeric:tabular-nums;}
  .crono-main{display:flex;align-items:center;gap:12px;margin:8px 0 11px;}
  .crono-num{
    font-size:38px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.02em;
    color:var(--gold);
    min-width:52px;
    font-variant-numeric:tabular-nums;
  }
  .crono-num.dim{color:var(--text-dim);font-size:30px;}
  .crono-num.ok{color:var(--atendeu);font-size:30px;}
  .crono-title{font-size:15px;font-weight:600;line-height:1.25;}
  .crono-sub{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .crono-sub .alerta{color:var(--caixa);}
  .crono-bar{position:relative;display:flex;gap:2px;height:6px;}
  .crono-seg{border-radius:2px;background:#2A4D6B;}
  .crono-seg.passo.feito{background:rgba(201,168,76,.4);}
  .crono-seg.passo.atual{background:var(--gold);}
  .crono-seg.intervalo{background:#3A4A5A;}
  .crono-seg.cafe{background:repeating-linear-gradient(45deg,#E8D3A3 0 3px,#F1E6CC 3px 6px);}
  .crono-seg.intervalo.feito,.crono-seg.cafe.feito{opacity:.45;}
  .crono-seg.vazio{background:transparent;}
  .crono-agora{
    position:absolute;
    top:-4px;
    width:2px;
    height:14px;
    margin-left:-1px;
    background:var(--text);
    border-radius:1px;
  }
  .crono-ticks{position:relative;height:13px;margin-top:5px;font-size:10px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .crono-ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;}
  .crono-ticks span.first{transform:none;}
  .crono-ticks span.last{transform:translateX(-100%);}
  .crono-more{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .crono-rule-label{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:7px;
  }
  .crono-prioridade{
    background:rgba(201,168,76,.12);
    border:1px solid rgba(201,168,76,.45);
    border-radius:10px;
    padding:8px 10px;
    font-size:12px;
    line-height:1.45;
    margin-bottom:10px;
  }
  .crono-prioridade b{color:var(--gold);}
  .crono-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .crono-chip{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:3px 9px;}
  .crono-chip b{color:var(--gold);}
  .crono-qc{font-size:11px;color:var(--text-dim);margin-top:9px;}
  .crono-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:7px;}
  .crono-toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translate(-50%,-160%);
    transition:transform .35s ease;
    z-index:55;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:12px 16px;
    width:max-content;
    max-width:min(420px,calc(100vw - 32px));
    box-shadow:0 10px 28px rgba(0,0,0,.45);
    font-size:14px;
    cursor:pointer;
  }
  .crono-toast.show{transform:translate(-50%,0);}
  .crono-toast .k{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:2px;
  }
  .crono-edit-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 8px;
    padding:10px 16px;
    border-top:1px solid var(--border);
    font-size:12px;
  }
  .crono-edit-row .nome{flex-basis:100%;font-size:13px;}
  .crono-edit-row .nome b{color:var(--gold);}
  .crono-edit-row input{flex:1;max-width:130px;margin:0;padding:7px 8px;font-size:13px;}

  /* ---- Admin: abas e produção ---- */
  .admin-tabs{display:flex;gap:6px;margin:-6px 0 16px;}
  .admin-tabs button{flex:1;}
  .prod-anos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .prod-anos button{flex:1;min-width:64px;}
  .prod-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;}
  .prod-table th,.prod-table td{padding:7px 6px;text-align:right;border-top:1px solid var(--border);white-space:nowrap;}
  .prod-table th:first-child,.prod-table td:first-child{text-align:left;padding-left:14px;}
  .prod-table th:last-child,.prod-table td:last-child{padding-right:14px;}
  .prod-table thead th{border-top:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700;vertical-align:bottom;}
  .prod-table thead th .coord{display:block;font-size:10px;letter-spacing:0;text-transform:none;color:var(--text-dim);font-weight:400;}
  .prod-table td.vazio{color:var(--text-dim);}
  .prod-table td.auto{color:var(--atendeu);}
  .prod-table td.total,.prod-table th.total{font-weight:700;color:var(--text);}
  .prod-table tr.futuro td{color:#4A6178;}
  .prod-table tfoot td{border-top:2px solid var(--gold);font-weight:700;color:var(--gold);}
  .prod-table input{width:86px;margin:0;padding:5px 6px;font-size:12px;text-align:right;}
  .prod-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 14px 0;}
  .prod-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;}
  .prod-chart .bars{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center;}
  .prod-chart .bar{width:45%;border-radius:3px 3px 0 0;background:var(--gold);min-height:2px;}
  .prod-chart .bar.ant{background:#2A4D6B;}
  .prod-chart-labels{display:flex;gap:4px;padding:4px 14px 12px;font-size:10px;color:var(--text-dim);}
  .prod-chart-labels span{flex:1;text-align:center;}
  .prod-legend{display:flex;gap:14px;padding:0 14px 12px;font-size:11px;color:var(--text-dim);}
  .prod-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  .prod-form{padding:4px 16px 14px;}
  .prod-form label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-top:10px;}
  .prod-form input,.prod-form select{margin:5px 0 0;padding:11px 12px;font-size:15px;}
  .prod-form .linha{display:flex;gap:8px;}
  .prod-form .linha > div{flex:1;min-width:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
  Backend: banco Postgres no Supabase (tabelas e funcoes em supabase/schema.sql),
  acessado direto pela API REST com a chave publica. Cada ligacao e uma linha;
  a combinacao vendedor + horario e unica, entao reenviar nunca duplica.
  "Apagar" item avulso do historico foi removido de proposito: so
  "desfazer ultima ligacao" existe (ver funcao undoLast).
*/
const DEFAULT_VENDOR_LIST = [
  {name:"Arthur Lima", pin:"1098"}, {name:"Wellington Augusto", pin:"1111"},
  {name:"Rayane Castro", pin:"1095"}, {name:"Raissa Gabrielly", pin:"1097"},
  {name:"Nayara Lima", pin:"1096"}, {name:"Diane Ruiz", pin:"1094"},
  {name:"Erick Fernandes", pin:"1099"}, {name:"Camila Abreu", pin:"1264"},
  {name:"Javam Trajano", pin:"1265"}, {name:"Cley Silva", pin:"1268"}
];
const ADMIN_PIN_HASH = "c342fde8dbf5b6617f87b3a8e74fd4ab3d47c54d74c37a8a261a25cfc65fb7a8";

const SUPABASE_URL = "https://cnwqzxrqxjatyqsnkxqx.supabase.co";
// chave "publishable": e publica de proposito (o acesso e controlado pelas policies do banco)
const SUPABASE_KEY = "sb_publishable_A4bCcKHzh2XzmSCh6QXY4A_32aWwLuy";

let VENDORES = [];
let VENDOR_PINS = {};

const sleep = ms => new Promise(r=>setTimeout(r,ms));

// Chamada a API REST do Supabase. Qualquer status fora de 2xx vira erro.
// `retries` refaz a chamada (so usar em leituras ou operacoes que podem repetir sem efeito colateral).
async function sb(path, opts, retries){
  opts = opts || {};
  const tries = 1 + (retries||0);
  let lastErr;
  for(let i=0;i<tries;i++){
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 30000);
    try{
      const headers = {apikey: SUPABASE_KEY};
      if(opts.body !== undefined) headers['Content-Type'] = 'application/json';
      if(opts.prefer) headers.Prefer = opts.prefer;
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        signal: ctrl.signal
      });
      const text = await res.text();
      if(!res.ok) throw new Error(`Erro ao comunicar com o servidor (HTTP ${res.status}) ${text.slice(0,200)}`);
      return text.trim() ? JSON.parse(text) : null;
    }catch(e){
      lastErr = e;
      if(i < tries-1) await sleep(1500*(i+1));
    }finally{
      clearTimeout(timeout);
    }
  }
  throw lastErr;
}
const rpc = (fn, args, retries) => sb('rpc/'+fn, {method:'POST', body: args||{}}, retries);
const eq = v => 'eq.' + encodeURIComponent(v);

// Fila persistente de ligacoes ainda nao confirmadas pelo servidor.
// Se o servidor falhar ou a internet cair, a ligacao fica guardada aqui
// e e reenviada sozinha - nunca some do contador do vendedor.
const QUEUE_KEY = 'fbs_pending_calls';
let flushing = false, flushTimer = null, inflightId = null;
// copia em memoria: se o navegador bloquear o localStorage (aba anonima, cota cheia),
// a fila continua funcionando enquanto a pagina estiver aberta
let memQueue = [], storageOk = true;
function loadQueue(){
  if(storageOk){
    try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ storageOk = false; }
  }
  return memQueue.slice();
}
function saveQueue(q){
  memQueue = q.slice();
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){ storageOk = false; }
}
function pendingCountFor(vendor){
  return loadQueue().filter(x=>x.body.vendedor===vendor).length;
}
function scheduleFlush(ms){
  if(flushTimer) return;
  flushTimer = setTimeout(()=>{ flushTimer = null; flushQueue(); }, ms || 8000);
}
// item da fila (formato guardado no celular do vendedor) -> linha da tabela ligacoes
function linhaLigacao(b){
  return {
    vendedor: b.vendedor,
    tipo: b.tipo,
    ts: b.ts,
    agendou: b.tipo==='atendeu' ? (b.agendou||null) : null,
    chamou_whatsapp: b.tipo==='caixa_postal' ? (b.whatsapp||null) : null
  };
}
async function flushQueue(){
  if(flushing) return;
  flushing = true;
  let failed = false;
  let consecutiveFails = 0;
  try{
    while(true){
      const q0 = loadQueue();
      const item = q0[0];
      if(!item) break;
      inflightId = item.id;
      try{
        await sb('ligacoes?on_conflict=vendedor,ts', {
          method:'POST',
          prefer:'resolution=ignore-duplicates,return=minimal',
          body: linhaLigacao(item.body)
        });
      }catch(e){
        console.error('Falha ao salvar ligação, vai tentar de novo', e);
        failed = true;
        consecutiveFails++;
        // manda a ligacao que falhou pro fim da fila, pra ela nao travar as outras
        saveQueue(loadQueue().filter(x=>x.id!==item.id).concat(item));
        if(consecutiveFails >= loadQueue().length) break;
        continue;
      }
      consecutiveFails = 0;
      saveQueue(loadQueue().filter(x=>x.id!==item.id));
      const e = state.allCalls.find(c=>c.ts===item.body.ts && item.body.vendedor===state.vendor);
      if(e) e.pending = false;
      recomputeAutoProgress();
      render();
    }
  } finally {
    inflightId = null;
    flushing = false;
  }
  if(failed && loadQueue().length){ scheduleFlush(); render(); }
}
// no celular os timers param com a tela bloqueada/app em segundo plano:
// reenvia assim que a internet volta ou o vendedor volta pro app

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){
  return dayKey(new Date());
}
// dia local de um timestamp ISO
function dayOf(iso){
  return dayKey(new Date(iso));
}
function thisMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function thisYearKey(){
  return String(new Date().getFullYear());
}
function todayLabel(){
  return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function timeLabel(iso){
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// Le historico recente do vendedor + status "fechado" do dia + dias pendentes
async function loadVendorData(vendor){
  state.loading = true; state.loadError = false; render();
  try{
    const data = await rpc('dados_vendedor', {p_vendedor: vendor}, 2);
    // o banco devolve "2026-09-26T13:05:00.123+00:00"; normaliza pro mesmo formato do site (toISOString)
    const all = (data.ligacoes || []).map(r=>({type:r.tipo, ts:new Date(r.ts).toISOString(), agendou:r.agendou}));
    // junta ligacoes deste vendedor que ainda estao na fila local (nao confirmadas no servidor)
    const serverTs = new Set(all.map(c=>c.ts));
    const fila = loadQueue().filter(x=>x.body.vendedor===vendor);
    const restantes = fila.filter(x=>!serverTs.has(x.body.ts));
    if(restantes.length !== fila.length){
      saveQueue(loadQueue().filter(x=>x.body.vendedor!==vendor || !serverTs.has(x.body.ts)));
    }
    restantes.forEach(x=>all.push({type:x.body.tipo, ts:x.body.ts, agendou:x.body.agendou, pending:true}));
    state.allCalls = all;
    state.calls = all.filter(c=>dayOf(c.ts)===todayKey());
    state.closed = data.fechado || null;
    state.pendentes = data.pendentes || [];
  }catch(e){
    console.error('Falha ao carregar histórico', e);
    // nao zera o contador: mantem o que ja estava na tela e avisa com um banner
    state.loadError = true;
  }
  state.loading = false;
  render();
  if(pendingCountFor(vendor)) flushQueue();
}

// Registra 1 ligacao: guarda na fila local e envia em segundo plano
async function addCall(type, extra){
  if(state.closed) return;
  const entry = {type, ts:new Date().toISOString(), agendou: extra && extra.agendou, pending:true};
  state.allCalls.push(entry);
  state.calls.push(entry);
  const q = loadQueue();
  q.push({id: state.vendor+'|'+entry.ts, body:{action:'add', vendedor: state.vendor, tipo: type, ts: entry.ts, ...(extra||{})}});
  saveQueue(q);
  render(type==='atendeu' ? 'atendeu' : 'caixa');
  // A ligacao ja esta guardada na fila local; o envio ao servidor (com reenvio
  // automatico se falhar) acontece em segundo plano.
  // Agendamentos/Ligacoes sao recalculados no cliente (state.allCalls), sem buscar as metas de novo.
  recomputeAutoProgress();
  flushQueue();
}

function currentWeekRangeKeys(){
  const now = new Date();
  const day = now.getDay();
  const diff = day===0 ? -6 : 1-day;
  const monday = new Date(now);
  monday.setDate(monday.getDate()+diff);
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate()+6);
  return { inicio: dayKey(monday), fim: dayKey(sunday) };
}

function recomputeAutoProgress(){
  if(!state.metas) return;
  const { inicio, fim } = currentWeekRangeKeys();
  const daSemana = state.allCalls.filter(c=>{
    const d = dayOf(c.ts);
    return d>=inicio && d<=fim;
  });
  state.metas.ligacoes.progresso = daSemana.length;
  state.metas.agendamentos.progresso = daSemana.filter(c=>String(c.agendou).toLowerCase()==='sim').length;
  checkCelebracoes(state.vendor, state.metas);
}

// Dispara confete quando uma meta acabou de bater 100% (uma vez por vendedor+semana+metrica)
function checkCelebracoes(vendor, metas){
  const chaves = ['agendamentos','comparecimentos','vendas','ligacoes'];
  const novasBatidas = [];
  chaves.forEach(k=>{
    const m = metas[k];
    if(!m) return;
    const pct = m.meta>0 ? m.progresso/m.meta : 0;
    const chave = vendor+'|'+metas.semana+'|'+k;
    if(pct>=1 && !state.celebrated.has(chave)){
      state.celebrated.add(chave);
      novasBatidas.push(k);
    }
  });
  if(novasBatidas.length===4){
    launchConfetti(true);
  }else if(novasBatidas.length>0){
    launchConfetti(false);
  }
}

function launchConfetti(mega){
  const cores = ['#C9A84C','#2F9E64','#C9793D','#F1EDE2','#8B3A3A'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  const qtd = mega ? 90 : 28;
  for(let i=0;i<qtd;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = cores[Math.floor(Math.random()*cores.length)];
    const dur = 1.6 + Math.random()*1.4;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*(mega?0.6:0.2))+'s';
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3400);
}

// Desfazer: remove a ultima ligacao desse vendedor (por vendedor+horario)
async function undoLast(){
  if(state.closed || state.calls.length===0) return;
  const removed = state.calls[state.calls.length-1];
  if(removed.pending){
    // ainda nao chegou ao servidor: basta tirar da fila local
    const qid = state.vendor+'|'+removed.ts;
    if(inflightId === qid){
      alert('Essa ligação está sendo enviada agora. Espera um instante e tenta desfazer de novo.');
      return;
    }
    saveQueue(loadQueue().filter(x=>x.id!==qid));
    state.calls.pop();
    const pi = state.allCalls.lastIndexOf(removed);
    if(pi>-1) state.allCalls.splice(pi,1);
    recomputeAutoProgress();
    render();
    return;
  }
  state.calls.pop();
  const idx = state.allCalls.lastIndexOf(removed);
  if(idx>-1) state.allCalls.splice(idx,1);
  render();
  try{
    await sb('ligacoes?vendedor='+eq(state.vendor)+'&ts='+eq(removed.ts), {method:'DELETE'});
  }catch(e){
    console.error('Falha ao desfazer ligação', e);
    // restaura, ja que o servidor nao confirmou a remocao
    state.allCalls.splice(idx>-1?idx:state.allCalls.length, 0, removed);
    state.calls.push(removed);
    alert('Não foi possível desfazer a última ligação no servidor. Tenta de novo.');
    render();
    return;
  }
  recomputeAutoProgress();
  render();
}

// Marca o dia como fechado
async function fecharRelatorio(){
  const atendidas = state.calls.filter(c=>c.type==='atendeu').length;
  const caixa = state.calls.filter(c=>c.type==='caixa_postal').length;
  if(state.calls.length===0){
    alert('Registra pelo menos uma ligação antes de fechar o relatório do dia.');
    return;
  }
  if(state.calls.some(c=>c.pending)){
    alert('Ainda tem ligação sincronizando com o servidor. Espera alguns segundos e fecha o relatório de novo.');
    return;
  }
  if(!confirm(`Fechar o relatório de hoje?\n\nAtendidas: ${atendidas}\nCaixa postal: ${caixa}\nTotal: ${state.calls.length}\n\nDepois de fechado, não dá pra registrar mais ligações hoje (mas dá pra reabrir se precisar).`)) return;
  const closedAt = new Date().toISOString();
  const summary = {closedAt, atendidas, caixaPostal:caixa, total:state.calls.length};
  try{
    await salvarFechamento(todayKey(), atendidas, caixa, state.calls.length, closedAt);
  }catch(e){
    console.error('Falha ao fechar relatorio', e);
    alert('Não foi possível fechar o relatório no servidor. Tenta de novo.');
    return;
  }
  state.closed = summary;
  render();
}

/*
  Cronograma do dia (segunda a sexta). Os horarios ficam numa linha da tabela
  `cronograma` no Supabase, editada pelo painel admin; se ela nao carregar, vale o
  que estiver guardado no celular ou, em ultimo caso, o padrao abaixo (o do PDF).
  O passo atual e calculado pelo relogio, no fuso de Sao Paulo, sem ir ao servidor.
*/
const CRONO_PADRAO = [
  {tipo:'passo',     num:'01', titulo:'Oportunidade e primeiro contato',    inicio:'09:30', fim:'13:00'},
  {tipo:'intervalo',           titulo:'Intervalo',                          inicio:'13:00', fim:'14:30'},
  {tipo:'passo',     num:'02', titulo:'Segundo contato',                    inicio:'14:30', fim:'16:00'},
  {tipo:'cafe',                titulo:'Café e networking',                  inicio:'16:00', fim:'16:30'},
  {tipo:'passo',     num:'03', titulo:'Acompanhamentos e reunião agendada', inicio:'16:30', fim:'18:00'},
  {tipo:'passo',     num:'04', titulo:'Terceiro contato',                   inicio:'18:00', fim:'19:00'}
];
const CRONO_CACHE_KEY = 'fbs_cronograma';
const CRONO_AVISO_MIN = 10; // faltando isso, o "faltam X" fica laranja e lembra do controle de qualidade

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmmMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const minHhmm = m => Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function duracaoLabel(min){
  if(min < 60) return min+' min';
  const r = min%60;
  return Math.floor(min/60)+'h'+(r ? String(r).padStart(2,'0') : '');
}

// Aceita so uma lista de blocos com horarios validos e em ordem; senao devolve null
function validarBlocos(blocos){
  if(!Array.isArray(blocos) || !blocos.length) return null;
  let fimAnterior = -1;
  for(const b of blocos){
    if(!b || !['passo','intervalo','cafe'].includes(b.tipo) || typeof b.titulo!=='string') return null;
    if(!/^\d{2}:\d{2}$/.test(b.inicio||'') || !/^\d{2}:\d{2}$/.test(b.fim||'')) return null;
    const ini = hhmmMin(b.inicio), fim = hhmmMin(b.fim);
    if(ini >= fim || ini < fimAnterior || fim > 24*60) return null;
    fimAnterior = fim;
  }
  return blocos;
}

let cronoBlocos = (()=>{
  try{ return validarBlocos(JSON.parse(localStorage.getItem(CRONO_CACHE_KEY))) || CRONO_PADRAO; }
  catch(e){ return CRONO_PADRAO; }
})();
let cronoCarregadoEm = 0;

async function loadCronograma(){
  cronoCarregadoEm = Date.now();
  try{
    const rows = await sb('cronograma?select=blocos&id=eq.1', undefined, 1);
    const blocos = validarBlocos(rows && rows[0] && rows[0].blocos);
    if(!blocos) return;
    cronoBlocos = blocos;
    try{ localStorage.setItem(CRONO_CACHE_KEY, JSON.stringify(blocos)); }catch(e){}
    atualizarCronoCard();
  }catch(e){
    console.error('Falha ao carregar o cronograma, usando os horários guardados', e);
  }
}

const SP_FMT = new Intl.DateTimeFormat('en-US', {
  timeZone:'America/Sao_Paulo', hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'
});
// Dia da semana (0 = domingo) e minutos desde a meia-noite, no horario de Sao Paulo
function agoraSP(){
  const p = {};
  SP_FMT.formatToParts(new Date()).forEach(x=>{ p[x.type] = x.value; });
  return {
    dow: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),
    min: (Number(p.hour)%24)*60 + Number(p.minute) + Number(p.second)/60
  };
}

// Em que ponto do cronograma estamos agora
function cronoEstado(){
  const {dow, min} = agoraSP();
  const blocos = cronoBlocos;
  const ini = hhmmMin(blocos[0].inicio), fim = hhmmMin(blocos[blocos.length-1].fim);
  const base = {min, ini, fim, relogio: minHhmm(Math.floor(min))};
  const proxPasso = de => blocos.slice(de).find(b=>b.tipo==='passo');
  if(dow===0 || dow===6) return {...base, fase:'fds', min:-1};
  if(min < ini) return {...base, fase:'antes', prox: proxPasso(0)};
  if(min >= fim) return {...base, fase:'fim'};
  const i = blocos.findIndex(b=>min>=hhmmMin(b.inicio) && min<hhmmMin(b.fim));
  if(i < 0){
    const j = blocos.findIndex(b=>hhmmMin(b.inicio) > min);
    return {...base, fase:'livre', i:'livre'+j, prox: proxPasso(j), ateMin: hhmmMin(blocos[j].inicio)};
  }
  const b = blocos[i];
  return {
    ...base,
    fase: b.tipo==='passo' ? 'passo' : 'pausa',
    i, bloco: b,
    restante: Math.ceil(hhmmMin(b.fim) - min),
    prox: proxPasso(i+1)
  };
}

function renderCronoCard(modoAdmin){
  const e = cronoEstado();
  if(e.fase==='fds' && !modoAdmin) return '';
  const blocos = cronoBlocos;
  const prefixo = modoAdmin ? 'Cronograma do time' : 'Cronograma';
  let cls = '', fase = 'agora', num = '', numCls = '', titulo = '', sub = '';

  if(e.fase==='passo'){
    num = e.bloco.num || '';
    titulo = esc(e.bloco.titulo);
    const faixa = e.bloco.inicio.replace(/^0/,'')+' – '+e.bloco.fim.replace(/^0/,'');
    sub = e.restante <= CRONO_AVISO_MIN
      ? `${faixa} · <span class="alerta">faltam ${duracaoLabel(e.restante)} · controle de qualidade</span>`
      : `${faixa} · faltam ${duracaoLabel(e.restante)}`;
  }else if(e.fase==='pausa' || e.fase==='livre'){
    cls = 'pausa'; fase = 'pausa'; numCls = 'dim';
    const ate = e.fase==='pausa' ? hhmmMin(e.bloco.fim) : e.ateMin;
    if(e.fase==='pausa'){
      num = e.bloco.tipo==='cafe' ? '☕' : 'II';
      titulo = esc(e.bloco.titulo);
    }else{
      num = '–';
      titulo = 'Pausa no cronograma';
    }
    sub = e.prox
      ? `Volta às ${minHhmm(ate)} com o Passo ${esc(e.prox.num||'')} · em ${duracaoLabel(Math.ceil(ate - e.min))}`
      : `Volta às ${minHhmm(ate)}`;
  }else if(e.fase==='antes'){
    cls = 'pausa'; fase = 'antes do início'; num = '–'; numCls = 'dim';
    titulo = `Cronograma começa às ${minHhmm(e.ini)}`;
    sub = e.prox ? `Primeiro: Passo ${esc(e.prox.num||'')} · ${esc(e.prox.titulo)}` : '';
  }else if(e.fase==='fim'){
    cls = 'fim'; fase = 'encerrado'; num = '✓'; numCls = 'ok';
    titulo = 'Cronograma do dia concluído';
    sub = modoAdmin ? 'Hora do time fechar o relatório do dia' : 'Não esqueça de fechar o relatório do dia';
  }else{
    cls = 'pausa'; fase = 'fim de semana'; num = '–'; numCls = 'dim';
    titulo = 'Hoje não tem cronograma';
    sub = `Volta na segunda às ${minHhmm(e.ini)}`;
  }
  if(e.fase==='passo' && Date.now() < state.cronoFlashAte) cls += ' flash';

  // barra do dia: cada bloco ocupa a largura proporcional a sua duracao
  const total = e.fim - e.ini;
  let cursor = e.ini, segs = '';
  const marcas = [];
  blocos.forEach(b=>{
    const s = hhmmMin(b.inicio), f = hhmmMin(b.fim);
    if(s > cursor) segs += `<div class="crono-seg vazio" style="flex:${s-cursor};"></div>`;
    const st = f <= e.min ? 'feito' : (s <= e.min ? 'atual' : '');
    segs += `<div class="crono-seg ${b.tipo} ${st}" style="flex:${f-s};"></div>`;
    marcas.push(s);
    cursor = f;
  });
  marcas.push(e.fim);
  const agora = (e.min >= e.ini && e.min < e.fim)
    ? `<div class="crono-agora" style="left:${(e.min-e.ini)/total*100}%;"></div>` : '';
  // rotulos de horario sem encavalar: pula os que ficariam perto demais do anterior
  // (o ultimo e alinhado pela direita, entao precisa de mais folga)
  const pcts = [...new Set(marcas)].map(m=>({m, p:(m-e.ini)/total*100}));
  const visiveis = [];
  pcts.forEach((x,k)=>{
    const ult = visiveis[visiveis.length-1];
    if(ult && x.p - ult.p < (k===pcts.length-1 ? 15 : 9)){
      if(k===pcts.length-1) visiveis[visiveis.length-1] = x; // o horario final sempre aparece
      return;
    }
    visiveis.push(x);
  });
  const ticks = visiveis.map((x,k)=>
    `<span class="${k===0?'first':(k===visiveis.length-1?'last':'')}" style="left:${x.p}%;">${minHhmm(x.m)}</span>`
  ).join('');

  return `
    <div class="crono-card ${cls}" id="cronoCard" role="button" tabindex="0" aria-expanded="${state.cronoOpen}">
      <div class="crono-top">
        <span>${prefixo} · ${fase}</span>
        <span class="crono-clock">${e.relogio}</span>
      </div>
      <div class="crono-main">
        <div class="crono-num ${numCls}">${num}</div>
        <div style="flex:1;min-width:0;">
          <div class="crono-title">${titulo}</div>
          ${sub ? `<div class="crono-sub">${sub}</div>` : ''}
        </div>
      </div>
      <div class="crono-bar">${segs}${agora}</div>
      <div class="crono-ticks">${ticks}</div>
      ${state.cronoOpen ? `
        <div class="crono-more">
          <div class="crono-rule-label">Regra de ouro</div>
          <div class="crono-prioridade"><b>Prioridade máxima:</b> leads em oportunidade em tempo real ou que chegam pela automação. Ligue na hora.</div>
          <div class="crono-rule-label" style="color:var(--text-dim);">Toda tentativa de contato inclui</div>
          <div class="crono-chips">
            <span class="crono-chip"><b>3</b> ligações convencionais</span>
            <span class="crono-chip"><b>1</b> mensagem no WhatsApp</span>
            <span class="crono-chip"><b>1</b> ligação no WhatsApp</span>
            <span class="crono-chip"><b>1</b> áudio</span>
          </div>
          <div class="crono-qc">Ao fim de cada passo, faça o controle de qualidade.</div>
        </div>
      ` : ''}
      <div class="crono-hint">${state.cronoOpen ? 'recolher ▴' : 'toque para ver a regra de ouro ▾'}</div>
    </div>
  `;
}

// Redesenha so o cartao (sem render() geral, pra nao atrapalhar quem esta digitando)
function atualizarCronoCard(){
  if(state.view!=='app' && state.view!=='admin') return;
  const atual = document.getElementById('cronoCard');
  const html = renderCronoCard(state.view==='admin').trim();
  if(!atual && !html) return;
  if(!atual || !html){
    // o cartao apareceu ou sumiu (virada do fim de semana): precisa da tela inteira
    if(!(document.activeElement && document.activeElement.tagName==='INPUT')) render();
    return;
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  atual.replaceWith(tmp.firstElementChild);
}

  let el = document.getElementById('cronoToast');

    el.className = 'crono-toast';
    el.setAttribute('role', 'status');
    el.onclick = ()=>el.classList.remove('show');
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="k">${kicker}</div><div>${texto}</div>`;
  requestAnimationFrame(()=>el.classList.add('show'));

}

// A cada poucos segundos: atualiza relogio/barra e avisa quando muda o passo
let cronoUltimaChave = null;
function cronoTick(){
  if(Date.now() - cronoCarregadoEm > 15*60*1000) loadCronograma();
  const e = cronoEstado();
  const chave = e.fase + '|' + (e.i ?? '');
  const mudou = cronoUltimaChave !== null && chave !== cronoUltimaChave;
  cronoUltimaChave = chave;
  const naTela = state.view==='app' || state.view==='admin';
  if(mudou && naTela && !(e.fase==='fds' && state.view==='app')){
    if(e.fase==='passo'){
      state.cronoFlashAte = Date.now() + 3700;
      showCronoToast('Começou agora', `Passo ${esc(e.bloco.num||'')} · ${esc(e.bloco.titulo)}`);
    }else if(e.fase==='pausa'){
      showCronoToast('Pausa', `${esc(e.bloco.titulo)} · volta às ${e.bloco.fim.replace(/^0/,'')}`);
    }else if(e.fase==='fim'){
      showCronoToast('Cronograma concluído', state.view==='admin' ? 'Hora do time fechar o relatório do dia' : 'Não esqueça de fechar o relatório do dia');
    }
  }
  atualizarCronoCard();
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cronoTick(); });

      ? 'A tabela do cronograma ainda não foi criada no Supabase. Roda o trecho do cronograma do supabase/schema.sql e tenta de novo.'

/*
  Producao do time (aba "Producao" do admin). Cada mes de cada equipe vale o
  numero fechado em `producao_mensal` (historico das planilhas ou correcao manual);
  se nao tem, vale a soma das vendas registradas no site naquele mes.
*/
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CANAIS_VENDA = ['Lead - Trafego Pago','Facebook','TikTok','Indicação','Outro'];
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
function brlCurto(v){
  if(v >= 1e6) return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(v >= 1e3) return Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
  return Math.round(v).toLocaleString('pt-BR');
}
// "1.517.156,10" / "400000" / "R$ 400.000" -> numero (ponto e separador de milhar)
function parseBRL(s){
  s = String(s||'').replace(/R\$|\s/g,'');
  if(!s) return null;
  s = s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s.replace(/\./g,'');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

async function loadProducao(){
  try{
    const [equipes, manual, vendas] = await Promise.all([
      sb('equipes?select=nome,coordenadores,ativa,ordem&order=ordem,nome', undefined, 1),
      sb('producao_mensal?select=ano,mes,equipe,valor', undefined, 1),
      sb('vendas?select=id,vendedor,equipe,data,valor,cliente,canal&order=data.desc,id.desc', undefined, 1)
    ]);
    state.prod = {
      equipes: equipes || [],
      manual: (manual || []).map(r=>({...r, valor:Number(r.valor)})),
      vendas: (vendas || []).map(r=>({...r, valor:Number(r.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar a produção', e);
    if(!state.prod) state.prod = {erro:true};
  }
  if(state.view==='admin') render();
}

// Valor de uma equipe num mes: {valor, fonte:'manual'|'vendas'} ou null se nao tem nada
function prodCelula(ano, mes, equipe){
  const p = state.prod;
  const m = p.manual.find(r=>r.ano===ano && r.mes===mes && r.equipe===equipe);
  if(m) return {valor:m.valor, fonte:'manual'};
  const chave = ano+'-'+String(mes).padStart(2,'0');
  const vs = p.vendas.filter(v=>v.equipe===equipe && v.data.slice(0,7)===chave);
  return vs.length ? {valor: vs.reduce((s,v)=>s+v.valor,0), fonte:'vendas'} : null;
}
function prodAnos(){
  const p = state.prod, atual = new Date().getFullYear();
  const anos = new Set([atual, ...p.manual.map(r=>r.ano), ...p.vendas.map(v=>Number(v.data.slice(0,4)))]);
  return [...anos].sort((a,b)=>a-b);
}
// Equipes que aparecem no ano: as que produziram nele, mais as ativas no ano atual
function prodEquipesDoAno(ano){
  const atual = new Date().getFullYear();
  return state.prod.equipes.filter(eq=>
    (eq.ativa && ano >= atual) || MESES.some((_,i)=>prodCelula(ano, i+1, eq.nome))
  );
}
function prodTotalMes(ano, mes){
  let tem = false, soma = 0;
  state.prod.equipes.forEach(eq=>{ const c = prodCelula(ano, mes, eq.nome); if(c){ tem = true; soma += c.valor; } });
  return tem ? soma : null;
}

function renderProducao(){
  const p = state.prod;
  if(!p) return `<div class="empty-hint">Carregando produção...</div>`;
  if(p.erro) return `<div class="fechado-banner" style="border-color:var(--caixa);"><div class="t" style="color:var(--caixa);">Não consegui carregar a produção</div><button class="undo-btn" id="prodRetryBtn" style="margin-top:8px;color:var(--caixa);">tentar de novo</button></div>`;

  const ano = state.prodAno, hoje = new Date();
  const anoAtual = hoje.getFullYear(), mesAtual = hoje.getMonth()+1;
  const equipes = prodEquipesDoAno(ano);
  const totais = MESES.map((_,i)=>prodTotalMes(ano, i+1));
  const totaisAnt = MESES.map((_,i)=>prodTotalMes(ano-1, i+1));
  const totalAno = totais.reduce((s,v)=>s+(v||0),0);
  // comparacao justa: mesmos meses do ano anterior que ja tem valor neste ano
  const mesesComValor = totais.map((v,i)=>v!==null ? i : -1).filter(i=>i>=0);
  const totalAntMesmo = mesesComValor.reduce((s,i)=>s+(totaisAnt[i]||0),0);
  const temAnt = mesesComValor.some(i=>totaisAnt[i]!==null);
  const variacao = temAnt && totalAntMesmo>0 ? (totalAno/totalAntMesmo - 1)*100 : null;
  const melhorMes = totais.reduce((b,v,i)=>(v!==null && (b<0 || v>totais[b])) ? i : b, -1);
  const maxBar = Math.max(1, ...totais.map(v=>v||0), ...totaisAnt.map(v=>v||0));
  const anos = prodAnos();
  const vendasAno = p.vendas.filter(v=>v.data.slice(0,4)===String(ano));
  const ativas = p.equipes.filter(e=>e.ativa);

  return `
    <div class="prod-anos">
      ${anos.map(a=>`<button class="trocar-btn ${a===ano?'active':''}" data-prod-ano="${a}">${a}</button>`).join('')}
    </div>

    <div class="tally" style="grid-template-columns:1fr 1fr;">
      <div class="tally-card">
        <div class="tally-label">Produção ${ano}</div>
        <div class="tally-num" style="font-size:22px;color:var(--gold);">${brlCurto(totalAno)}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:6px;">${BRL.format(totalAno)}</div>
      </div>
      <div class="tally-card">
        <div class="tally-label">vs ${ano-1}</div>
        <div class="tally-num" style="font-size:22px;color:${variacao===null?'var(--text-dim)':(variacao>=0?'var(--atendeu)':'#E8B4B4')};">${variacao===null?'—':(variacao>=0?'+':'')+Math.round(variacao)+'%'}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:6px;">${variacao===null?'sem dados para comparar':'mesmos meses de '+(ano-1)}</div>
      </div>
    </div>
    ${melhorMes>=0 ? `<div class="tally-total" style="margin-top:-8px;">Melhor mês: <b>${MESES[melhorMes]}</b> · ${BRL.format(totais[melhorMes])}</div>` : ''}

    <div class="history" style="margin-bottom:16px;">
      <div class="history-head" style="cursor:default;">
        <span>Produção mês a mês</span>
        <button class="undo-btn" id="prodEditBtn" style="font-size:12px;">${state.prodEdit?'concluir edição':'editar valores'}</button>
      </div>
      ${state.prodEdit ? `<div style="padding:0 14px 10px;font-size:11px;color:var(--text-dim);">Digite o valor fechado do mês em reais. Deixe em branco para usar a soma das vendas registradas no site.</div>` : ''}
      <div style="overflow-x:auto;">
        <table class="prod-table">
          <thead><tr>
            <th>Mês</th>
            ${equipes.map(eq=>`<th>${esc(eq.nome)}${(eq.coordenadores||{})[ano] ? `<span class="coord">${esc(eq.coordenadores[ano])}</span>` : ''}</th>`).join('')}
            <th class="total">Total FBS</th>
          </tr></thead>
          <tbody>
            ${MESES.map((nome,i)=>{
              const futuro = ano > anoAtual || (ano===anoAtual && i+1 > mesAtual);
              return `<tr class="${futuro && totais[i]===null ? 'futuro' : ''}">
                <td>${nome}</td>
                ${equipes.map(eq=>{
                  const c = prodCelula(ano, i+1, eq.nome);
                  if(state.prodEdit){
                    const man = p.manual.find(r=>r.ano===ano && r.mes===i+1 && r.equipe===eq.nome);
                    return `<td><input class="prod-cell" inputmode="decimal" data-mes="${i+1}" data-equipe="${esc(eq.nome)}" value="${man ? man.valor.toLocaleString('pt-BR') : ''}" placeholder="${c && c.fonte==='vendas' ? brlCurto(c.valor) : '—'}"></td>`;
                  }
                  return c ? `<td class="${c.fonte==='vendas'?'auto':''}" title="${BRL.format(c.valor)}">${brlCurto(c.valor)}</td>` : `<td class="vazio">—</td>`;
                }).join('')}
                <td class="total">${totais[i]===null ? '<span style="color:var(--text-dim);font-weight:400;">—</span>' : brlCurto(totais[i])}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td>Total</td>
            ${equipes.map(eq=>{
              const s = MESES.reduce((acc,_,i)=>{ const c = prodCelula(ano, i+1, eq.nome); return acc + (c ? c.valor : 0); }, 0);
              return `<td title="${BRL.format(s)}">${s ? brlCurto(s) : '—'}</td>`;
            }).join('')}
            <td>${brlCurto(totalAno)}</td>
          </tr></tfoot>
        </table>
      </div>
      <div class="prod-legend" style="padding-top:10px;">
        <span><i style="background:var(--text);"></i>fechado</span>
        <span><i style="background:var(--atendeu);"></i>soma das vendas do site</span>
      </div>
    </div>

    <div class="history" style="margin-bottom:16px;">
      <div class="history-head" style="cursor:default;"><span>Total FBS por mês</span></div>
      <div class="prod-chart">
        ${MESES.map((_,i)=>`
          <div class="col" title="${MESES[i]}: ${totais[i]===null?'—':BRL.format(totais[i])}${totaisAnt[i]!==null?' · '+(ano-1)+': '+BRL.format(totaisAnt[i]):''}">
            <div class="bars">
              <div class="bar ant" style="height:${(totaisAnt[i]||0)/maxBar*100}%;${totaisAnt[i]===null?'visibility:hidden;':''}"></div>
              <div class="bar" style="height:${(totais[i]||0)/maxBar*100}%;${totais[i]===null?'visibility:hidden;':''}"></div>
            </div>
          </div>`).join('')}
      </div>
      <div class="prod-chart-labels">${MESES.map(m=>`<span>${m.slice(0,1)}</span>`).join('')}</div>
      <div class="prod-legend">
        <span><i style="background:#2A4D6B;"></i>${ano-1}</span>
        <span><i style="background:var(--gold);"></i>${ano}</span>
      </div>
    </div>

    <div class="history" style="margin-bottom:16px;">
      <div class="history-head" style="cursor:default;"><span>Registrar venda</span></div>
      <div class="prod-form">
        <label for="vendaVendedor">Vendedor</label>
        <select id="vendaVendedor">
          <option value="" disabled selected>Escolha o vendedor</option>
          ${VENDORES.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
        </select>
        <div class="linha">
          <div>
            <label for="vendaValor">Valor (R$)</label>
            <input id="vendaValor" inputmode="decimal" placeholder="400.000">
          </div>
          <div>
            <label for="vendaData">Data</label>
            <input id="vendaData" type="date" value="${todayKey()}">
          </div>
        </div>
        <label for="vendaCliente">Cliente</label>
        <input id="vendaCliente" placeholder="Nome do cliente">
        <div class="linha">
          <div>
            <label for="vendaCanal">Canal</label>
            <select id="vendaCanal">
              <option value="">—</option>
              ${CANAIS_VENDA.map(c=>`<option>${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <label for="vendaEquipe">Equipe</label>
            <select id="vendaEquipe">
              ${ativas.map(e=>`<option>${esc(e.nome)}</option>`).join('') || '<option value="">(cadastre uma equipe)</option>'}
            </select>
          </div>
        </div>
        <button class="confirm-btn" id="vendaSalvarBtn" style="margin-top:14px;">Registrar venda</button>
        <div style="font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center;">A venda entra na produção do mês e é copiada para o Airtable.</div>
      </div>

    <div class="history" style="margin-bottom:16px;">
      <div class="history-head" style="cursor:default;"><span>Vendas registradas em ${ano} (${vendasAno.length})</span></div>
      ${vendasAno.length ? vendasAno.map(v=>`
        <div class="history-item">
          <span style="min-width:0;">

      </div>

        ${p.equipes.map(eq=>`

function bindProducao(app){
  const retry = document.getElementById('prodRetryBtn');
  if(retry) retry.onclick = ()=>{ state.prod = null; render(); loadProducao(); };
  if(!state.prod || state.prod.erro) return;
  app.querySelectorAll('[data-prod-ano]').forEach(b=>{
    b.onclick = ()=>{ state.prodAno = Number(b.getAttribute('data-prod-ano')); render(); };
  });
  document.getElementById('prodEditBtn').onclick = ()=>{ state.prodEdit = !state.prodEdit; render(); };
  app.querySelectorAll('.prod-cell').forEach(inp=>{
    inp.onchange = ()=>salvarProducaoMes(Number(inp.getAttribute('data-mes')), inp.getAttribute('data-equipe'), inp.value);
  });
  document.getElementById('vendaSalvarBtn').onclick = registrarVenda;
  // a equipe padrao da venda e a do vendedor na ultima venda dele (ou a primeira ativa)
  const selV = document.getElementById('vendaVendedor'), selE = document.getElementById('vendaEquipe');
  selV.onchange = ()=>{
    const ult = state.prod.vendas.find(v=>v.vendedor===selV.value && v.equipe);
    if(ult && [...selE.options].some(o=>o.value===ult.equipe)) selE.value = ult.equipe;
  };
  app.querySelectorAll('[data-venda-del]').forEach(b=>{ b.onclick = ()=>removerVenda(Number(b.getAttribute('data-venda-del'))); });
  document.getElementById('prodEquipesHead').onclick = ()=>{ state.prodEquipesOpen = !state.prodEquipesOpen; render(); };
  app.querySelectorAll('[data-equipe-coord]').forEach(b=>{ b.onclick = ()=>editarCoordenador(b.getAttribute('data-equipe-coord')); });
  app.querySelectorAll('[data-equipe-ativa]').forEach(b=>{ b.onclick = ()=>alternarEquipe(b.getAttribute('data-equipe-ativa')); });
  const nova = document.getElementById('novaEquipeBtn');
  if(nova) nova.onclick = adicionarEquipe;
}

async function salvarProducaoMes(mes, equipe, texto){
  const ano = state.prodAno;
  const valor = parseBRL(texto);
  if(Number.isNaN(valor) || (valor !== null && valor < 0)){ alert('Digita um valor válido, por exemplo 1.517.156,10'); render(); return; }
  try{
    if(valor === null){
      await sb(`producao_mensal?ano=eq.${ano}&mes=eq.${mes}&equipe=${eq(equipe)}`, {method:'DELETE'});
    }else{
      await sb('producao_mensal?on_conflict=ano,mes,equipe', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ano, mes, equipe, valor}
      });
    }
  }catch(e){
    console.error('Falha ao salvar produção do mês', e);
    alert('Não foi possível salvar esse valor. Verifica sua conexão e tenta de novo.');
  }
  await loadProducao();
}

async function registrarVenda(){
  const vendedor = document.getElementById('vendaVendedor').value;
  const valor = parseBRL(document.getElementById('vendaValor').value);
  const data = document.getElementById('vendaData').value;
  const cliente = document.getElementById('vendaCliente').value.trim();
  const canal = document.getElementById('vendaCanal').value;
  const equipe = document.getElementById('vendaEquipe').value;
  if(!vendedor){ alert('Escolhe o vendedor.'); return; }
  if(!valor || valor <= 0){ alert('Digita o valor da venda, por exemplo 400.000'); return; }
  if(!data){ alert('Escolhe a data da venda.'); return; }
  if(!equipe){ alert('Cadastre uma equipe ativa antes de registrar vendas.'); return; }
  if(!confirm(`Registrar venda?\n\n${vendedor} · ${BRL.format(valor)}\n${new Date(data+'T12:00:00').toLocaleDateString('pt-BR')}${cliente?' · '+cliente:''}\nEquipe ${equipe}`)) return;
  const btn = document.getElementById('vendaSalvarBtn');
  btn.disabled = true; btn.textContent = 'Registrando...';
  try{
    // sem reenvio automatico: repetir poderia duplicar a venda
    await sb('vendas', {method:'POST', prefer:'return=minimal', body:{vendedor, valor, data, cliente: cliente||null, canal: canal||null, equipe}});
  }catch(e){
    console.error('Falha ao registrar venda', e);
    alert('Não foi possível registrar a venda. Verifica sua conexão e tenta de novo.');
    btn.disabled = false; btn.textContent = 'Registrar venda';
    return;
  }
  state.prodAno = Number(data.slice(0,4));
  await loadProducao();
  launchConfetti(false);
  showCronoToast('Venda registrada', `${esc(vendedor)} · ${BRL.format(valor)}`);
}

async function removerVenda(id){
  const v = state.prod.vendas.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Remover a venda de ${v.vendedor} (${BRL.format(v.valor)}, ${new Date(v.data+'T12:00:00').toLocaleDateString('pt-BR')})?\n\nA cópia que já foi para o Airtable não é apagada: ajuste lá também.`)) return;
  try{
    await sb('vendas?id=eq.'+id, {method:'DELETE'});
  }catch(e){
    console.error('Falha ao remover venda', e);
    alert('Não foi possível remover a venda. Tenta de novo.');
    return;
  }
  await loadProducao();
}

async function adicionarEquipe(){
  const nome = document.getElementById('novaEquipeNome').value.trim();
  const coord = document.getElementById('novaEquipeCoord').value.trim();
  if(!nome){ alert('Digita o nome da equipe.'); return; }
  if(state.prod.equipes.some(e=>e.nome.toLowerCase()===nome.toLowerCase())){ alert('Já existe uma equipe com esse nome.'); return; }
  const ordem = Math.max(0, ...state.prod.equipes.map(e=>e.ordem||0)) + 1;
  const coordenadores = coord ? {[new Date().getFullYear()]: coord} : {};
  try{
    await sb('equipes', {method:'POST', prefer:'return=minimal', body:{nome, coordenadores, ativa:true, ordem}});
  }catch(e){
    console.error('Falha ao adicionar equipe', e);
    alert('Não foi possível adicionar a equipe. Tenta de novo.');
    return;
  }
  await loadProducao();
}

async function editarCoordenador(nome){
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  const ano = state.prodAno;
  const atual = (eqp.coordenadores||{})[ano] || '';
  const novo = prompt(`Coordenador da ${nome} em ${ano} (deixe vazio para tirar):`, atual);
  if(novo === null) return;
  const coordenadores = {...(eqp.coordenadores||{})};
  if(novo.trim()) coordenadores[ano] = novo.trim(); else delete coordenadores[ano];
  try{
    await sb('equipes?nome='+eq(nome), {method:'PATCH', prefer:'return=minimal', body:{coordenadores}});
  }catch(e){
    console.error('Falha ao salvar coordenador', e);
    alert('Não foi possível salvar o coordenador. Tenta de novo.');
    return;
  }
  await loadProducao();
}

async function alternarEquipe(nome){
  const eqp = state.prod.equipes.find(e=>e.nome===nome);
  const msg = eqp.ativa
    ? `Encerrar a equipe ${nome}? O histórico dela continua guardado; ela só deixa de aparecer para novas vendas.`
    : `Reativar a equipe ${nome}?`;
  if(!confirm(msg)) return;
  try{
    await sb('equipes?nome='+eq(nome), {method:'PATCH', prefer:'return=minimal', body:{ativa: !eqp.ativa}});
  }catch(e){
    console.error('Falha ao alterar equipe', e);
    alert('Não foi possível alterar a equipe. Tenta de novo.');
    return;
  }
  await loadProducao();
}

    {key:'agendamentos', label:'Agendamentos', unidade:'agendamentos'},

        const d = m[r.key] || {meta:1, progresso:0};

        return `

          </div>
          <div class="meta-bar"><div class="meta-bar-fill ${metaBarClass(ratio)}" style="width:${pct*100}%;"></div></div>
          ${r.editable ? `<div class="meta-tooltip" id="vendasTooltip" style="display:none;">Registre aqui se você fechou uma venda essa semana.</div>` : ''}
          ${(r.editable && state.vendasEditOpen) ? `

              <button id="vendasSaveBtn" type="button">Salvar</button>

      }).join('')}
