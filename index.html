<body>
<div id="app"></div>

<script>
/*
  Backend: banco Postgres no Supabase (tabelas e funcoes em supabase/schema.sql),
  acessado direto pela API REST com a chave publica. Cada ligacao e uma linha;
  a combinacao vendedor + horario e unica, entao reenviar nunca duplica.
  "Apagar" item avulso do historico foi removido de proposito: so
  "desfazer ultima ligacao" existe (ver funcao undoLast).
*/
const DEFAULT_VENDOR_LIST = [
  {name:"Arthur Lima", pin:"1098"}, {name:"Wellington Augusto", pin:"1111"},
  {name:"Rayane Castro", pin:"1095"}, {name:"Raissa Gabrielly", pin:"1097"},
  {name:"Nayara Lima", pin:"1096"}, {name:"Diane Ruiz", pin:"1094"},
  {name:"Erick Fernandes", pin:"1099"}, {name:"Camila Abreu", pin:"1264"},
  {name:"Javam Trajano", pin:"1265"}, {name:"Cley Silva", pin:"1268"}
];
const ADMIN_PIN_HASH = "c342fde8dbf5b6617f87b3a8e74fd4ab3d47c54d74c37a8a261a25cfc65fb7a8";

const SUPABASE_URL = "https://cnwqzxrqxjatyqsnkxqx.supabase.co";
// chave "publishable": e publica de proposito (o acesso e controlado pelas policies do banco)
const SUPABASE_KEY = "sb_publishable_A4bCcKHzh2XzmSCh6QXY4A_32aWwLuy";

let VENDORES = [];
let VENDOR_PINS = {};

const sleep = ms => new Promise(r=>setTimeout(r,ms));

// Chamada a API REST do Supabase. Qualquer status fora de 2xx vira erro.
// `retries` refaz a chamada (so usar em leituras ou operacoes que podem repetir sem efeito colateral).
async function sb(path, opts, retries){
  opts = opts || {};
  const tries = 1 + (retries||0);
  let lastErr;
  for(let i=0;i<tries;i++){
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 30000);
    try{
      const headers = {apikey: SUPABASE_KEY};
      if(opts.body !== undefined) headers['Content-Type'] = 'application/json';
      if(opts.prefer) headers.Prefer = opts.prefer;
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        signal: ctrl.signal
      });
      const text = await res.text();
      if(!res.ok) throw new Error(`Erro ao comunicar com o servidor (HTTP ${res.status}) ${text.slice(0,200)}`);
      return text.trim() ? JSON.parse(text) : null;
    }catch(e){
      lastErr = e;
      if(i < tries-1) await sleep(1500*(i+1));
    }finally{
      clearTimeout(timeout);
    }
  }
  throw lastErr;
}
const rpc = (fn, args, retries) => sb('rpc/'+fn, {method:'POST', body: args||{}}, retries);
const eq = v => 'eq.' + encodeURIComponent(v);

// Fila persistente de ligacoes ainda nao confirmadas pelo servidor.
// Se o servidor falhar ou a internet cair, a ligacao fica guardada aqui
// e e reenviada sozinha - nunca some do contador do vendedor.
const QUEUE_KEY = 'fbs_pending_calls';
let flushing = false, flushTimer = null, inflightId = null;
// copia em memoria: se o navegador bloquear o localStorage (aba anonima, cota cheia),
// a fila continua funcionando enquanto a pagina estiver aberta
let memQueue = [], storageOk = true;
function loadQueue(){
  if(storageOk){
    try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ storageOk = false; }
  }
  return memQueue.slice();
}
function saveQueue(q){
  memQueue = q.slice();
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){ storageOk = false; }
}
function pendingCountFor(vendor){
  return loadQueue().filter(x=>x.body.vendedor===vendor).length;
}
function scheduleFlush(ms){
  if(flushTimer) return;
  flushTimer = setTimeout(()=>{ flushTimer = null; flushQueue(); }, ms || 8000);
}
// item da fila (formato guardado no celular do vendedor) -> linha da tabela ligacoes
function linhaLigacao(b){
  return {
    vendedor: b.vendedor,
    tipo: b.tipo,
    ts: b.ts,
    agendou: b.tipo==='atendeu' ? (b.agendou||null) : null,
    chamou_whatsapp: b.tipo==='caixa_postal' ? (b.whatsapp||null) : null
  };
}
async function flushQueue(){
  if(flushing) return;
  flushing = true;
  let failed = false;
  let consecutiveFails = 0;
  try{
    while(true){
      const q0 = loadQueue();
      const item = q0[0];
      if(!item) break;
      inflightId = item.id;
      try{
        await sb('ligacoes?on_conflict=vendedor,ts', {
          method:'POST',
          prefer:'resolution=ignore-duplicates,return=minimal',
          body: linhaLigacao(item.body)
        });
      }catch(e){
        console.error('Falha ao salvar ligação, vai tentar de novo', e);
        failed = true;
        consecutiveFails++;
        // manda a ligacao que falhou pro fim da fila, pra ela nao travar as outras
        saveQueue(loadQueue().filter(x=>x.id!==item.id).concat(item));
        if(consecutiveFails >= loadQueue().length) break;
        continue;
      }
      consecutiveFails = 0;
      saveQueue(loadQueue().filter(x=>x.id!==item.id));
      const e = state.allCalls.find(c=>c.ts===item.body.ts && item.body.vendedor===state.vendor);
      if(e) e.pending = false;
      recomputeAutoProgress();
      render();
    }
  } finally {
    inflightId = null;
    flushing = false;
  }
  if(failed && loadQueue().length){ scheduleFlush(); render(); }
}
// no celular os timers param com a tela bloqueada/app em segundo plano:
// reenvia assim que a internet volta ou o vendedor volta pro app
window.addEventListener('online', ()=>flushQueue());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && loadQueue().length) flushQueue(); });

const SESSION_KEY = 'fbs_session';
function saveSession(session){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){
  return dayKey(new Date());
}
// dia local de um timestamp ISO
function dayOf(iso){
  return dayKey(new Date(iso));
}
function thisMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function thisYearKey(){
  return String(new Date().getFullYear());
}
function todayLabel(){
  return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function timeLabel(iso){
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function applyVendorList(list){
  VENDORES = list.map(v=>v.name);
  VENDOR_PINS = {};
  list.forEach(v=>{ VENDOR_PINS[v.name] = v.pin; });
}

// Le a lista de vendedores/PINs do banco
async function loadVendorList(){
  try{
    const rows = await sb('vendedores?select=nome,pin&order=criado_em,nome', undefined, 2);
    const list = (rows||[]).map(r=>({name:r.nome, pin:r.pin}));
    if(list.length){ applyVendorList(list); return; }
    applyVendorList(DEFAULT_VENDOR_LIST);
  }catch(e){
    console.error('Falha ao carregar vendedores', e);
    alert('Não foi possível carregar a lista de vendedores. Verifica sua conexão e tenta de novo.');
    applyVendorList(DEFAULT_VENDOR_LIST);
  }
}

// Adiciona/remove 1 vendedor por vez
async function addVendor(){
  const nameInput = document.getElementById('newVendorName');
  const pinInput = document.getElementById('newVendorPin');
  const name = nameInput.value.trim();
  const pin = pinInput.value.trim();
  if(!name || !pin){ alert('Preenche o nome e o PIN antes de adicionar.'); return; }
  if(VENDORES.includes(name)){ alert('Já existe um vendedor com esse nome.'); return; }
  try{
    await sb('vendedores', {method:'POST', prefer:'return=minimal', body:{nome:name, pin}});
  }catch(e){
    console.error('Falha ao adicionar vendedor', e);
    alert('Não foi possível adicionar o vendedor. Tenta de novo.');
    return;
  }
  await loadVendorList();
  if(state.adminRows) await loadAdminData();
  else render();
}

async function removeVendor(name){
  if(!confirm(`Remover ${name} da lista? Os dados já registrados por ele continuam salvos, só não aparece mais no seletor.`)) return;
  try{
    await sb('vendedores?nome='+eq(name), {method:'DELETE'});
  }catch(e){
    console.error('Falha ao remover vendedor', e);
    alert('Não foi possível remover o vendedor. Tenta de novo.');
    return;
  }
  await loadVendorList();
  await loadAdminData();
}

let state = {
  view: 'loading',
  vendor: null,
  pendingVendor: null,
  vendorPinError: false,
  calls: [],
  allCalls: [],
  closed: null,
  pendentes: [],
  historyOpen: false,
  loading: false,
  loadError: false,
  periodType: 'dia',
  periodValue: todayKey(),
  adminRows: null,
  pinError: false,
  metas: null,
  metasLoading: false,
  callModal: null,       // 'agendou' | 'whatsapp' | null
  pendingCallType: null,
  vendasEditOpen: false,
  celebrated: new Set(), // chaves "vendedor|semana|metrica" ja celebradas nesta sessao
  adminMetas: null,      // { [vendedor]: metasObj } no painel admin
  adminMetasEdit: {}     // { [vendedor]: {campo:valor} } rascunho dos inputs do admin
};

// Le historico recente do vendedor + status "fechado" do dia + dias pendentes
async function loadVendorData(vendor){
  state.loading = true; state.loadError = false; render();
  try{
    const data = await rpc('dados_vendedor', {p_vendedor: vendor}, 2);
    // o banco devolve "2026-09-26T13:05:00.123+00:00"; normaliza pro mesmo formato do site (toISOString)
    const all = (data.ligacoes || []).map(r=>({type:r.tipo, ts:new Date(r.ts).toISOString(), agendou:r.agendou}));
    // junta ligacoes deste vendedor que ainda estao na fila local (nao confirmadas no servidor)
    const serverTs = new Set(all.map(c=>c.ts));
    const fila = loadQueue().filter(x=>x.body.vendedor===vendor);
    const restantes = fila.filter(x=>!serverTs.has(x.body.ts));
    if(restantes.length !== fila.length){
      saveQueue(loadQueue().filter(x=>x.body.vendedor!==vendor || !serverTs.has(x.body.ts)));
    }
    restantes.forEach(x=>all.push({type:x.body.tipo, ts:x.body.ts, agendou:x.body.agendou, pending:true}));
    state.allCalls = all;
    state.calls = all.filter(c=>dayOf(c.ts)===todayKey());
    state.closed = data.fechado || null;
    state.pendentes = data.pendentes || [];
  }catch(e){
    console.error('Falha ao carregar histórico', e);
    // nao zera o contador: mantem o que ja estava na tela e avisa com um banner
    state.loadError = true;
  }
  state.loading = false;
  render();
  if(pendingCountFor(vendor)) flushQueue();
}

// Registra 1 ligacao: guarda na fila local e envia em segundo plano
async function addCall(type, extra){
  if(state.closed) return;
  const entry = {type, ts:new Date().toISOString(), agendou: extra && extra.agendou, pending:true};
  state.allCalls.push(entry);
  state.calls.push(entry);
  const q = loadQueue();
  q.push({id: state.vendor+'|'+entry.ts, body:{action:'add', vendedor: state.vendor, tipo: type, ts: entry.ts, ...(extra||{})}});
  saveQueue(q);
  render(type==='atendeu' ? 'atendeu' : 'caixa');
  // A ligacao ja esta guardada na fila local; o envio ao servidor (com reenvio
  // automatico se falhar) acontece em segundo plano.
  // Agendamentos/Ligacoes sao recalculados no cliente (state.allCalls), sem buscar as metas de novo.
  recomputeAutoProgress();
  flushQueue();
}

function currentWeekRangeKeys(){
  const now = new Date();
  const day = now.getDay();
  const diff = day===0 ? -6 : 1-day;
  const monday = new Date(now);
  monday.setDate(monday.getDate()+diff);
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate()+6);
  return { inicio: dayKey(monday), fim: dayKey(sunday) };
}

function recomputeAutoProgress(){
  if(!state.metas) return;
  const { inicio, fim } = currentWeekRangeKeys();
  const daSemana = state.allCalls.filter(c=>{
    const d = dayOf(c.ts);
    return d>=inicio && d<=fim;
  });
  state.metas.ligacoes.progresso = daSemana.length;
  state.metas.agendamentos.progresso = daSemana.filter(c=>String(c.agendou).toLowerCase()==='sim').length;
  checkCelebracoes(state.vendor, state.metas);
}

// Dispara confete quando uma meta acabou de bater 100% (uma vez por vendedor+semana+metrica)
function checkCelebracoes(vendor, metas){
  const chaves = ['agendamentos','comparecimentos','vendas','ligacoes'];
  const novasBatidas = [];
  chaves.forEach(k=>{
    const m = metas[k];
    if(!m) return;
    const pct = m.meta>0 ? m.progresso/m.meta : 0;
    const chave = vendor+'|'+metas.semana+'|'+k;
    if(pct>=1 && !state.celebrated.has(chave)){
      state.celebrated.add(chave);
      novasBatidas.push(k);
    }
  });
  if(novasBatidas.length===4){
    launchConfetti(true);
  }else if(novasBatidas.length>0){
    launchConfetti(false);
  }
}

function launchConfetti(mega){
  const cores = ['#C9A84C','#2F9E64','#C9793D','#F1EDE2','#8B3A3A'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  const qtd = mega ? 90 : 28;
  for(let i=0;i<qtd;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = cores[Math.floor(Math.random()*cores.length)];
    const dur = 1.6 + Math.random()*1.4;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*(mega?0.6:0.2))+'s';
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3400);
}

// Desfazer: remove a ultima ligacao desse vendedor (por vendedor+horario)
async function undoLast(){
  if(state.closed || state.calls.length===0) return;
  const removed = state.calls[state.calls.length-1];
  if(removed.pending){
    // ainda nao chegou ao servidor: basta tirar da fila local
    const qid = state.vendor+'|'+removed.ts;
    if(inflightId === qid){
      alert('Essa ligação está sendo enviada agora. Espera um instante e tenta desfazer de novo.');
      return;
    }
    saveQueue(loadQueue().filter(x=>x.id!==qid));
    state.calls.pop();
    const pi = state.allCalls.lastIndexOf(removed);
    if(pi>-1) state.allCalls.splice(pi,1);
    recomputeAutoProgress();
    render();
    return;
  }
  state.calls.pop();
  const idx = state.allCalls.lastIndexOf(removed);
  if(idx>-1) state.allCalls.splice(idx,1);
  render();
  try{
    await sb('ligacoes?vendedor='+eq(state.vendor)+'&ts='+eq(removed.ts), {method:'DELETE'});
  }catch(e){
    console.error('Falha ao desfazer ligação', e);
    // restaura, ja que o servidor nao confirmou a remocao
    state.allCalls.splice(idx>-1?idx:state.allCalls.length, 0, removed);
    state.calls.push(removed);
    alert('Não foi possível desfazer a última ligação no servidor. Tenta de novo.');
    render();
    return;
  }
  recomputeAutoProgress();
  render();
}

// Grava (ou regrava) o fechamento de um dia
function salvarFechamento(data, atendidas, caixa, total, closedAt){
  return sb('fechamentos?on_conflict=vendedor,data', {
    method:'POST',
    prefer:'resolution=merge-duplicates,return=minimal',
    body:{vendedor: state.vendor, data, atendidas, caixa_postal: caixa, total, fechado_em: closedAt}
  });
}

// Marca o dia como fechado
async function fecharRelatorio(){
  const atendidas = state.calls.filter(c=>c.type==='atendeu').length;
  const caixa = state.calls.filter(c=>c.type==='caixa_postal').length;
  if(state.calls.length===0){
    alert('Registra pelo menos uma ligação antes de fechar o relatório do dia.');
    return;
  }
  if(state.calls.some(c=>c.pending)){
    alert('Ainda tem ligação sincronizando com o servidor. Espera alguns segundos e fecha o relatório de novo.');
    return;
  }
  if(!confirm(`Fechar o relatório de hoje?\n\nAtendidas: ${atendidas}\nCaixa postal: ${caixa}\nTotal: ${state.calls.length}\n\nDepois de fechado, não dá pra registrar mais ligações hoje (mas dá pra reabrir se precisar).`)) return;
  const closedAt = new Date().toISOString();
  const summary = {closedAt, atendidas, caixaPostal:caixa, total:state.calls.length};
  try{
    await salvarFechamento(todayKey(), atendidas, caixa, state.calls.length, closedAt);
  }catch(e){
    console.error('Falha ao fechar relatorio', e);
    alert('Não foi possível fechar o relatório no servidor. Tenta de novo.');
    return;
  }
  state.closed = summary;
  render();
}

// Fecha um relatório de um dia anterior que ficou pendente (banner de lembrete)
async function fecharPendente(data){
  const p = state.pendentes.find(x=>x.data===data);
  if(!p) return;
  const dataLabel = new Date(p.data+'T12:00:00').toLocaleDateString('pt-BR');
  if(!confirm(`Fechar o relatório de ${dataLabel}?\n\nAtendidas: ${p.atendeu}\nCaixa postal: ${p.caixa}\nTotal: ${p.total}`)) return;
  const closedAt = new Date().toISOString();
  try{
    await salvarFechamento(p.data, p.atendeu, p.caixa, p.total, closedAt);
  }catch(e){
    console.error('Falha ao fechar relatorio pendente', e);
    alert('Não foi possível fechar esse relatório pendente. Tenta de novo.');
    return;
  }
  state.pendentes = state.pendentes.filter(x=>x.data!==data);
  render();
}

// Reabre o dia de hoje (apaga o fechamento)

  const rows = state.adminRows || [];
  let csv = 'Vendedor,Atendidas,Caixa Postal,Total,Status,Ultima Ligacao\n';
  rows.forEach(r=>{
    const status = state.periodType==='dia' ? (r.closed ? 'Fechado' : (r.total>0 ? 'Em aberto' : 'Sem registro')) : '-';
    const last = r.lastTs ? new Date(r.lastTs).toLocaleString('pt-BR') : '-';
    csv += `"${r.vendor}",${r.atendeu},${r.caixa},${r.total},${status},${last}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});

  const a = document.createElement('a');
  a.href = url;
  a.download = `ligacoes_fbs_${state.periodType}_${state.periodValue}.csv`;
  a.click();

          <div class="vendor-name">Ranking de ligações</div>
          <div class="vendor-date">${periodLabel()}</div>
        </div>
        <button class="trocar-btn" id="exitAdminBtn">sair</button>
      </div>

      <div class="picker-card" style="padding:14px 16px;margin-bottom:16px;">
        <p class="tally-label" style="margin-bottom:8px;">Período</p>
        <div style="display:flex;gap:8px;margin-bottom:4px;">
          <button class="trocar-btn ${state.periodType==='dia'?'active':''}" id="periodDia" style="flex:1;">Dia</button>
          <button class="trocar-btn ${state.periodType==='mes'?'active':''}" id="periodMes" style="flex:1;">Mês</button>
          <button class="trocar-btn ${state.periodType==='ano'?'active':''}" id="periodAno" style="flex:1;">Ano</button>
        </div>
        ${periodInputHtml()}
      </div>

      <div class="tally" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="tally-card">
          <div class="tally-label">Total</div>
          <div class="tally-num" style="font-size:28px;color:var(--text);">${totalGeral}</div>
        </div>
        <div class="tally-card">
          <div class="tally-label">Atendidas</div>
          <div class="tally-num tally-atendeu" style="font-size:28px;">${totalAtendeu}</div>
        </div>
        <div class="tally-card">
          <div class="tally-label">Caixa postal</div>
          <div class="tally-num tally-caixa" style="font-size:28px;">${totalCaixa}</div>
        </div>
      </div>

      ${(state.periodType==='dia' && semRegistro.length) ? `
        <div class="fechado-banner" style="border-color:var(--fechar);">
          <div class="t" style="color:#E8B4B4;">${semRegistro.length} sem nenhum registro hoje</div>
          <div class="s">${semRegistro.map(r=>r.vendor).join(', ')}</div>
        </div>
      ` : ''}

      <div class="history" style="margin-bottom:16px;">
        <div class="history-head" style="cursor:default;">
          <span>Ranking por vendedor</span>
        </div>
        ${rows.map(r=>{
          const pctAtendeu = maxTotal ? (r.atendeu/maxTotal*100) : 0;
          const pctCaixa = maxTotal ? (r.caixa/maxTotal*100) : 0;
          const status = state.periodType==='dia' ? (r.closed ? 'Fechado' : (r.total>0 ? 'Em aberto' : 'Sem registro')) : '';
          const statusColor = r.closed ? 'var(--gold)' : (r.total>0 ? 'var(--text-dim)' : '#E8B4B4');
          return `
            <div style="padding:12px 16px;border-top:1px solid var(--border);">
              <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;">
                <span style="font-weight:600;">${r.vendor}</span>
                <span style="color:var(--text-dim);">${r.total}${status?` · <span style="color:${statusColor};">${status}</span>`:''}</span>
              </div>
              <div style="height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden;display:flex;">
                <div style="width:${pctAtendeu}%;background:var(--atendeu);"></div>
                <div style="width:${pctCaixa}%;background:var(--caixa);"></div>
              </div>
              ${r.lastTs ? `<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">última ligação: ${new Date(r.lastTs).toLocaleString('pt-BR')}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>

      <button class="fechar-btn" id="exportBtn" style="border-color:var(--gold);color:var(--gold);">Baixar CSV do período</button>

      <div class="history" style="margin-top:20px;">
        <div class="history-head" style="cursor:default;">
          <span>Gerenciar vendedores (${VENDORES.length})</span>
        </div>
        ${VENDORES.map(v=>`
          <div class="history-item">
            <span>${v} <span style="color:var(--text-dim);">· PIN ${VENDOR_PINS[v]}</span></span>
            <button class="undo-btn" data-remove="${v}">remover</button>
          </div>
        `).join('')}
        <div style="padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border);">
          <input id="newVendorName" placeholder="Nome" style="flex:2;margin:0;padding:10px;font-size:14px;">
          <input id="newVendorPin" placeholder="PIN" style="flex:1;margin:0;padding:10px;font-size:14px;">
        </div>
        <div style="padding:0 16px 14px;">
          <button class="confirm-btn" id="addVendorBtn" style="margin:0;">Adicionar vendedor</button>
        </div>
      </div>

      <div class="history" style="margin-top:20px;">
        <div class="history-head" style="cursor:default;">
          <span>Metas da semana${state.adminMetas ? ' · ' + (Object.values(state.adminMetas).find(Boolean)?.semana || '') : ''}</span>
        </div>
        ${!state.adminMetas ? `<div class="empty-hint">Carregando metas...</div>` :
          VENDORES.map(v=>{
            const m = state.adminMetas[v];
            if(!m) return `<div class="history-item"><span>${v}</span><span style="color:var(--text-dim);">sem dados</span></div>`;
            const campos = [
              {key:'agendamentos', label:'Agendamentos', metaCampo:'metaAgendamentos', progCampo:null},
              {key:'comparecimentos', label:'Comparecimentos', metaCampo:'metaComparecimentos', progCampo:'progressoComparecimentos'},
              {key:'vendas', label:'Vendas', metaCampo:'metaVendas', progCampo:'progressoVendas'},
              {key:'ligacoes', label:'Ligações', metaCampo:'metaLigacoes', progCampo:null}
            ];
            // resultado da semana anterior, pro admin avaliar antes de ajustar a meta
            const a = m.anterior;
            const resumoAnterior = a ? (a.ligacoes
              ? `Semana passada: ${a.ligacoes} ligações em ${a.dias} dia(s) (${Math.round(a.ligacoes/Math.max(1,a.dias))}/dia) · ${a.agendamentos} agend. · ${a.comparecimentos} comp. · ${a.vendas} vendas`
              : 'Semana passada: nenhuma ligação registrada') : '';
            return `
              <div style="padding:12px 16px;border-top:1px solid var(--border);">
                <div style="font-weight:600;font-size:14px;margin-bottom:${resumoAnterior ? 2 : 8}px;">${v}</div>
                ${resumoAnterior ? `<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">${resumoAnterior}</div>` : ''}
                ${campos.map(c=>{
                  const d = m[c.key] || {meta:1, progresso:0};
                  return `
                    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;">
                      <span style="flex:1;color:var(--text-dim);">${c.label}</span>
                      <span style="color:var(--text-dim);">meta</span>
                      <input type="number" min="1" value="${d.meta}" class="admin-meta-input" data-vendor="${v}" data-campo="${c.metaCampo}" style="width:52px;margin:0;padding:6px;font-size:12px;">
                      ${c.progCampo ? `
                        <span style="color:var(--text-dim);">progresso</span>
                        <input type="number" min="0" value="${d.progresso}" class="admin-meta-input" data-vendor="${v}" data-campo="${c.progCampo}" style="width:52px;margin:0;padding:6px;font-size:12px;">
                      ` : `<span style="color:var(--text-dim);width:100px;text-align:right;">${d.progresso} (automático)</span>`}
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }).join('')
        }
      </div>
    `;
    document.getElementById('exitAdminBtn').onclick = exitAdmin;
    document.getElementById('exportBtn').onclick = exportCsv;
    document.getElementById('periodDia').onclick = ()=>setPeriodType('dia');
    document.getElementById('periodMes').onclick = ()=>setPeriodType('mes');
    document.getElementById('periodAno').onclick = ()=>setPeriodType('ano');
    document.getElementById('periodValueInput').onchange = (e)=>{
      state.periodValue = e.target.value;
      loadAdminData();
    };
    document.getElementById('addVendorBtn').onclick = addVendor;
    app.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = ()=>removeVendor(btn.getAttribute('data-remove'));
    });
    app.querySelectorAll('.admin-meta-input').forEach(inp=>{
      inp.onchange = ()=>adminSaveMeta(inp.getAttribute('data-vendor'), inp.getAttribute('data-campo'), inp.value);
    });
    return;
  }

  const atendidas = state.calls.filter(c=>c.type==='atendeu').length;
  const caixa = state.calls.filter(c=>c.type==='caixa_postal').length;
  const total = state.calls.length;
  const disabled = !!state.closed;

  app.innerHTML = `
    <h2 class="sr-only">Registro de ligações do dia para ${state.vendor}</h2>
    <p class="eyebrow"><img src="logo-icon.png" alt="">FBS Prime</p>
    <h1>Registro de ligações</h1>

    <div class="vendor-row">
      <div>
        <div class="vendor-name">${state.vendor}</div>
        <div class="vendor-date">${todayLabel()}</div>
      </div>
      <button class="trocar-btn" id="trocarBtn">trocar</button>
    </div>

    ${renderMetasPanel()}

    ${state.pendentes.length ? state.pendentes.map(p=>`
      <div class="fechado-banner" style="border-color:var(--caixa);text-align:left;">
        <div class="t" style="color:var(--caixa);">Relatório de ${new Date(p.data+'T12:00:00').toLocaleDateString('pt-BR')} pendente</div>
        <div class="s">${p.atendeu} atendidas · ${p.caixa} caixa postal · ${p.total} no total — esqueceu de fechar esse dia</div>
        <button class="undo-btn" data-fechar-pendente="${p.data}" style="margin-top:8px;color:var(--caixa);">fechar agora</button>
      </div>
    `).join('') : ''}

    <div class="tally">
      <div class="tally-card">
        <div class="tally-label">Atendidas</div>
        <div class="tally-num tally-atendeu ${pulse==='atendeu'?'pulse':''}">${atendidas}</div>
      </div>
      <div class="tally-card">
        <div class="tally-label">Caixa postal</div>
        <div class="tally-num tally-caixa ${pulse==='caixa'?'pulse':''}">${caixa}</div>
      </div>
    </div>
    <div class="tally-total">Total de ligações hoje: <b>${total}</b></div>
    ${state.calls.filter(c=>c.pending).length ? `<div class="tally-total" style="color:var(--caixa);margin-top:-14px;">⏳ ${state.calls.filter(c=>c.pending).length} ligação(ões) sincronizando com o servidor — já estão guardadas, o envio é automático</div>` : ''}
    ${state.loadError ? `<div class="fechado-banner" style="border-color:var(--caixa);"><div class="t" style="color:var(--caixa);">Não consegui atualizar o histórico</div><div class="s">A contagem na tela pode estar incompleta.</div><button class="undo-btn" id="retryLoadBtn" style="margin-top:8px;color:var(--caixa);">tentar de novo</button></div>` : ''}

    ${state.closed ? `
      <div class="fechado-banner">
        <div class="t">Relatório de hoje fechado</div>
        <div class="s">${state.closed.atendidas} atendidas · ${state.closed.caixaPostal} caixa postal · fechado às ${timeLabel(state.closed.closedAt)}</div>
        <button class="undo-btn" id="reopenBtn" style="margin-top:8px;">reabrir relatório</button>
      </div>
    ` : ''}

    <button class="call-btn btn-atendeu" id="btnAtendeu" ${disabled?'disabled':''}>
      <span class="icon">&#9679;</span> Cliente atendeu
    </button>
    <button class="call-btn btn-caixa" id="btnCaixa" ${disabled?'disabled':''}>
      <span class="icon">&#9724;</span> Caixa postal
    </button>

    <div class="undo-row">
      ${(!disabled && total>0) ? '<button class="undo-btn" id="undoBtn">desfazer última ligação</button>' : ''}
    </div>

    <button class="fechar-btn" id="fecharBtn" ${disabled?'disabled':''}>
      ${disabled ? 'Relatório já fechado' : 'Fechar relatório do dia'}
    </button>

    <div class="history">
      <div class="history-head" id="historyHead">
        <span>Histórico de hoje (${total})</span>
        <span class="chev">${state.historyOpen?'&#9650;':'&#9660;'}</span>
      </div>
      <div class="history-list ${state.historyOpen?'open':''}">
        ${total===0 ? '<div class="empty-hint">Nenhuma ligação registrada ainda.</div>' :
          [...state.calls].reverse().map((c,i)=>`
            <div class="history-item">
              <span class="tag ${c.type==='atendeu'?'tag-atendeu':'tag-caixa'}">${c.type==='atendeu'?'Atendeu':'Caixa postal'}</span>
              <span class="time">${timeLabel(c.ts)}</span>
            </div>
          `).join('')
        }
      </div>
    </div>

    ${renderCallModal()}
  `;

  document.getElementById('trocarBtn').onclick = trocarVendedor;
  const retryLoadBtn = document.getElementById('retryLoadBtn');
  if(retryLoadBtn) retryLoadBtn.onclick = ()=>loadVendorData(state.vendor);
  document.getElementById('historyHead').onclick = ()=>{ state.historyOpen = !state.historyOpen; render(); };
  if(!disabled){
    document.getElementById('btnAtendeu').onclick = ()=>openCallModal('atendeu');
    document.getElementById('btnCaixa').onclick = ()=>openCallModal('caixa_postal');
    const undo = document.getElementById('undoBtn');
    if(undo) undo.onclick = undoLast;
  }
  document.getElementById('fecharBtn').onclick = ()=>{ if(!disabled) fecharRelatorio(); };
  const reopenBtn = document.getElementById('reopenBtn');
  if(reopenBtn) reopenBtn.onclick = reopenDay;
  app.querySelectorAll('[data-fechar-pendente]').forEach(btn=>{
    btn.onclick = ()=>fecharPendente(btn.getAttribute('data-fechar-pendente'));
  });

  const vendasEditBtn = document.getElementById('vendasEditBtn');
  if(vendasEditBtn) vendasEditBtn.onclick = ()=>{ state.vendasEditOpen = !state.vendasEditOpen; render(); };
  const vendasInfoBtn = document.getElementById('vendasInfoBtn');
  const vendasTooltip = document.getElementById('vendasTooltip');
  if(vendasInfoBtn && vendasTooltip){
    vendasInfoBtn.onmouseenter = ()=>{ vendasTooltip.style.display = 'block'; };
    vendasInfoBtn.onmouseleave = ()=>{ vendasTooltip.style.display = 'none'; };
    vendasInfoBtn.onclick = (e)=>{
      e.stopPropagation();
      vendasTooltip.style.display = vendasTooltip.style.display==='block' ? 'none' : 'block';
    };
  }
  const vendasSaveBtn = document.getElementById('vendasSaveBtn');
  if(vendasSaveBtn) vendasSaveBtn.onclick = saveVendasProgress;

  const callModalSim = document.getElementById('callModalSim');
  const callModalNao = document.getElementById('callModalNao');
  if(callModalSim) callModalSim.onclick = ()=>answerCallModal('sim');
  if(callModalNao) callModalNao.onclick = ()=>answerCallModal('não');
}

async function init(){
  if(loadQueue().length) scheduleFlush(1500);
  await loadVendorList();
  const session = loadSession();
  if(session && session.type === 'admin'){
    state.view = 'admin';
    loadAdminData();
    loadAdminMetas();
    startAdminPolling();
    return;
  }
  if(session && session.type === 'vendor' && VENDORES.includes(session.name)){
    selectVendor(session.name);
    return;
  }
  clearSession();
  state.view = 'picker';
  render();
}
init();
</script>
</body>
</html>
