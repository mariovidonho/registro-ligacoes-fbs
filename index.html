<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FBS Prime · Registro de Ligações</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1B2A;
    --panel:#132A3E;
    --panel-2:#1B3A54;
    --gold:#C9A84C;
    --atendeu:#2F9E64;
    --atendeu-dim:#1F6E46;
    --caixa:#C9793D;
    --caixa-dim:#8F5426;
    --fechar:#8B3A3A;
    --fechar-dim:#652929;
    --text:#F1EDE2;
    --text-dim:#93A2B5;
    --border:#22415C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 32px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin:0 0 2px;
  }
  .eyebrow img{
    height:18px;
    width:auto;
    display:block;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 18px;
    color:var(--text);
  }
  .vendor-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .vendor-name{font-size:16px;font-weight:600;}
  .vendor-date{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .trocar-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
  }
  .trocar-btn:active{background:var(--panel-2);}
  .trocar-btn.active{background:var(--panel-2);color:var(--text);border-color:var(--gold);}

  .tally{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .tally-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 12px;
    text-align:center;
  }
  .tally-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .tally-num{
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:40px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    line-height:1;
    transition:transform .18s ease;
  }
  .tally-num.pulse{transform:scale(1.18);}
  .tally-atendeu{color:var(--atendeu);}
  .tally-caixa{color:var(--caixa);}
  .tally-total{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin:-6px 0 20px;
  }
  .tally-total b{color:var(--text);font-family:ui-monospace,monospace;}

  .call-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:26px 20px;
    font-size:19px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, filter .08s ease;
  }
  .call-btn:active{transform:scale(.97);filter:brightness(.92);}
  .btn-atendeu{background:var(--atendeu);}
  .btn-caixa{background:var(--caixa);}
  .call-btn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:not-allowed;}
  .call-btn .icon{font-size:22px;line-height:1;}

  .undo-row{
    text-align:center;
    margin:2px 0 22px;
    min-height:20px;
  }
  .undo-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  .fechar-btn{
    width:100%;
    border:1px solid var(--fechar);
    background:transparent;
    color:#E8B4B4;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:18px;
  }
  .fechar-btn:active{background:var(--fechar-dim);}
  .fechar-btn:disabled{
    border-color:var(--border);
    color:var(--text-dim);
    cursor:not-allowed;
  }

  .fechado-banner{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
    text-align:center;
  }
  .fechado-banner .t{font-weight:600;color:var(--gold);margin-bottom:4px;}
  .fechado-banner .s{font-size:13px;color:var(--text-dim);}

  .history{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .history-head{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
  }
  .history-head .chev{color:var(--text-dim);transition:transform .15s ease;font-size:12px;}
  .history-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .2s ease;
  }
  .history-list.open{max-height:340px;overflow-y:auto;}
  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-top:1px solid var(--border);
    font-size:13px;
  }
  .history-item .tag{
    padding:2px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
  }
  .tag-atendeu{background:var(--atendeu-dim);color:#B9EFCF;}
  .tag-caixa{background:var(--caixa-dim);color:#F6D3B3;}
  .history-item .time{color:var(--text-dim);}
  .empty-hint{padding:16px;text-align:center;color:var(--text-dim);font-size:13px;}

  .picker-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
  }
  select,input{
    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    margin:12px 0 16px;
  }
  .confirm-btn{
    width:100%;
    background:var(--gold);
    color:#26200E;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---- Metas da semana ---- */
  .metas-card{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:16px;
    padding:16px 16px 6px;
    margin-bottom:18px;
  }
  .metas-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .meta-row{margin-bottom:14px;position:relative;}
  .meta-row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
  }
  .meta-row-label{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600;}
  .meta-row-value{color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .meta-row-value b{color:var(--text);}
  .meta-bar{
    height:10px;
    border-radius:6px;
    background:var(--panel-2);
    overflow:hidden;
  }
  .meta-bar-fill{
    height:100%;
    border-radius:6px;
    transition:width .4s ease;
    background:var(--text-dim);
  }
  .meta-bar-fill.ok{background:var(--atendeu);}
  .meta-bar-fill.mid{background:var(--gold);}
  .meta-bar-fill.low{background:var(--caixa-dim);}
  .meta-icon-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .meta-icon-btn:active{color:var(--gold);}
  .meta-tooltip{
    position:absolute;
    right:0;
    top:22px;
    z-index:5;
    background:#0A1622;
    border:1px solid var(--border);
    color:var(--text);
    font-size:12px;
    line-height:1.4;
    padding:8px 10px;
    border-radius:8px;
    width:200px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .meta-edit-row{
    display:flex;
    gap:6px;
    margin:6px 0 4px;
  }
  .meta-edit-row input{
    margin:0;
    padding:8px 10px;
    font-size:14px;
    flex:1;
  }
  .meta-edit-row button{
    background:var(--gold);
    color:#26200E;
    border:none;
    border-radius:10px;
    padding:0 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---- Popup Agendou / WhatsApp ---- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(4,10,18,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-card{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:18px;
    padding:26px 22px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .modal-card h3{margin:0 0 18px;font-size:18px;color:var(--text);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-btn-sim{background:var(--atendeu);color:#fff;}
  .modal-btn-nao{background:var(--panel-2);color:var(--text);border:1px solid var(--border) !important;}

  /* ---- Celebracao ---- */
  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:60;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:8px;
    height:14px;
    opacity:.9;
    animation:confetti-fall linear forwards;
    border-radius:2px;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(115vh) rotate(540deg); opacity:.3; }
  }
  .meta-row.celebrating .meta-bar{ box-shadow:0 0 0 2px var(--gold); }

  /* ---- Cronograma do dia ---- */
  .crono-card{
    background:var(--panel);
    border:1px solid rgba(201,168,76,.4);
    border-radius:16px;
    padding:13px 16px 10px;
    margin-bottom:16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .crono-card.pausa{border-color:var(--border);}
  .crono-card.fim{border-color:rgba(47,158,100,.45);}
  .crono-card.flash{animation:crono-flash 1.2s ease-in-out 3;}
  .crono-card.evento{border-color:rgba(179,157,219,.65);}
  .crono-card.evento .crono-top{color:#C9B8F0;}
  .crono-num.ev{font-size:30px;}
  .crono-ev{position:absolute;top:-3px;height:12px;border-radius:4px;background:#B39DDB;box-shadow:0 0 0 2px var(--panel);}
  .crono-ev.feito{opacity:.4;}
  .crono-evento{font-size:11px;color:#C9B8F0;margin-top:4px;}
  @keyframes crono-flash{
    0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}
    50%{box-shadow:0 0 0 3px rgba(201,168,76,.55),0 0 24px rgba(201,168,76,.35);}
  }
  .crono-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .crono-card.pausa .crono-top{color:var(--text-dim);}
  .crono-clock{color:var(--text-dim);letter-spacing:0;font-weight:400;font-variant-numeric:tabular-nums;}
  .crono-main{display:flex;align-items:center;gap:12px;margin:8px 0 11px;}
  .crono-num{
    font-size:38px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.02em;
    color:var(--gold);
    min-width:52px;
    font-variant-numeric:tabular-nums;
  }
  .crono-num.dim{color:var(--text-dim);font-size:30px;}
  .crono-num.ok{color:var(--atendeu);font-size:30px;}
  .crono-title{font-size:15px;font-weight:600;line-height:1.25;}
  .crono-sub{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .crono-sub .alerta{color:var(--caixa);}
  .crono-bar{position:relative;display:flex;gap:2px;height:6px;}
  .crono-seg{border-radius:2px;background:#2A4D6B;}
  .crono-seg.passo.feito{background:rgba(201,168,76,.4);}
  .crono-seg.passo.atual{background:var(--gold);}
  .crono-seg.intervalo{background:#3A4A5A;}
  .crono-seg.cafe{background:repeating-linear-gradient(45deg,#E8D3A3 0 3px,#F1E6CC 3px 6px);}
  .crono-seg.intervalo.feito,.crono-seg.cafe.feito{opacity:.45;}
  .crono-seg.vazio{background:transparent;}
  .crono-agora{
    position:absolute;
    top:-4px;
    width:2px;
    height:14px;
    margin-left:-1px;
    background:var(--text);
    border-radius:1px;
  }
  .crono-ticks{position:relative;height:13px;margin-top:5px;font-size:10px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .crono-ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;}
  .crono-ticks span.first{transform:none;}
  .crono-ticks span.last{transform:translateX(-100%);}
  .crono-more{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .crono-rule-label{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:7px;
  }
  .crono-prioridade{
    background:rgba(201,168,76,.12);
    border:1px solid rgba(201,168,76,.45);
    border-radius:10px;
    padding:8px 10px;
    font-size:12px;
    line-height:1.45;
    margin-bottom:10px;
  }
  .crono-prioridade b{color:var(--gold);}
  .crono-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .crono-chip{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:3px 9px;}
  .crono-chip b{color:var(--gold);}
  .crono-qc{font-size:11px;color:var(--text-dim);margin-top:9px;}
  .crono-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:7px;}
  .crono-toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translate(-50%,-160%);
    transition:transform .35s ease;
    z-index:55;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:12px 16px;
    width:max-content;
    max-width:min(420px,calc(100vw - 32px));
    box-shadow:0 10px 28px rgba(0,0,0,.45);
    font-size:14px;
    cursor:pointer;
  }
  .crono-toast.show{transform:translate(-50%,0);}
  .crono-toast .k{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:2px;
  }
  .crono-edit-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 8px;
    padding:10px 16px;
    border-top:1px solid var(--border);
    font-size:12px;
  }
  .crono-edit-row .nome{flex-basis:100%;font-size:13px;}
  .crono-edit-row .nome b{color:var(--gold);}
  .crono-edit-row input{flex:1;max-width:130px;margin:0;padding:7px 8px;font-size:13px;}

  /* ---- Painel admin (tela cheia) ---- */
  body.modo-admin{
    --a-bg:#0A1520; --a-side:#0D1A28; --a-card:#112334; --a-card-2:#162D43; --a-line:#1D3850;
    --a-dim:#8A9BB0; --a-mute:#5D7189; --a-gold:#C9A84C; --a-gold-soft:rgba(201,168,76,.14);
    background:#0A1520;
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  body.modo-admin #app{max-width:none;padding:0;}
  .adm{
    display:grid;
    grid-template-columns:236px minmax(0,1fr);
    min-height:100vh;
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
  }
  .adm .serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;}
  .adm-side{
    position:sticky;top:0;height:100vh;
    background:var(--a-side);
    border-right:1px solid var(--a-line);
    display:flex;flex-direction:column;
    padding:22px 14px 18px;
  }
  .adm-brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;}
  .adm-brand img{height:30px;}
  .adm-brand .n{font-size:11px;letter-spacing:.18em;color:var(--a-gold);font-weight:700;}
  .adm-brand .t{font-size:13px;color:var(--a-dim);margin-top:1px;}
  .adm-nav{display:flex;flex-direction:column;gap:2px;}
  .adm-nav button{
    display:flex;align-items:center;gap:11px;
    background:none;border:none;border-radius:10px;
    color:var(--a-dim);font:500 14px Inter,sans-serif;
    padding:10px 12px;cursor:pointer;text-align:left;
    transition:background .15s,color .15s;
  }
  .adm-nav button svg{width:18px;height:18px;flex:none;}
  .adm-nav button:hover{background:rgba(255,255,255,.04);color:var(--text);}
  .adm-nav button.on{background:var(--a-gold-soft);color:var(--a-gold);}
  .adm-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
  .adm-mini-crono{
    border:1px solid var(--a-line);border-radius:12px;padding:11px 12px;font-size:12px;cursor:pointer;
  }
  .adm-mini-crono .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-gold);font-weight:700;}
  .adm-mini-crono .v{margin-top:4px;color:var(--text);font-weight:600;line-height:1.3;}
  .adm-mini-crono .s{margin-top:2px;color:var(--a-dim);}
  .adm-sair{
    display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--a-line);
    border-radius:10px;color:var(--a-dim);font:500 13px Inter,sans-serif;padding:9px 12px;cursor:pointer;
  }
  .adm-sair svg{width:16px;height:16px;}
  .adm-sair:hover{color:var(--text);border-color:#2C4C68;}

  .adm-main{padding:28px 36px 56px;min-width:0;}
  .adm-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px;}
  .adm-top .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a-gold);font-weight:700;}
  .adm-top h1{font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em;}
  .adm-top .sub{color:var(--a-dim);font-size:14px;}
  .adm-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .seg{display:inline-flex;background:var(--a-card);border:1px solid var(--a-line);border-radius:11px;padding:3px;}
  .seg button{
    background:none;border:none;border-radius:8px;color:var(--a-dim);
    font:500 13px Inter,sans-serif;padding:7px 14px;cursor:pointer;
  }
  .seg button.on{background:var(--a-card-2);color:var(--text);box-shadow:inset 0 0 0 1px #2C4C68;}
  body.modo-admin input,body.modo-admin select{
    width:auto;margin:0;padding:9px 12px;font:14px Inter,sans-serif;border-radius:10px;
    background:var(--a-card);border:1px solid var(--a-line);color:var(--text);
  }
  body.modo-admin input:focus,body.modo-admin select:focus{outline:none;border-color:var(--a-gold);}
  .btn{
    display:inline-flex;align-items:center;gap:8px;border-radius:10px;cursor:pointer;
    font:600 13px Inter,sans-serif;padding:9px 15px;border:1px solid var(--a-line);
    background:var(--a-card);color:var(--text);transition:filter .15s,border-color .15s;
  }
  .btn svg{width:16px;height:16px;}
  .btn:hover{border-color:#2C4C68;}
  .btn.gold{background:var(--a-gold);border-color:var(--a-gold);color:#241D0B;}
  .btn.gold:hover{filter:brightness(1.07);}
  .btn.ghost{background:none;}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .link{background:none;border:none;color:var(--a-dim);font:500 12px Inter,sans-serif;cursor:pointer;padding:2px 4px;}
  .link:hover{color:var(--text);text-decoration:underline;}
  .link.danger:hover{color:#E8B4B4;}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--a-card);border:1px solid var(--a-line);border-radius:16px;padding:16px 18px 15px;position:relative;overflow:hidden;}
  .kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--a-dim);font-weight:600;}
  .kpi .v{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.05;font-variant-numeric:tabular-nums;}
  .kpi .d{font-size:12px;color:var(--a-dim);margin-top:6px;}
  .kpi.destaque{background:linear-gradient(160deg,#1A3047,#112334 70%);border-color:rgba(201,168,76,.45);}
  .kpi.destaque .v{color:var(--a-gold);}
  .up{color:#5FD39A;} .down{color:#F0A3A3;}

  .grid-2{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:18px;align-items:stretch;}
  .faixa > *{margin:0 !important;}
  .faixa:empty{display:none;}
  .card{background:var(--a-card);border:1px solid var(--a-line);border-radius:16px;min-width:0;}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;}
  .card-h h3{margin:0;font-size:15px;font-weight:600;}
  .card-h .hint{font-size:12px;color:var(--a-dim);}
  .card-b{padding:0 20px 18px;}

  .tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  .tbl th{
    text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-dim);
    font-weight:600;padding:10px 14px;border-bottom:1px solid var(--a-line);white-space:nowrap;
  }
  .tbl td{padding:11px 14px;border-bottom:1px solid rgba(29,56,80,.6);white-space:nowrap;}
  .tbl tbody tr{transition:background .12s;}
  .tbl tbody tr:hover{background:rgba(255,255,255,.025);}
  .tbl .r{text-align:right;}
  .tbl th:first-child,.tbl td:first-child{padding-left:20px;}
  .tbl th:last-child,.tbl td:last-child{padding-right:20px;}
  .tbl tfoot td{border-bottom:none;border-top:1px solid var(--a-gold);font-weight:700;color:var(--a-gold);padding-top:13px;}
  .tbl .mute{color:var(--a-mute);}
  .tbl .auto{color:#5FD39A;}
  .tbl tr.futuro td{color:var(--a-mute);}
  .tbl tr.atual td:first-child{box-shadow:inset 3px 0 0 var(--a-gold);}
  .tbl input.cel{width:130px;text-align:right;padding:6px 9px;font-size:13px;}
  .tbl th .coord{display:block;font-size:11px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--a-mute);margin-top:2px;}
  .scroll-x{overflow-x:auto;}

  .pessoa{display:flex;align-items:center;gap:10px;}
  .av{
    width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#0A1520;background:var(--a-gold);
  }
  .pos{width:22px;text-align:center;font-weight:700;color:var(--a-dim);}
  .pos.p1{color:#E7C766;} .pos.p2{color:#C8D1DC;} .pos.p3{color:#D59A6A;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--a-line);color:var(--a-dim);}
  .pill.ok{color:var(--a-gold);border-color:rgba(201,168,76,.45);background:var(--a-gold-soft);}
  .pill.warn{color:#F0A3A3;border-color:rgba(240,163,163,.35);background:rgba(139,58,58,.18);}
  .pill.live{color:#5FD39A;border-color:rgba(95,211,154,.35);background:rgba(47,158,100,.14);}
  .barra{height:8px;border-radius:5px;background:var(--a-card-2);overflow:hidden;display:flex;min-width:120px;}
  .barra > i{display:block;height:100%;}

  .chart{position:relative;height:250px;display:flex;align-items:flex-end;gap:10px;padding:8px 20px 0 70px;}
  .chart .gl{position:absolute;left:70px;right:20px;border-top:1px dashed rgba(29,56,80,.9);font-size:10px;color:var(--a-mute);}
  .chart .gl span{position:absolute;right:calc(100% + 8px);top:-7px;white-space:nowrap;}
  .chart .m{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative;cursor:default;}
  .chart .b{width:42%;max-width:26px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#E2C46A,#B8953A);min-height:2px;transition:filter .15s;}
  .chart .b.ant{background:#26445F;}
  .chart .m:hover .b{filter:brightness(1.18);}
  .chart .tip{
    position:absolute;bottom:calc(100% - 4px);left:50%;transform:translate(-50%,6px);opacity:0;pointer-events:none;
    background:#0A1520;border:1px solid var(--a-line);border-radius:10px;padding:8px 11px;font-size:12px;
    white-space:nowrap;z-index:5;transition:opacity .12s,transform .12s;box-shadow:0 10px 24px rgba(0,0,0,.45);
  }
  .chart .m:hover .tip{opacity:1;transform:translate(-50%,0);}
  .chart .tip.esq{left:0;transform:translate(0,6px);}
  .chart .tip.dir{left:auto;right:0;transform:translate(0,6px);}
  .chart .m:hover .tip.esq,.chart .m:hover .tip.dir{transform:translate(0,0);}
  .chart .tip b{color:var(--a-gold);}
  .chart-x{display:flex;gap:10px;padding:8px 20px 4px 70px;}
  .chart-x span{flex:1;text-align:center;font-size:11px;color:var(--a-dim);}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--a-dim);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}

  .share{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--a-card-2);margin:4px 0 14px;}
  .share i{display:block;height:100%;}
  .share-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid rgba(29,56,80,.6);}
  .share-row .dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .share-row .nm{flex:1;min-width:0;}
  .share-row .nm small{display:block;color:var(--a-mute);font-size:11px;}

  .feed-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(29,56,80,.6);font-size:13px;}
  .feed-item:first-child{border-top:none;}
  .feed-item .val{margin-left:auto;font-weight:700;color:var(--a-gold);white-space:nowrap;}
  .feed-item small{display:block;color:var(--a-mute);font-size:11px;margin-top:1px;}

  .alerta{border:1px solid rgba(240,163,163,.35);background:rgba(139,58,58,.14);border-radius:14px;padding:14px 16px;}
  .alerta .t{color:#F0A3A3;font-weight:600;font-size:13px;}
  .alerta .s{color:var(--a-dim);font-size:12px;margin-top:4px;line-height:1.5;}

  .ritmo .n{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600;}
  .ritmo .barra{height:10px;margin:10px 0 6px;}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .pcard{background:var(--a-card);border:1px solid var(--a-line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
  .pcard .top{display:flex;align-items:center;gap:12px;}
  .pcard .top .av{width:40px;height:40px;font-size:14px;}
  .pcard .nm{font-weight:600;font-size:15px;}
  .pcard .meta-l{font-size:12px;color:var(--a-dim);margin-top:2px;}
  .pcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pcard .stats div{background:var(--a-card-2);border-radius:10px;padding:8px 10px;}
  .pcard .stats b{display:block;font-size:15px;font-variant-numeric:tabular-nums;}
  .pcard .stats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-dim);}
  .pcard .foot{display:flex;justify-content:space-between;align-items:center;}
  .pcard.novo{border-style:dashed;justify-content:center;}
  .pcard.novo input{width:100%;}

  .meta-cel{min-width:150px;}
  .meta-cel .lin{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px;}
  .meta-cel .lin b{font-size:14px;}
  body.modo-admin .meta-cel input{width:58px;padding:4px 6px;font-size:12px;text-align:right;}
  .meta-cel .barra{min-width:0;height:6px;}

  .timeline{display:flex;gap:4px;height:74px;margin:6px 0 10px;}
  .timeline .blk{border-radius:10px;padding:9px 11px;font-size:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:1px solid transparent;}
  .timeline .blk.passo{background:var(--a-card-2);border-color:var(--a-line);}
  .timeline .blk.passo.atual{background:var(--a-gold-soft);border-color:rgba(201,168,76,.6);}
  .timeline .blk.intervalo{background:#14212E;color:var(--a-dim);}
  .timeline .blk.cafe{background:repeating-linear-gradient(45deg,rgba(232,211,163,.16) 0 6px,rgba(232,211,163,.06) 6px 12px);color:#E8D3A3;}
  .timeline .blk b{font-family:Fraunces,Georgia,serif;font-size:18px;color:var(--a-gold);}
  .timeline .blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-eventos{position:relative;height:26px;margin:-2px 0 6px;}
  .tl-ev{position:absolute;top:3px;height:18px;border-radius:6px;background:rgba(179,157,219,.35);border:1px solid rgba(179,157,219,.7);min-width:8px;}
  .tl-ev-txt{position:absolute;top:4px;font-size:12px;font-weight:600;color:#C9B8F0;white-space:nowrap;}
  .tl-ev.hoje{background:rgba(179,157,219,.3);}

  .drawer-bg{position:fixed;inset:0;background:rgba(3,8,14,.62);z-index:60;display:flex;justify-content:flex-end;}
  .drawer{width:min(440px,100%);height:100%;background:var(--a-side);border-left:1px solid var(--a-line);padding:26px 26px 22px;overflow-y:auto;animation:slide .22s ease;display:flex;flex-direction:column;}
  .drawer h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 4px;}
  .drawer .sub{color:var(--a-dim);font-size:13px;margin-bottom:18px;}
  .drawer label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin:14px 0 6px;}
  body.modo-admin .drawer input,body.modo-admin .drawer select{width:100%;padding:12px 13px;font-size:15px;}
  .drawer .linha{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .drawer .acoes{margin-top:auto;padding-top:22px;display:flex;gap:10px;}
  .drawer .acoes .btn{flex:1;justify-content:center;padding:13px;font-size:14px;}
  .drawer label.btn{display:inline-flex;margin:0;font:600 13px Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--text);}
  .valor-grande{font-family:Fraunces,Georgia,serif;font-size:26px !important;color:var(--a-gold);}
  @keyframes slide{from{transform:translateX(40px)}}

  /* ---- Central do vendedor ---- */
  .adm-nav .badge{margin-left:auto;background:var(--a-gold);color:#241D0B;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;}
  .av.foto{background-size:cover;background-position:center;background-color:var(--a-card-2);}
  .perfil-carregando{position:absolute;inset:0;border-radius:50%;background:rgba(10,21,32,.7);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);}
  .adm-quem{display:flex;align-items:center;gap:10px;padding:8px;font:500 13px Inter,sans-serif;width:100%;background:none;border:1px solid transparent;border-radius:12px;color:var(--text);text-align:left;cursor:pointer;}
  .adm-quem:hover{background:rgba(255,255,255,.04);border-color:var(--a-line);}
  .adm-quem span{min-width:0;}
  .adm-quem .av{width:34px;height:34px;}
  .adm-quem small{display:block;color:var(--a-dim);font-size:11px;}
  /* a aba Hoje fica numa coluna estreita: o vendedor deixa a janela minimizada de lado pra clicar */
  .hoje{max-width:460px;margin:0 auto;}
  .adm-main.estreita .adm-top{max-width:460px;margin-left:auto;margin-right:auto;}
  .rel-wrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start;}
  .rel-list{max-height:calc(100vh - 170px);overflow-y:auto;}
  .rel-mes{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-dim);font-weight:700;padding:14px 18px 6px;}
  .rel-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid rgba(29,56,80,.6);color:var(--text);text-align:left;padding:12px 18px;cursor:pointer;font:500 14px Inter,sans-serif;}
  .rel-item:hover{background:rgba(255,255,255,.03);}
  .rel-item.on{background:var(--a-gold-soft);box-shadow:inset 3px 0 0 var(--a-gold);}
  .rel-item .ic{width:34px;height:40px;border-radius:6px;background:var(--a-card-2);border:1px solid var(--a-line);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#F0A3A3;flex:none;}
  .rel-item small{display:block;color:var(--a-dim);font-size:11px;font-weight:400;margin-top:2px;}
  .rel-item .novo{margin-left:auto;}
  .viewer{height:calc(100vh - 170px);min-height:520px;display:flex;flex-direction:column;overflow:hidden;}
  .viewer iframe{flex:1;width:100%;border:none;background:#525659;border-radius:0 0 16px 16px;}
  .drop{border:2px dashed #2C4C68;border-radius:16px;padding:30px;text-align:center;color:var(--a-dim);cursor:pointer;transition:border-color .15s,background .15s;}
  .drop.over{border-color:var(--a-gold);background:var(--a-gold-soft);color:var(--text);}
  .drop b{color:var(--text);}

  /* ---- Coordenador: so leitura no que e geral ---- */
  .adm.coord .so-rep{display:none !important;}
  .adm.coord .crono-time,.adm.coord .ev-campo,.adm.coord .camp-base{pointer-events:none;opacity:.65;}

  /* ---- Tela de login ---- */
  .lg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;width:100%;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);}
  .lg-marca{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:52px 60px;background:radial-gradient(120% 90% at 0% 0%,#1B3A54 0%,#0F2437 48%,#091622 100%);}
  .lg-marca::before,.lg-marca::after{content:"";position:absolute;right:-18%;width:75%;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.75));transform:rotate(-38deg);transform-origin:right;}
  .lg-marca::before{bottom:34%;}
  .lg-marca::after{bottom:27%;opacity:.45;}
  .lg-logo{display:flex;align-items:center;gap:14px;position:relative;}
  .lg-logo img{height:46px;}
  .lg-logo .n{font-size:13px;letter-spacing:.24em;color:var(--a-gold);font-weight:700;}
  .lg-logo .t{font-size:13px;color:var(--a-dim);margin-top:2px;}
  .lg-frase{position:relative;font-family:Fraunces,Georgia,serif;font-size:clamp(38px,4.6vw,64px);font-weight:600;line-height:1.08;letter-spacing:-.015em;}
  .lg-frase em{font-style:italic;color:var(--a-gold);}
  .lg-rodape{position:relative;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-mute);}
  .lg-form{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:#0A1520;}
  .lg-card{width:100%;max-width:440px;}
  .lg-card h1{font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:600;margin:0 0 6px;}
  .lg-card .sub{color:var(--a-dim);font-size:14px;margin-bottom:24px;}
  .lg-papeis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px;}
  .lg-papeis button{background:var(--a-card);border:1px solid var(--a-line);border-radius:14px;color:var(--a-dim);padding:14px 6px 12px;cursor:pointer;font:600 12.5px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,color .15s,background .15s;}
  .lg-papeis button svg{width:22px;height:22px;}
  .lg-papeis button:hover{border-color:#2C4C68;color:var(--text);}
  .lg-papeis button.on{border-color:var(--a-gold);color:var(--a-gold);background:var(--a-gold-soft);}
  .lg-rotulo{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin:0 0 7px;}
  .lg-pessoas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px;max-height:236px;overflow-y:auto;}
  .lg-pessoas button{display:flex;align-items:center;gap:9px;background:var(--a-card);border:1px solid var(--a-line);border-radius:12px;padding:8px 10px;color:var(--text);font:500 13px Inter,sans-serif;text-align:left;cursor:pointer;min-width:0;}
  .lg-pessoas button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lg-pessoas button:hover{border-color:#2C4C68;}
  .lg-pessoas button.on{border-color:var(--a-gold);background:var(--a-gold-soft);}
  body.modo-admin .lg-card input{width:100%;padding:13px 14px;font-size:16px;margin-bottom:16px;}
  .lg-erro{color:#F0A3A3;font-size:13px;margin:-6px 0 14px;}
  .lg-entrar{width:100%;justify-content:center;padding:14px;font-size:15px;}
  .lg-vazio{color:var(--a-dim);font-size:13px;margin-bottom:18px;}
  @media (max-width:860px){
    .lg{grid-template-columns:minmax(0,1fr);}
    .lg-marca{padding:24px 22px;gap:18px;}
    .lg-marca::before,.lg-marca::after,.lg-rodape{display:none;}
    .lg-frase{font-size:28px;}
    .lg-form{align-items:flex-start;padding:24px 18px 40px;}
  }

  /* ---- Atendimentos ---- */
  .pill.roxo{color:#C9B8F0;border-color:rgba(179,157,219,.5);background:rgba(179,157,219,.12);}
  .at-r{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-dim);font-weight:600;margin-bottom:6px;}
  .at-tit{font-size:13px;font-weight:600;margin-bottom:8px;}
  body.modo-admin .mute{color:var(--a-mute);}
  .at-estreito{max-width:640px;}
  .at-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .at-duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .at-duas .at-grade{grid-template-columns:repeat(2,minmax(0,1fr));}
  .at-fixo{background:var(--a-card-2);border:1px solid var(--a-line);border-radius:10px;padding:9px 12px;font-size:14px;min-height:39px;}
  .at-ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .at-ops.tres{grid-template-columns:repeat(3,minmax(0,1fr));}
  .at-op{background:var(--a-card-2);border:1px solid var(--a-line);border-radius:12px;padding:13px 14px;color:var(--text);text-align:left;cursor:pointer;font:500 14px Inter,sans-serif;}
  .at-op span{display:block;font-size:12px;font-weight:400;color:var(--a-dim);margin-top:2px;}
  .at-op b{font-weight:600;}
  .at-op:hover{border-color:#2C4C68;}
  .at-op.on{border-color:var(--a-gold);background:var(--a-gold-soft);}
  .at-op:disabled{opacity:.45;cursor:not-allowed;}

<body>
<div id="app"></div>

<script>
/*
  Backend: banco Postgres no Supabase (tabelas e funcoes em supabase/schema.sql),
  acessado direto pela API REST com a chave publica. Cada ligacao e uma linha;
  a combinacao vendedor + horario e unica, entao reenviar nunca duplica.
  "Apagar" item avulso do historico foi removido de proposito: so
  "desfazer ultima ligacao" existe (ver funcao undoLast).
*/
const SUPABASE_URL = "https://cnwqzxrqxjatyqsnkxqx.supabase.co";
// chave "publishable": e publica de proposito (o acesso e controlado pelas policies do banco)
const SUPABASE_KEY = "sb_publishable_A4bCcKHzh2XzmSCh6QXY4A_32aWwLuy";

let VENDORES = [];
let VENDOR_PERFIL = {};   // nome -> {foto, apelido, frase, aniversario}

const sleep = ms => new Promise(r=>setTimeout(r,ms));

// Sessao do login: o token vai em toda chamada e e renovado sozinho antes de vencer
const AUTH_KEY = 'fbs_auth';
let sessao = (()=>{ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)); }catch(e){ return null; } })();
function guardarSessao(s){
  sessao = s;
  try{ s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); }catch(e){}
}
function aceitarToken(j){ guardarSessao({access_token:j.access_token, refresh_token:j.refresh_token, expira: Date.now()+j.expires_in*1000}); }
let renovando = null;
function renovarSessao(){
  if(!sessao) return Promise.resolve(false);
  if(renovando) return renovando;
  renovando = (async()=>{
    try{
      const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{apikey: SUPABASE_KEY, 'Content-Type':'application/json'},
        body: JSON.stringify({refresh_token: sessao.refresh_token})
      });
      if(res.status>=400 && res.status<500){ guardarSessao(null); location.reload(); return false; }
      if(!res.ok) return false;
      aceitarToken(await res.json());
      return true;
    }catch(e){ return false; } // sem internet: mantem a sessao e tenta de novo depois
    finally{ renovando = null; }
  })();
  return renovando;
}
async function cabecalhoAuth(){
  if(sessao && Date.now() > sessao.expira - 60000) await renovarSessao();
  const h = {apikey: SUPABASE_KEY};
  if(sessao) h.Authorization = 'Bearer ' + sessao.access_token;
  return h;
}

// Chamada a API REST do Supabase. Qualquer status fora de 2xx vira erro.
// `retries` refaz a chamada (so usar em leituras ou operacoes que podem repetir sem efeito colateral).
async function sb(path, opts, retries){
  opts = opts || {};
  const tries = 1 + (retries||0);
  let lastErr;
  for(let i=0;i<tries;i++){
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 30000);
    try{
      const headers = await cabecalhoAuth();
      if(opts.body !== undefined) headers['Content-Type'] = 'application/json';
      if(opts.prefer) headers.Prefer = opts.prefer;
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        signal: ctrl.signal
      });
      const text = await res.text();
      if(res.status===401 && sessao && !opts.renovou){
        await renovarSessao();
        return sb(path, {...opts, renovou:true}, retries);
      }
      if(!res.ok) throw new Error(`Erro ao comunicar com o servidor (HTTP ${res.status}) ${text.slice(0,200)}`);
      return text.trim() ? JSON.parse(text) : null;
    }catch(e){
      lastErr = e;
      if(i < tries-1) await sleep(1500*(i+1));
    }finally{
      clearTimeout(timeout);
    }
  }
  throw lastErr;
}
const rpc = (fn, args, retries) => sb('rpc/'+fn, {method:'POST', body: args||{}}, retries);
const eq = v => 'eq.' + encodeURIComponent(v);

// Fila persistente de ligacoes ainda nao confirmadas pelo servidor.
// Se o servidor falhar ou a internet cair, a ligacao fica guardada aqui
// e e reenviada sozinha - nunca some do contador do vendedor.
const QUEUE_KEY = 'fbs_pending_calls';
let flushing = false, flushTimer = null, inflightId = null;
// copia em memoria: se o navegador bloquear o localStorage (aba anonima, cota cheia),
// a fila continua funcionando enquanto a pagina estiver aberta
let memQueue = [], storageOk = true;
function loadQueue(){
  if(storageOk){
    try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ storageOk = false; }
  }
  return memQueue.slice();
}
function saveQueue(q){
  memQueue = q.slice();
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){ storageOk = false; }
}
function pendingCountFor(vendor){
  return loadQueue().filter(x=>x.body.vendedor===vendor).length;
}
function scheduleFlush(ms){
  if(flushTimer) return;
  flushTimer = setTimeout(()=>{ flushTimer = null; flushQueue(); }, ms || 8000);
}
// item da fila (formato guardado no celular do vendedor) -> linha da tabela ligacoes
function linhaLigacao(b){
  return {
    vendedor: b.vendedor,
    tipo: b.tipo,
    ts: b.ts,
    agendou: b.tipo==='atendeu' ? (b.agendou||null) : null,
    chamou_whatsapp: b.tipo==='caixa_postal' ? (b.whatsapp||null) : null
  };
}
async function flushQueue(){
  if(flushing) return;
  flushing = true;
  let failed = false;
  let consecutiveFails = 0;
  try{
    while(true){
      const q0 = loadQueue();
      const item = q0.find(x=>x.body.vendedor===state.vendor);
      if(!item) break;
      inflightId = item.id;
      try{
        await sb('ligacoes?on_conflict=vendedor,ts', {
          method:'POST',
          prefer:'resolution=ignore-duplicates,return=minimal',
          body: linhaLigacao(item.body)
        });
      }catch(e){
        console.error('Falha ao salvar ligação, vai tentar de novo', e);
        failed = true;
        consecutiveFails++;
        // manda a ligacao que falhou pro fim da fila, pra ela nao travar as outras
        saveQueue(loadQueue().filter(x=>x.id!==item.id).concat(item));
        if(consecutiveFails >= loadQueue().filter(x=>x.body.vendedor===state.vendor).length) break;
        continue;
      }
      consecutiveFails = 0;
      saveQueue(loadQueue().filter(x=>x.id!==item.id));
      const e = state.allCalls.find(c=>c.ts===item.body.ts && item.body.vendedor===state.vendor);
      if(e) e.pending = false;
      recomputeAutoProgress();
      render();
    }
  } finally {
    inflightId = null;
    flushing = false;
  }
  if(failed && loadQueue().length){ scheduleFlush(); render(); }
}
// no celular os timers param com a tela bloqueada/app em segundo plano:
// reenvia assim que a internet volta ou o vendedor volta pro app
window.addEventListener('online', ()=>flushQueue());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && loadQueue().length) flushQueue(); });

function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){
  return dayKey(new Date());
}
// dia local de um timestamp ISO
function dayOf(iso){
  return dayKey(new Date(iso));
}
function thisMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function thisYearKey(){
  return String(new Date().getFullYear());
}
function todayLabel(){
  return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function timeLabel(iso){
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function applyVendorList(list){
  VENDORES = list.map(v=>v.name);
  VENDOR_PERFIL = {};
  list.forEach(v=>{
    VENDOR_PERFIL[v.name] = {foto:v.foto||'', apelido:v.apelido||'', frase:v.frase||'', aniversario:v.aniversario||'', equipe:v.equipe||'', telefone:v.telefone||''};
  });
}

// Le a lista de vendedores/PINs do banco
async function loadVendorList(){
  try{
    const rows = await sb('vendedores?select=nome,equipe,foto_url,apelido,frase,aniversario,telefone&order=criado_em,nome', undefined, 2);
    const p = state.perfilAcesso;
    // coordenador trabalha so com a propria equipe
    const visiveis = (rows||[]).filter(r=>!p || p.papel!=='coordenador' || r.equipe===p.equipe);
    applyVendorList(visiveis.map(r=>({name:r.nome, equipe:r.equipe, foto:r.foto_url, apelido:r.apelido, frase:r.frase, aniversario:r.aniversario, telefone:r.telefone})));
  }catch(e){
    console.error('Falha ao carregar vendedores', e);
    alert('Não foi possível carregar a lista de vendedores. Verifica sua conexão e tenta de novo.');
  }
}

// Adiciona/remove 1 vendedor por vez
async function addVendor(){
  const name = document.getElementById('newVendorName').value.trim();
  const pin = document.getElementById('newVendorPin').value.trim();
  const equipe = document.getElementById('newVendorEquipe').value;
  if(!name || !pin){ alert('Preenche o nome e o PIN provisório antes de adicionar.'); return; }
  if(!/^[0-9]{4,6}$/.test(pin)){ alert('O PIN provisório precisa ter de 4 a 6 números.'); return; }
  if(VENDORES.includes(name)){ alert('Já existe um vendedor com esse nome.'); return; }
  try{
    await rpc('admin_criar_vendedor', {p_nome:name, p_pin:pin, p_equipe:equipe||null});
  }catch(e){
    console.error('Falha ao adicionar vendedor', e);
    alert('Não foi possível adicionar o vendedor. Tenta de novo.');
    return;
  }
  await loadVendorList();
  if(state.adminRows) await loadAdminData();
  else render();
  loadCoordenadores();
  showCronoToast('Vendedores', `${esc(name)} cadastrado. No primeiro acesso, ele cria o PIN de 6 números.`);
}

async function removeVendor(name){
  if(!confirm(`Remover ${name}? O acesso dele é apagado, mas os dados já registrados continuam salvos.`)) return;
  try{
    await rpc('admin_remover_acesso', {p_nome:name, p_papel:'vendedor'});
  }catch(e){
    console.error('Falha ao remover vendedor', e);
    alert('Não foi possível remover o vendedor. Tenta de novo.');
    return;
  }
  await loadVendorList();
  await loadAdminData();
}

async function redefinirPin(nome){
  const pin = prompt(`PIN provisório para ${nome} (4 a 6 números). No próximo acesso, a pessoa cria um PIN novo de 6 números:`);
  if(pin === null) return;
  if(!/^[0-9]{4,6}$/.test(pin.trim())){ alert('O PIN provisório precisa ter de 4 a 6 números.'); return; }
  try{
    await rpc('admin_redefinir_pin', {p_nome:nome, p_pin:pin.trim()});
  }catch(e){
    console.error('Falha ao redefinir PIN', e);
    alert('Não foi possível redefinir o PIN. Tenta de novo.');
    return;
  }
  await loadCoordenadores();
  showCronoToast('Acesso', `PIN provisório definido para ${esc(nome)}`);
}

async function loadCoordenadores(){
  try{
    const [coords, pins] = await Promise.all([rpc('admin_coordenadores', {}, 1), rpc('admin_ver_pins', {}, 1)]);
    state.coords = coords || [];
    state.pins = {};
    (pins||[]).forEach(x=>{ state.pins[x.papel+'|'+x.nome] = x.pin; });
  }
  catch(e){ console.error('Falha ao carregar coordenadores', e); state.coords = []; }
  if(state.view==='admin') render();
}
async function addCoordenador(){
  const nome = document.getElementById('newCoordNome').value.trim();
  const pin = document.getElementById('newCoordPin').value.trim();
  const equipe = document.getElementById('newCoordEquipe').value;
  if(!nome || !pin || !equipe){ alert('Preenche o nome, a equipe e o PIN provisório.'); return; }
  if(!/^[0-9]{4,6}$/.test(pin)){ alert('O PIN provisório precisa ter de 4 a 6 números.'); return; }
  try{
    await rpc('admin_criar_coordenador', {p_nome:nome, p_pin:pin, p_equipe:equipe});
  }catch(e){
    console.error('Falha ao criar coordenador', e);
    alert('Não foi possível criar o acesso. Confere se já não existe um coordenador com esse nome.');
    return;
  }
  await loadCoordenadores();
  showCronoToast('Coordenadores', `Acesso criado para ${esc(nome)}`);
}
async function removeCoordenador(nome){
  if(!confirm(`Remover o acesso de coordenador de ${nome}?`)) return;
  try{ await rpc('admin_remover_acesso', {p_nome:nome, p_papel:'coordenador'}); }
  catch(e){ console.error(e); alert('Não foi possível remover o acesso.'); return; }
  await loadCoordenadores();
}

let state = {
  view: 'loading',
  vendor: null,
  pendingVendor: null,
  vendorPinError: false,
  calls: [],
  allCalls: [],
  closed: null,
  pendentes: [],
  historyOpen: false,
  loading: false,
  loadError: false,
  periodType: 'dia',
  periodValue: todayKey(),
  adminRows: null,
  pinError: false,
  metas: null,
  metasLoading: false,
  callModal: null,       // 'agendou' | 'whatsapp' | null
  pendingCallType: null,
  vendasEditOpen: false,
  celebrated: new Set(), // chaves "vendedor|semana|metrica" ja celebradas nesta sessao
  adminMetas: null,      // { [vendedor]: metasObj } no painel admin
  adminMetasEdit: {},    // { [vendedor]: {campo:valor} } rascunho dos inputs do admin
  cronoOpen: false,      // cartao do cronograma expandido (regra de ouro)
  cronoDraft: null,      // rascunho dos horarios sendo editados no admin
  cronoFlashAte: 0,      // brilho dourado do cartao ate esse instante (troca de passo)
  adminTab: 'ligacoes',  // pagina do painel admin: ligacoes | metas | producao | vendedores | cronograma
  prod: null,            // { equipes, manual, vendas } da tela de producao
  prodAno: new Date().getFullYear(),
  prodEdit: false,       // tabela de producao com campos editaveis
  vendaDrawer: false,    // janela lateral de registrar venda aberta
  centralTab: 'hoje',    // pagina da central do vendedor: hoje | relatorios
  relatorios: null,      // relatorios do vendedor logado
  relAberto: null,       // id do relatorio aberto no visualizador
  adminRel: null,        // todos os relatorios (pagina Relatorios do admin)
  relEnvio: [],          // arquivos escolhidos no admin aguardando envio
  desemp: null,          // dados da pagina Desempenho (ligacoes por dia, semanas oficiais, vendas)
  ranking: null,         // historico do ranking anual + vendas do site
  cronoEventosDraft: null, // rascunho dos eventos fixos editados no admin
  perfil: null,          // perfil aberto na janela lateral {nome, foto, apelido, frase, aniversario}
  camp: null,            // campanhas + bases + vendas (aba Campanhas)
  campForm: null,        // campanha sendo criada/editada no admin
  mp: null,              // regra da calculadora + metas pessoais
  mmValor: null,         // valor digitado na calculadora "Minha meta"
  login: {papel:'vendedor', nome:'', nomes:null, erro:'', enviando:false},
  perfilAcesso: null,    // {papel, nome, equipe, trocar_pin} de quem esta logado
  coords: null,          // coordenadores (so o representante carrega)
  pins: null,            // PINs visiveis ao representante
  pinsAbertos: null,     // quais PINs estao revelados na tela
  relUrls: null,         // links temporarios dos PDFs de relatorio
  at: {lista:null, tabelas:null, tabUrls:null, tabelaId:null, sub:'clientes', subGestor:'aprovacao', fichaId:null, passo:null, busca:'', filtroV:'', filtroS:'',
       novo:{tel:'', nome:'', modo:'meu', titular:'', canal:'', lgpd:false, achado:null, erro:''}, espera:{}, etapa:'cliente', etapaDe:null, opcao:0, folhaOp:null, folhaExtras:{}, cheia:false, drawerId:null}
};

// Le historico recente do vendedor + status "fechado" do dia + dias pendentes
async function loadVendorData(vendor){
  state.loading = true; state.loadError = false; render();
  try{
    const data = await rpc('dados_vendedor', {p_vendedor: vendor}, 2);
    // o banco devolve "2026-09-26T13:05:00.123+00:00"; normaliza pro mesmo formato do site (toISOString)
    const all = (data.ligacoes || []).map(r=>({type:r.tipo, ts:new Date(r.ts).toISOString(), agendou:r.agendou}));
    // junta ligacoes deste vendedor que ainda estao na fila local (nao confirmadas no servidor)
    const serverTs = new Set(all.map(c=>c.ts));
    const fila = loadQueue().filter(x=>x.body.vendedor===vendor);
    const restantes = fila.filter(x=>!serverTs.has(x.body.ts));
    if(restantes.length !== fila.length){
      saveQueue(loadQueue().filter(x=>x.body.vendedor!==vendor || !serverTs.has(x.body.ts)));
    }
    restantes.forEach(x=>all.push({type:x.body.tipo, ts:x.body.ts, agendou:x.body.agendou, pending:true}));
    state.allCalls = all;
    state.calls = all.filter(c=>dayOf(c.ts)===todayKey());
    state.closed = data.fechado || null;
    state.pendentes = data.pendentes || [];
  }catch(e){
    console.error('Falha ao carregar histórico', e);
    // nao zera o contador: mantem o que ja estava na tela e avisa com um banner
    state.loadError = true;
  }
  state.loading = false;
  render();
  if(pendingCountFor(vendor)) flushQueue();
}

// Registra 1 ligacao: guarda na fila local e envia em segundo plano
async function addCall(type, extra){
  if(state.closed) return;
  const entry = {type, ts:new Date().toISOString(), agendou: extra && extra.agendou, pending:true};
  state.allCalls.push(entry);
  state.calls.push(entry);
  const q = loadQueue();
  q.push({id: state.vendor+'|'+entry.ts, body:{action:'add', vendedor: state.vendor, tipo: type, ts: entry.ts, ...(extra||{})}});
  saveQueue(q);
  render(type==='atendeu' ? 'atendeu' : 'caixa');
  // A ligacao ja esta guardada na fila local; o envio ao servidor (com reenvio
  // automatico se falhar) acontece em segundo plano.
  // Agendamentos/Ligacoes sao recalculados no cliente (state.allCalls), sem buscar as metas de novo.
  recomputeAutoProgress();
  flushQueue();
}

function currentWeekRangeKeys(){
  const now = new Date();
  const day = now.getDay();
  const diff = day===0 ? -6 : 1-day;
  const monday = new Date(now);
  monday.setDate(monday.getDate()+diff);
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate()+6);
  return { inicio: dayKey(monday), fim: dayKey(sunday) };
}

function recomputeAutoProgress(){
  if(!state.metas) return;
  const { inicio, fim } = currentWeekRangeKeys();
  const daSemana = state.allCalls.filter(c=>{
    const d = dayOf(c.ts);
    return d>=inicio && d<=fim;
  });
  state.metas.ligacoes.progresso = daSemana.length;
  state.metas.agendamentos.progresso = daSemana.filter(c=>String(c.agendou).toLowerCase()==='sim').length;
  checkCelebracoes(state.vendor, state.metas);
}

function checkCelebracoes(vendor, metas){
  const chaves = ['agendamentos','comparecimentos','vendas','ligacoes'];
  const novasBatidas = [];
  chaves.forEach(k=>{
    const m = metas[k];
    if(!m) return;

// Desfazer: remove a ultima ligacao desse vendedor (por vendedor+horario)
async function undoLast(){
  if(state.closed || state.calls.length===0) return;
  const removed = state.calls[state.calls.length-1];
  if(removed.pending){
    // ainda nao chegou ao servidor: basta tirar da fila local
    const qid = state.vendor+'|'+removed.ts;
    if(inflightId === qid){
      alert('Essa ligação está sendo enviada agora. Espera um instante e tenta desfazer de novo.');
      return;
    }
    saveQueue(loadQueue().filter(x=>x.id!==qid));
    state.calls.pop();
    const pi = state.allCalls.lastIndexOf(removed);
    if(pi>-1) state.allCalls.splice(pi,1);
    recomputeAutoProgress();
    render();
    return;
  }
  state.calls.pop();
  const idx = state.allCalls.lastIndexOf(removed);
  if(idx>-1) state.allCalls.splice(idx,1);
  render();
  try{
    await sb('ligacoes?vendedor='+eq(state.vendor)+'&ts='+eq(removed.ts), {method:'DELETE'});
  }catch(e){
    console.error('Falha ao desfazer ligação', e);
    // restaura, ja que o servidor nao confirmou a remocao
    state.allCalls.splice(idx>-1?idx:state.allCalls.length, 0, removed);
    state.calls.push(removed);
    alert('Não foi possível desfazer a última ligação no servidor. Tenta de novo.');
    render();
    return;
  }
  recomputeAutoProgress();
  render();
}

  if(state.calls.length===0){

    alert('Ainda tem ligação sincronizando com o servidor. Espera alguns segundos e fecha o relatório de novo.');
    return;
  }
  if(!confirm(`Fechar o relatório de hoje?\n\nAtendidas: ${atendidas}\nCaixa postal: ${caixa}\nTotal: ${state.calls.length}\n\nDepois de fechado, não dá pra registrar mais ligações hoje (mas dá pra reabrir se precisar).`)) return;
  const closedAt = new Date().toISOString();
  const summary = {closedAt, atendidas, caixaPostal:caixa, total:state.calls.length};
  try{
    await salvarFechamento(todayKey(), atendidas, caixa, state.calls.length, closedAt);
  }catch(e){
    console.error('Falha ao fechar relatorio', e);
    alert('Não foi possível fechar o relatório no servidor. Tenta de novo.');
    return;
  }

  render();
}

/*
  Cronograma do dia (segunda a sexta). Os horarios ficam numa linha da tabela
  `cronograma` no Supabase, editada pelo painel admin; se ela nao carregar, vale o
  que estiver guardado no celular ou, em ultimo caso, o padrao abaixo (o do PDF).
  O passo atual e calculado pelo relogio, no fuso de Sao Paulo, sem ir ao servidor.
*/
const CRONO_PADRAO = [
  {tipo:'passo',     num:'01', titulo:'Oportunidade e primeiro contato',    inicio:'09:30', fim:'13:00'},
  {tipo:'intervalo',           titulo:'Intervalo',                          inicio:'13:00', fim:'14:30'},
  {tipo:'passo',     num:'02', titulo:'Segundo contato',                    inicio:'14:30', fim:'16:00'},
  {tipo:'cafe',                titulo:'Café e networking',                  inicio:'16:00', fim:'16:30'},
  {tipo:'passo',     num:'03', titulo:'Acompanhamentos e reunião agendada', inicio:'16:30', fim:'18:00'},
  {tipo:'passo',     num:'04', titulo:'Terceiro contato',                   inicio:'18:00', fim:'19:00'}
];
const CRONO_CACHE_KEY = 'fbs_cronograma';
const CRONO_AVISO_MIN = 10; // faltando isso, o "faltam X" fica laranja e lembra do controle de qualidade

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmmMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const minHhmm = m => Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function duracaoLabel(min){
  if(min < 60) return min+' min';
  const r = min%60;
  return Math.floor(min/60)+'h'+(r ? String(r).padStart(2,'0') : '');
}

// Aceita so uma lista de blocos com horarios validos e em ordem; senao devolve null
function validarBlocos(blocos){
  if(!Array.isArray(blocos) || !blocos.length) return null;
  let fimAnterior = -1;
  for(const b of blocos){
    if(!b || !['passo','intervalo','cafe'].includes(b.tipo) || typeof b.titulo!=='string') return null;
    if(!/^\d{2}:\d{2}$/.test(b.inicio||'') || !/^\d{2}:\d{2}$/.test(b.fim||'')) return null;
    const ini = hhmmMin(b.inicio), fim = hhmmMin(b.fim);
    if(ini >= fim || ini < fimAnterior || fim > 24*60) return null;
    fimAnterior = fim;
  }
  return blocos;
}

let cronoBlocos = (()=>{
  try{ return validarBlocos(JSON.parse(localStorage.getItem(CRONO_CACHE_KEY))) || CRONO_PADRAO; }
  catch(e){ return CRONO_PADRAO; }
})();
let cronoCarregadoEm = 0;

// Eventos fixos da semana por cima do cronograma (ex.: reuniao de marketing toda segunda 10h)
const CRONO_EVENTOS_KEY = 'fbs_cronograma_eventos';
const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function validarEventos(ev){
  if(!Array.isArray(ev)) return null;
  return ev.filter(x=>x && typeof x.titulo==='string' && x.titulo.trim() && Number.isInteger(x.dia) && x.dia>=0 && x.dia<=6
    && /^\d{2}:\d{2}$/.test(x.inicio||'') && /^\d{2}:\d{2}$/.test(x.fim||'') && hhmmMin(x.inicio) < hhmmMin(x.fim));
}
let cronoEventos = (()=>{
  try{ return validarEventos(JSON.parse(localStorage.getItem(CRONO_EVENTOS_KEY))) || []; }
  catch(e){ return []; }
})();

const SP_FMT = new Intl.DateTimeFormat('en-US', {
  timeZone:'America/Sao_Paulo', hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'
});
// Dia da semana (0 = domingo) e minutos desde a meia-noite, no horario de Sao Paulo
function agoraSP(){
  const p = {};
  SP_FMT.formatToParts(new Date()).forEach(x=>{ p[x.type] = x.value; });
  return {
    dow: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),
    min: (Number(p.hour)%24)*60 + Number(p.minute) + Number(p.second)/60
  };
}

// Em que ponto do cronograma estamos agora
function cronoEstado(){
  const {dow, min} = agoraSP();
  const blocos = cronoBlocos;
  const ini = hhmmMin(blocos[0].inicio), fim = hhmmMin(blocos[blocos.length-1].fim);
  const eventosHoje = cronoEventos.map((x,idx)=>({...x, idx})).filter(x=>x.dia===dow).sort((a,b)=>a.inicio<b.inicio?-1:1);
  const evento = eventosHoje.find(x=>min>=hhmmMin(x.inicio) && min<hhmmMin(x.fim)) || null;
  const base = {min, ini, fim, relogio: minHhmm(Math.floor(min)), eventosHoje, evento};
  const proxPasso = de => blocos.slice(de).find(b=>b.tipo==='passo');
  if(dow===0 || dow===6) return {...base, fase:'fds', min:-1};
  if(min < ini) return {...base, fase:'antes', prox: proxPasso(0)};
  if(min >= fim) return {...base, fase:'fim'};
  const i = blocos.findIndex(b=>min>=hhmmMin(b.inicio) && min<hhmmMin(b.fim));
  if(i < 0){
    const j = blocos.findIndex(b=>hhmmMin(b.inicio) > min);
    return {...base, fase:'livre', i:'livre'+j, prox: proxPasso(j), ateMin: hhmmMin(blocos[j].inicio)};
  }
  const b = blocos[i];
  return {
    ...base,
    fase: b.tipo==='passo' ? 'passo' : 'pausa',
    i, bloco: b,
    restante: Math.ceil(hhmmMin(b.fim) - min),
    prox: proxPasso(i+1)
  };
}

function renderCronoCard(modoAdmin){
  const e = cronoEstado();
  if(e.fase==='fds' && !modoAdmin) return '';
  const blocos = cronoBlocos;
  const prefixo = modoAdmin ? 'Cronograma do time' : 'Cronograma';
  let cls = '', fase = 'agora', num = '', numCls = '', titulo = '', sub = '';

  if(e.fase==='passo'){
    num = e.bloco.num || '';
    titulo = esc(e.bloco.titulo);
    const faixa = e.bloco.inicio.replace(/^0/,'')+' – '+e.bloco.fim.replace(/^0/,'');
    sub = e.restante <= CRONO_AVISO_MIN
      ? `${faixa} · <span class="alerta">faltam ${duracaoLabel(e.restante)} · controle de qualidade</span>`
      : `${faixa} · faltam ${duracaoLabel(e.restante)}`;
  }else if(e.fase==='pausa' || e.fase==='livre'){
    cls = 'pausa'; fase = 'pausa'; numCls = 'dim';
    const ate = e.fase==='pausa' ? hhmmMin(e.bloco.fim) : e.ateMin;
    if(e.fase==='pausa'){
      num = e.bloco.tipo==='cafe' ? '☕' : 'II';
      titulo = esc(e.bloco.titulo);
    }else{
      num = '–';
      titulo = 'Pausa no cronograma';
    }
    sub = e.prox
      ? `Volta às ${minHhmm(ate)} com o Passo ${esc(e.prox.num||'')} · em ${duracaoLabel(Math.ceil(ate - e.min))}`
      : `Volta às ${minHhmm(ate)}`;
  }else if(e.fase==='antes'){
    cls = 'pausa'; fase = 'antes do início'; num = '–'; numCls = 'dim';
    titulo = `Cronograma começa às ${minHhmm(e.ini)}`;
    sub = e.prox ? `Primeiro: Passo ${esc(e.prox.num||'')} · ${esc(e.prox.titulo)}` : '';
  }else if(e.fase==='fim'){
    cls = 'fim'; fase = 'encerrado'; num = '✓'; numCls = 'ok';
    titulo = 'Cronograma do dia concluído';
    sub = modoAdmin ? 'Hora do time fechar o relatório do dia' : 'Não esqueça de fechar o relatório do dia';
  }else{
    cls = 'pausa'; fase = 'fim de semana'; num = '–'; numCls = 'dim';
    titulo = 'Hoje não tem cronograma';
    sub = `Volta na segunda às ${minHhmm(e.ini)}`;
  }
  // evento acontecendo agora tem prioridade; evento que ainda vai acontecer hoje vira um aviso
  let avisoEvento = '';
  if(e.evento){
    const ev = e.evento, voltaPasso = e.fase==='passo' ? ` · depois volta ao Passo ${esc(e.bloco.num||'')}` : '';
    cls = 'evento'; fase = 'reunião'; num = '📣'; numCls = 'ev';
    titulo = esc(ev.titulo);
    sub = `${ev.inicio.replace(/^0/,'')} – ${ev.fim.replace(/^0/,'')} · faltam ${duracaoLabel(Math.ceil(hhmmMin(ev.fim) - e.min))}${voltaPasso}`;
  }else if(e.fase!=='fds'){
    const prox = e.eventosHoje.find(x=>hhmmMin(x.inicio) > e.min);
    if(prox) avisoEvento = `<div class="crono-evento">📣 Hoje às ${prox.inicio.replace(/^0/,'')} · ${esc(prox.titulo)}</div>`;
  }
  if((e.fase==='passo' || e.evento) && Date.now() < state.cronoFlashAte) cls += ' flash';

  // barra do dia: cada bloco ocupa a largura proporcional a sua duracao
  const total = e.fim - e.ini;
  let cursor = e.ini, segs = '';
  const marcas = [];
  blocos.forEach(b=>{
    const s = hhmmMin(b.inicio), f = hhmmMin(b.fim);
    if(s > cursor) segs += `<div class="crono-seg vazio" style="flex:${s-cursor};"></div>`;
    const st = f <= e.min ? 'feito' : (s <= e.min ? 'atual' : '');
    segs += `<div class="crono-seg ${b.tipo} ${st}" style="flex:${f-s};"></div>`;
    marcas.push(s);
    cursor = f;
  });
  marcas.push(e.fim);
  const agora = (e.min >= e.ini && e.min < e.fim)
    ? `<div class="crono-agora" style="left:${(e.min-e.ini)/total*100}%;"></div>` : '';
  const marcasEvento = e.eventosHoje.map(ev=>{
    const s = Math.max(hhmmMin(ev.inicio), e.ini), f = Math.min(hhmmMin(ev.fim), e.fim);
    if(f <= s) return '';
    return `<div class="crono-ev ${f<=e.min?'feito':''}" style="left:${(s-e.ini)/total*100}%;width:${(f-s)/total*100}%;" title="${esc(ev.titulo)} · ${ev.inicio}–${ev.fim}"></div>`;
  }).join('');
  // rotulos de horario sem encavalar: pula os que ficariam perto demais do anterior
  // (o ultimo e alinhado pela direita, entao precisa de mais folga)
  const pcts = [...new Set(marcas)].map(m=>({m, p:(m-e.ini)/total*100}));
  const visiveis = [];
  pcts.forEach((x,k)=>{
    const ult = visiveis[visiveis.length-1];
    if(ult && x.p - ult.p < (k===pcts.length-1 ? 15 : 9)){
      if(k===pcts.length-1) visiveis[visiveis.length-1] = x; // o horario final sempre aparece
      return;
    }
    visiveis.push(x);
  });
  const ticks = visiveis.map((x,k)=>
    `<span class="${k===0?'first':(k===visiveis.length-1?'last':'')}" style="left:${x.p}%;">${minHhmm(x.m)}</span>`
  ).join('');

  return `
    <div class="crono-card ${cls}" id="cronoCard" role="button" tabindex="0" aria-expanded="${state.cronoOpen}">
      <div class="crono-top">
        <span>${prefixo} · ${fase}</span>
        <span class="crono-clock">${e.relogio}</span>
      </div>
      <div class="crono-main">
        <div class="crono-num ${numCls}">${num}</div>
        <div style="flex:1;min-width:0;">
          <div class="crono-title">${titulo}</div>
          ${sub ? `<div class="crono-sub">${sub}</div>` : ''}
          ${avisoEvento}
        </div>
      </div>
      <div class="crono-bar">${segs}${marcasEvento}${agora}</div>
      <div class="crono-ticks">${ticks}</div>
      ${state.cronoOpen ? `
        <div class="crono-more">
          <div class="crono-rule-label">Regra de ouro</div>
          <div class="crono-prioridade"><b>Prioridade máxima:</b> leads em oportunidade em tempo real ou que chegam pela automação. Ligue na hora.</div>
          <div class="crono-rule-label" style="color:var(--text-dim);">Toda tentativa de contato inclui</div>
          <div class="crono-chips">
            <span class="crono-chip"><b>3</b> ligações convencionais</span>
            <span class="crono-chip"><b>1</b> mensagem no WhatsApp</span>
            <span class="crono-chip"><b>1</b> ligação no WhatsApp</span>
            <span class="crono-chip"><b>1</b> áudio</span>
          </div>
          <div class="crono-qc">Ao fim de cada passo, faça o controle de qualidade.</div>
        </div>
      ` : ''}
      <div class="crono-hint">${state.cronoOpen ? 'recolher ▴' : 'toque para ver a regra de ouro ▾'}</div>
    </div>
  `;
}

// Redesenha so o cartao (sem render() geral, pra nao atrapalhar quem esta digitando)
function atualizarCronoCard(){
  if(state.view!=='app' && state.view!=='admin') return;
  const atual = document.getElementById('cronoCard');
  const html = renderCronoCard(state.view==='admin').trim();
  if(!atual && !html) return;
  if(!atual || !html){
    // o cartao apareceu ou sumiu (virada do fim de semana): precisa da tela inteira
    if(!(document.activeElement && document.activeElement.tagName==='INPUT')) render();
    return;
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  atual.replaceWith(tmp.firstElementChild);
}

let cronoToastTimer = null;
function showCronoToast(kicker, texto){
  let el = document.getElementById('cronoToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'cronoToast';
    el.className = 'crono-toast';
    el.setAttribute('role', 'status');
    el.onclick = ()=>el.classList.remove('show');
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="k">${kicker}</div><div>${texto}</div>`;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(cronoToastTimer);
  cronoToastTimer = setTimeout(()=>el.classList.remove('show'), 7000);
}

// A cada poucos segundos: atualiza relogio/barra e avisa quando muda o passo
let cronoUltimaChave = null, cronoUltimoEvento = null;
function cronoTick(){
  if(sessao && (state.view==='app' || state.view==='admin') && Date.now() - cronoCarregadoEm > 15*60*1000) loadCronograma();
  const e = cronoEstado();
  const chaveEvento = e.evento ? 'ev'+e.evento.idx : '';
  const chave = e.fase + '|' + (e.i ?? '') + '|' + chaveEvento;
  const mudou = cronoUltimaChave !== null && chave !== cronoUltimaChave;
  const eventoMudou = cronoUltimaChave !== null && chaveEvento !== cronoUltimoEvento;
  cronoUltimaChave = chave; cronoUltimoEvento = chaveEvento;
  const naTela = state.view==='app' || state.view==='admin';
  if(eventoMudou && e.evento && naTela){
    state.cronoFlashAte = Date.now() + 3700;
    showCronoToast('Agora', `${esc(e.evento.titulo)} · até ${e.evento.fim.replace(/^0/,'')}`);
  }else if(mudou && naTela && !(e.fase==='fds' && state.view==='app')){
    if(e.fase==='passo' && eventoMudou){
      showCronoToast('De volta ao cronograma', `Passo ${esc(e.bloco.num||'')} · ${esc(e.bloco.titulo)}`);
    }else if(e.fase==='passo'){
      state.cronoFlashAte = Date.now() + 3700;
      showCronoToast('Começou agora', `Passo ${esc(e.bloco.num||'')} · ${esc(e.bloco.titulo)}`);
    }else if(e.fase==='pausa'){
      showCronoToast('Pausa', `${esc(e.bloco.titulo)} · volta às ${e.bloco.fim.replace(/^0/,'')}`);
    }else if(e.fase==='fim'){
      showCronoToast('Cronograma concluído', state.view==='admin' ? 'Hora do time fechar o relatório do dia' : 'Não esqueça de fechar o relatório do dia');
    }
  }
  atualizarCronoCard();
  const mini = document.getElementById('admMiniCrono');
  if(mini && typeof miniCronoHtml === 'function') mini.innerHTML = miniCronoHtml();
}
setInterval(cronoTick, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cronoTick(); });

async function salvarCronograma(blocos, eventos){
  eventos = eventos || cronoEventos;
  const eventosValidos = validarEventos(eventos);
  if(!eventosValidos || eventosValidos.length !== eventos.length){
    alert('Confere os eventos: cada um precisa de nome, dia da semana e um horário de fim depois do início.');
    return;
  }
  const validos = validarBlocos(blocos);
  if(!validos){
    alert('Confere os horários: cada etapa precisa terminar depois de começar, e uma etapa não pode começar antes da anterior terminar.');
    return;
  }
  try{
    await sb('cronograma?on_conflict=id', {
      method:'POST',
      prefer:'resolution=merge-duplicates,return=minimal',
      body:{id:1, blocos: validos, eventos: eventosValidos, atualizado_em: new Date().toISOString()}
    });
  }catch(e){
    console.error('Falha ao salvar o cronograma', e);
    alert(/HTTP 404|PGRST205/.test(e.message)
      ? 'A tabela do cronograma ainda não foi criada no Supabase. Roda o trecho do cronograma do supabase/schema.sql e tenta de novo.'
      : 'Não foi possível salvar os horários. Verifica sua conexão e tenta de novo.');
    return;
  }
  cronoBlocos = validos;
  cronoEventos = eventosValidos;
  try{ localStorage.setItem(CRONO_CACHE_KEY, JSON.stringify(validos)); localStorage.setItem(CRONO_EVENTOS_KEY, JSON.stringify(eventosValidos)); }catch(e){}
  state.cronoDraft = null;
  state.cronoEventosDraft = null;
  render();
  showCronoToast('Cronograma', 'Horários salvos');
}

/*
  Producao do time (aba "Producao" do admin). Cada mes de cada equipe vale o
  numero fechado em `producao_mensal` (historico das planilhas ou correcao manual);
  se nao tem, vale a soma das vendas registradas no site naquele mes.
*/
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CANAIS_VENDA = ['Lead - Trafego Pago','Facebook','TikTok','Indicação','Outro'];
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
function brlCurto(v){
  if(v >= 1e6) return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(v >= 1e3) return Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
  return Math.round(v).toLocaleString('pt-BR');
}
// "1.517.156,10" / "400000" / "R$ 400.000" -> numero (ponto e separador de milhar)
function parseBRL(s){
  s = String(s||'').replace(/R\$|\s/g,'');
  if(!s) return null;
  s = s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s.replace(/\./g,'');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

async function loadProducao(){
  try{
    const [equipes, manual, vendas] = await Promise.all([
      sb('equipes?select=nome,coordenadores,ativa,ordem&order=ordem,nome', undefined, 1),
      sb('producao_mensal?select=ano,mes,equipe,valor', undefined, 1),
      sb('vendas?select=id,vendedor,equipe,data,valor,cliente,canal&order=data.desc,id.desc', undefined, 1)
    ]);
    state.prod = {
      equipes: equipes || [],
      manual: (manual || []).map(r=>({...r, valor:Number(r.valor)})),
      vendas: (vendas || []).map(r=>({...r, valor:Number(r.valor)}))
    };
  }catch(e){
    console.error('Falha ao carregar a produção', e);
    if(!state.prod) state.prod = {erro:true};
  }
  if(state.view==='admin') render();
}

// Valor de uma equipe num mes: {valor, fonte:'manual'|'vendas'} ou null se nao tem nada
function prodCelula(ano, mes, equipe){
  const p = state.prod;
  const m = p.manual.find(r=>r.ano===ano && r.mes===mes && r.equipe===equipe);
  if(m) return {valor:m.valor, fonte:'manual'};
  const chave = ano+'-'+String(mes).padStart(2,'0');
  const vs = p.vendas.filter(v=>v.equipe===equipe && v.data.slice(0,7)===chave);
  return vs.length ? {valor: vs.reduce((s,v)=>s+v.valor,0), fonte:'vendas'} : null;
}
function prodAnos(){
  const p = state.prod, atual = new Date().getFullYear();
  const anos = new Set([atual, ...p.manual.map(r=>r.ano), ...p.vendas.map(v=>Number(v.data.slice(0,4)))]);
  return [...anos].sort((a,b)=>a-b);
}
// Equipes que aparecem no ano: as que produziram nele, mais as ativas no ano atual
function prodEquipesDoAno(ano){
  const atual = new Date().getFullYear();
  return state.prod.equipes.filter(eq=>
    (eq.ativa && ano >= atual) || MESES.some((_,i)=>prodCelula(ano, i+1, eq.nome))
  );
}
function prodTotalMes(ano, mes){
  let tem = false, soma = 0;
  state.prod.equipes.forEach(eq=>{ const c = prodCelula(ano, mes, eq.nome); if(c){ tem = true; soma += c.valor; } });
  return tem ? soma : null;
}

// ---- Perfil do vendedor (foto, apelido, frase, aniversario) ----
// foto e cortada em quadrado e reduzida antes de subir, pra carregar leve em todo lugar
async function prepararFoto(file){
  const img = await createImageBitmap(file);
  const lado = Math.min(img.width, img.height), tam = 360;
  const c = document.createElement('canvas'); c.width = c.height = tam;
  c.getContext('2d').drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, tam, tam);
  return await new Promise(res=>c.toBlob(res, 'image/jpeg', .86));
}
async function enviarFoto(nome, file){
  const blob = await prepararFoto(file);
  const caminho = `${slugNome(nome)}-${Date.now()}.jpg`;
  const res = await fetch(SUPABASE_URL + '/storage/v1/object/fotos/' + caminho, {
    method:'POST', headers:{...(await cabecalhoAuth()), 'Content-Type':'image/jpeg'}, body: blob
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));
  return SUPABASE_URL + '/storage/v1/object/public/fotos/' + caminho;
}
